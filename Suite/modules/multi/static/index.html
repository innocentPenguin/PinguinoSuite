<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PinguinoMulti</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#09090a;--fg:#ececef;--dim:#a39f98;--faint:#85827b;--panel:#131315;--bad:#ff5a5f;--warn:#e8d44d;--mut:var(--dim);--card:var(--panel);--line:#26262a;--accent:#ff9900;--on-accent:#1a1000;--hi:var(--bad);--med:var(--warn);--low:var(--faint);--ok:#3ecf8e;--fs:14px;--sp:4px}
:root[data-theme=light]{--bg:#f6f4f0;--fg:#1a1a1c;--mut:#6b6b70;--card:#fff;--line:#e0dcd4;--accent:#e68a00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:var(--fs)/1.35 system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:8px;align-items:center;padding:4px 8px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mut);-webkit-app-region:drag}
header b{color:var(--fg)} header button,header select{-webkit-app-region:no-drag}
.dot{width:8px;height:8px;border-radius:50%;background:#666;display:inline-block}.dot.connected{background:var(--ok)}.dot.reconnecting,.dot.connecting{background:var(--med)}.dot.needs_auth,.dot.error{background:var(--hi)}
#feed{flex:1;overflow-y:auto;padding:4px 8px}
.msg{padding:var(--sp) 0;border-bottom:1px solid transparent;word-break:break-word}
.msg .t{color:var(--mut);font-size:.8em;margin-right:6px}.msg .u{font-weight:600;margin-right:6px}
.msg.tier-high{border-left:3px solid var(--hi);padding-left:6px}.msg.tier-medium{border-left:3px solid var(--med);padding-left:6px}.msg.tier-low{border-left:3px solid var(--low);padding-left:6px}
.msg.self{opacity:.7}.pf{font-size:.7em;padding:0 4px;border-radius:3px;background:var(--line);margin-right:4px}
.cards{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:6px}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--med);border-radius:6px;padding:8px;transition:opacity 1s}
.card.high{border-left-color:var(--hi)}.card.answered{border-left-color:var(--ok);opacity:.6}.card.missed{border-left-color:#777}
.card .hd{display:flex;gap:6px;align-items:center;font-size:.85em;color:var(--mut)}.card .hd b{color:var(--fg)}
.card .tx{margin:4px 0;font-size:1.05em}.why{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.chip{font-size:.72em;background:var(--line);border-radius:10px;padding:1px 7px}.chip.neg{background:#3a1b1b}
.act{display:flex;gap:4px;flex-wrap:wrap}
button{background:var(--line);color:var(--fg);border:0;border-radius:4px;padding:3px 8px;cursor:pointer;font:inherit;font-size:.85em}
button:hover{filter:brightness(1.25)}button.p{background:var(--accent);color:var(--on-accent);font-weight:600}
input:focus,textarea:focus,select:focus{outline:1px solid var(--accent);border-color:var(--accent)}
input,textarea,select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:5px;font:inherit}
.compose{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}.compose textarea{flex:1;resize:none}
.row{display:flex;gap:6px;align-items:center}
.status{padding:8px;overflow:auto}.status div{padding:4px 0;border-bottom:1px solid var(--line)}
h4{margin:6px 8px;font-size:.8em;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.empty{color:var(--mut);padding:12px;text-align:center}
.warn{background:#2a2008;color:#ffd98a;padding:4px 8px;font-size:.8em}
body.linked #feed{overflow:hidden}body.linked .msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box;height:calc(var(--fs)*1.5 + var(--sp)*2)}
.launch{padding:10px 14px;overflow:auto;flex:1;max-width:900px;line-height:1.45}
.launch h2{margin:0 0 4px}.launch h3{margin:18px 0 6px;font-size:1.05em;display:flex;align-items:center;gap:8px}
.launch .n{background:var(--accent);color:var(--on-accent);border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:.8em}
.mut{color:var(--mut)}.intro{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px}.intro p{margin:6px 0}
.hlp{display:inline-flex;width:15px;height:15px;border-radius:50%;background:var(--line);color:var(--mut);font-size:.7em;align-items:center;justify-content:center;cursor:help}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:6px 0;padding:8px 12px}.pcard summary{cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pcard label{display:flex;flex-direction:column;gap:3px;margin:8px 0;font-size:.9em}.pcard label.chk,.box label.chk{flex-direction:row;align-items:center;gap:6px}
.how{color:var(--mut);margin:8px 0;font-size:.9em}.how.warn{color:#ffd98a}.detail{margin:6px 0 0;color:var(--mut);font-size:.85em}
.st{font-size:.85em}.st.ok{color:var(--ok)}.st.todo,.st.wait{color:var(--med)}.st.bad{color:var(--hi)}.st.off{color:var(--mut)}
.tag{font-size:.7em;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--med)}.okc{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:6px 0}.grid.small{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.tile{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--card);border:1px solid var(--line);padding:8px 10px;border-radius:8px}.tile small{color:var(--mut)}
.wrow{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}.grow{flex:1}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.box label{display:flex;flex-direction:column;gap:3px;font-size:.9em}.box details{margin:4px 0}
.tok,.tbad{padding:6px 10px;border-radius:6px;margin:8px 0}.tok{background:#12301f;color:#8de0b5}.tbad{background:#3a1717;color:#ffb0b0}
.chk-row{padding:4px 0}.keys{margin-top:18px;font-size:.85em}
.msg.bot{opacity:.65}.msg.bot .u{font-style:italic}
.cbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:5px 8px;border-bottom:1px solid var(--line)}.grow{flex:1}
.chip2{display:inline-flex;gap:5px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 9px;font-size:.78em}a.chip2{color:var(--fg);text-decoration:none}.chip2.off{opacity:.4;text-decoration:line-through}.chip2.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cstrip{padding:4px 8px;display:flex;flex-direction:column;gap:5px;border-bottom:1px solid var(--line);max-height:36%;overflow:auto}
.cc{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--med);border-radius:6px;padding:5px 8px;font-size:.92em}.cc.high{border-left-color:var(--hi)}.cc .ch{display:flex;gap:6px;color:var(--mut);align-items:center}.cc .ch b{color:var(--fg)}
.cnone{padding:2px 0;font-size:.85em}.lnk{background:none;color:var(--mut);text-decoration:underline;padding:0;align-self:flex-start}
.cfeed{flex:1;overflow-y:auto;padding:4px 8px}.cfeed .msg{position:relative}.cfeed .msg.nodim{opacity:1}
.bt{font-size:.65em;border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-right:6px;color:var(--mut)}.bt.first{color:var(--ok);border-color:var(--ok)}.rep{color:var(--mut);font-size:.85em;margin-right:6px}
.rb{position:absolute;right:0;top:2px;opacity:0;padding:0 6px}.cfeed .msg:hover .rb{opacity:1}
.ccomp{padding:6px 8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}.ctgt{font-size:.85em;color:var(--mut)}
.bd{font-size:.6em;color:#fff;border-radius:3px;padding:0 4px;margin-right:4px;vertical-align:middle;font-weight:700}
.emo{height:1.6em;vertical-align:middle;margin:0 1px}
.msg.mention{background:rgba(245,166,35,.16);border-radius:4px}.msg.modmsg .u{text-decoration:underline dotted}
.tools{position:absolute;right:0;top:0;display:none;gap:2px;background:var(--card);border-radius:4px;padding:1px}.cfeed .msg:hover .tools{display:flex}.tools button{padding:0 5px}
.notice{color:var(--mut);font-size:.8em;text-align:center;padding:3px}.pin{background:var(--card);border-left:3px solid var(--ok);padding:3px 8px;margin:3px 8px;border-radius:4px;font-size:.9em}
body.popout{background:transparent!important;height:auto;min-height:100vh;justify-content:flex-end}
.pfeed{display:flex;flex-direction:column;justify-content:flex-end;padding:8px;color:#fff;text-shadow:0 1px 3px #000,0 0 2px #000;font-size:var(--fs)}
.pm{padding:2px 0;word-break:break-word}.pm b{margin-right:6px}
.tile:hover,.pcard[open]{border-color:var(--accent)}.intro{border-left:3px solid var(--accent)}.launch h2{color:var(--accent)}a{color:var(--accent)}header b{color:var(--accent)}
.tbadc{color:var(--bad)}input[type=range]{accent-color:var(--accent);padding:0}
.cf{display:inline-flex;align-items:center;gap:6px;margin:4px 14px 4px 0;font-size:.88em}.cf input[type=range]{width:110px}.cf b{min-width:38px}
.rule{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;background:var(--card)}.rt{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.rg{display:flex;flex-wrap:wrap}.style-ed summary{cursor:pointer}.style-ed summary h3{display:inline}.style-ed input[type=color]{width:34px;height:24px;padding:0;border:1px solid var(--line);background:none}
.cs-prev-wrap{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0;border-bottom:1px solid var(--line)}.cs-preview{max-height:300px;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.evl{font-size:.68em;font-weight:700;letter-spacing:.05em;border:1px solid currentColor;border-radius:3px;padding:0 5px;margin-right:6px;opacity:.9}
.cassist{border-top:1px solid var(--line);padding:6px 10px;max-height:40%;overflow:auto;background:var(--card)}.ahd{display:flex;justify-content:space-between}
.sug{display:flex;gap:8px;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:6px;padding:5px 8px;margin:4px 0}.chrec{max-height:90px;overflow:auto;border-left:2px solid var(--line);padding-left:8px;margin:4px 0;color:var(--dim)}
.chcard textarea,#ctpls{width:100%}.tpls{display:flex;gap:5px;flex-wrap:wrap;align-items:center}.u[data-chatter]{cursor:pointer}.u[data-chatter]:hover{text-decoration:underline}
.szbox{display:inline-flex;gap:4px;align-items:center;margin-right:8px}.lksz{min-width:22px;text-align:center}
#sidep{position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);transform:translateX(100%);transition:transform .18s;background:var(--bg);border-left:2px solid var(--accent);z-index:50;display:flex;flex-direction:column}
#sidep.open{transform:none}body.side-open #body{margin-right:min(440px,94vw)}.sidehd{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}.sidehd input{flex:1;min-width:0}
#sidebody{flex:1;overflow:auto;padding:6px 10px 40px}.sec{border-bottom:1px solid var(--line);padding:6px 0}.sec summary{cursor:pointer;padding:4px 0;font-size:1.05em}.sbody{padding:4px 0 6px}.sbody h4{margin:.8em 0 .2em}
#sidebtn{position:fixed;right:0;top:42%;z-index:49;background:var(--accent);color:#111;border:0;border-radius:8px 0 0 8px;padding:10px 6px;writing-mode:vertical-rl;font-weight:700;cursor:pointer;box-shadow:-2px 2px 8px #0008}
body.side-open #sidebtn{display:none}
#sidebody{overflow-x:hidden}#sidebody .cf{display:flex;width:100%;justify-content:space-between;gap:8px;margin:5px 0}#sidebody .cf input[type=range]{flex:1;min-width:60px}#sidebody .rg{display:block}#sidebody label{max-width:100%}#sidebody input[type=text],#sidebody select{max-width:60%}
.ed-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}.ed-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.ed-right{position:sticky;top:0}.cs-pwrap{border:1px solid var(--line);border-radius:10px;padding:6px;margin-top:6px}.cs-preview{height:calc(100vh - 130px);min-height:360px;overflow-y:auto;background:transparent;border:0}
.ed-left section{margin-bottom:22px}.ed-left h3{margin:.4em 0}.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pcardl{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}.pcardl.cur{border-color:var(--accent)}.pv{height:128px;overflow:hidden;padding:4px}.pmeta{padding:8px 10px}
.qrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:5px 0}.qrow .chk{min-width:210px}.qrow .more{flex-basis:100%}.qrow .more summary{cursor:pointer;color:var(--mut);font-size:.85em}.qv{min-width:38px}
@media(max-width:900px){.ed-grid{grid-template-columns:1fr}.ed-right{position:static;order:-1}.cs-preview{height:260px;min-height:0}}
</style>
<!--THEME--></head><body>
<header id="hdr"></header><div id="body" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
<script src="/assets/launcher.js"></script>
<script src="/assets/style.js"></script>
<script src="/assets/chat.js"></script>
<script src="/assets/side.js"></script>
<script src="/assets/obs_ui.js"></script>
<script src="/assets/dash.js"></script>
<script src="/assets/chatux.js"></script>
<script src="/assets/alerts_ui.js"></script>
<script>
const q = new URLSearchParams(location.search), WID = q.get('win');
const HALF = q.get('half'), PID = q.get('pane'), POPLABEL = q.get('pop');
let W = {type: location.pathname === '/popout' ? 'popout' : (q.get('type') || 'launcher'), platforms: [], min_tier: 'none'};
if (HALF && W.type === 'chat') { W.type = 'unified'; W.link_group = 'chat-split'; W.link_order = (HALF === 'top' || HALF === 'left') ? 1 : 0; }   // one chat spread over two windows: older rows in the top/left one
const TIERS = {none: 0, low: 1, medium: 2, high: 3};
let conns = [], cards = {open: [], answered: [], missed: []}, msgs = [], target = null;
const $ = (s, e = document) => e.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const api = (p, o) => fetch(p, o && {method: o.m || 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(o.b || {})}).then(r => r.json());
const hhmm = t => new Date(t * 1000).toTimeString().slice(0, 5);

async function init() {
  if (PID) {
    try { const r = await fetch('/api/panes/' + encodeURIComponent(PID)); if (r.ok) PANE = await r.json(); } catch (e) { /* no pane: behave as a plain chat window */ }
    if (PANE) {
      W.title = PANE.name || W.title;
      if (PANE.flow) { W.type = 'unified'; W.link_group = PANE.flow.group; W.link_order = PANE.flow.order; }
      else if (W.type === 'launcher') W.type = 'chat';
    }
  }
  await loadStyle();
  if (WID) {
    const all = await api('/api/windows');
    W = all.find(w => w.id === WID) || W;
  }
  document.documentElement.dataset.theme = W.theme || 'dark';
  if (W.font_size && W.font_size !== 14) document.documentElement.style.setProperty('--fs', W.font_size + 'px');   // a window's own size wins over the chat look
  if (W.spacing && W.spacing !== 4) document.documentElement.style.setProperty('--sp', W.spacing + 'px');
  document.body.style.opacity = W.opacity || 1;
  if (!['launcher', 'status', 'style', 'obs', 'alerts'].includes(W.type)) msgs = await api('/api/messages?limit=200');
  cards = await api('/api/cards');
  connect(); render(); setInterval(() => { api('/api/cards').then(c => { cards = c; renderCards(); }); }, 5000);
  if (WID) savePosition();
  else if (PID || POPLABEL) reportGeom(PID ? 'pane-' + PID : POPLABEL);
}
function savePosition() {
  let last = '';
  setInterval(() => {
    const g = {x: screenX, y: screenY, w: outerWidth, h: outerHeight}, s = JSON.stringify(g);
    if (s !== last) { last = s; api('/api/windows/' + WID, {m: 'PUT', b: g}); }
  }, 3000);
}
function reportGeom(label) {      // remembers where this pop-out window sits so it reopens there (also asked of the shell)
  let last = '';
  setInterval(() => {
    const g = {x: screenX, y: screenY, w: outerWidth, h: outerHeight}, j = JSON.stringify(g);
    if (j !== last && g.w > 100) { last = j; api('/api/geom/' + label, {b: g}).catch(() => {}); }
  }, 3000);
}
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = e => on(JSON.parse(e.data));
  ws.onclose = () => setTimeout(connect, 2000);
}
function on(ev) {
  if (ev.type === 'hello') { conns = ev.connectors; cards = ev.cards; render(); if (window.dashViewers) window.dashViewers(ev.viewers); }
  else if (ev.type === 'viewers') { if (window.dashViewers) window.dashViewers(ev.counts); }
  else if (ev.type === 'conn.status') { conns = conns.filter(c => c.platform !== ev.platform).concat(ev); renderHeader(); if (window.dashConn) window.dashConn(); if (W.type === 'status') renderStatus(); if (W.type === 'chat') { chatBar(); chatCompose(); } }
  else if (ev.type === 'message') {
    msgs.push(ev.message); if (msgs.length > 500) msgs.shift(); addMsg(ev.message);
    if (ev.message.event === 'follow' && window.cardFollow && ['chat', 'dash'].includes(W.type)) window.cardFollow(ev.message);
    if (W.type === 'popout' && window.popAdd) window.popAdd(ev.message);
    if (W.type === 'dash' && window.dashAdd) window.dashAdd(ev.message);
  } else if (ev.type === 'pins.changed') { PINS = ev.pins || []; if (W.type === 'chat') { chatPins(); chatFeed(); } }
  else if (ev.type === 'chatstyle.changed') { CS = ev.style; applyStyle(); if (W.type === 'chat') chatFeed(); if (W.type === 'style') renderPreview(); } else if (ev.type === 'card.new' || ev.type === 'card.update') api('/api/cards').then(c => { cards = c; renderCards(); if (W.type === 'chat') chatStrip(); });
  else if (ev.type === 'pane.changed' && PID && ev.id === PID) {
    if (!ev.pane) { document.body.innerHTML = '<div class="empty">This window was removed.</div>'; return; }
    PANE = ev.pane; applyStyle(); renderHeader(); if (W.type === 'chat') { chatFeed(); } else render();
  } else if (ev.type === 'layout.changed') { if (W.type === 'launcher') renderLauncher(); }
}
const PROLE = m => { const bd = m.badges || [], r = []; if (bd.includes('broadcaster') || MYNAMES.has((m.user || '').toLowerCase())) r.push('streamer');
  if (bd.includes('moderator')) r.push('mod'); if (bd.includes('vip')) r.push('vip'); if (bd.includes('subscriber') || bd.includes('founder')) r.push('sub');
  if (isBot(m)) r.push('bot'); if (!r.length) r.push('viewer'); return r; };
function paneOk(m) {      // this window is a pane (split half / extra window) with its own filter
  if (!PANE) return true;
  const f = PANE.filter || {};
  if (f.platforms && f.platforms.length && !f.platforms.includes(m.platform)) return false;
  if (f.kind === 'chat' && m.event) return false;
  if (f.kind === 'events' && !m.event) return false;
  if (f.roles && f.roles.length && PROLE(m).some(r => f.roles.includes(r)) === !!f.invert_roles) return false;
  return true;
}
function pass(m) {
  return paneOk(m) && (!W.platforms.length || W.platforms.includes(m.platform)) && TIERS[m.tier || 'none'] >= TIERS[W.min_tier || 'none'];
}
function msgHtml(m) {
  const reasons = (m.reasons || []).map(r => `${r.rule} ${r.points > 0 ? '+' : ''}${r.points}`).join(', ');
  return `<div class="msg tier-${m.tier}${m.is_self ? ' self' : ''}${isBot(m) ? ' bot' : ''} ${styleClasses(m)}" title="${esc(reasons ? 'score ' + m.score + ': ' + reasons : '')}">
  <span class="t">${hhmm(m.ts)}</span>${markerHtml(m.platform)}<span class="u">${esc(m.display || m.user)}</span>${esc(m.text)}</div>`;
}
function addMsg(m) {
  if (!['unified', 'platform', 'first', 'chat'].includes(W.type) || !pass(m)) return;
  if (W.type === 'chat') { chatAdd(m); return; }
  if (W.type === 'first' && !m.first_time) return;
  const f = $('#feed'); if (!f) return;
  if (chan) { renderLinked(); return; }
  const atEnd = f.scrollTop + f.clientHeight >= f.scrollHeight - 30;
  f.insertAdjacentHTML('beforeend', msgHtml(m));
  while (f.children.length > 500) f.firstChild.remove();
  if (W.scroll !== 'manual' && window.AUTO !== false && atEnd) f.scrollTop = f.scrollHeight;
}
function renderHeader() {
  const dots = conns.map(c => `<span title="${esc(c.label)}: ${esc(c.status)} ${esc(c.detail || '')}${c.official ? '' : ' (UNOFFICIAL)'}"><span class="dot ${c.status}"></span> ${esc(c.label)}${c.capabilities && !c.capabilities.send ? ' (read-only)' : ''}</span>`).join(' ');
  $('#hdr').innerHTML = `<b>PinguinoMulti</b> ${esc(W.title || W.type)} ${dots}`;
}
function render() {
  renderHeader();
  ({unified: renderFeed, platform: renderFeed, first: renderFeed, priority: renderCards, missed: renderCards,
    composer: renderComposer, status: renderStatus, launcher: renderLauncher, chat: renderChat, popout: renderPopout, style: renderStyleEditor, obs: renderObsEditor, alerts: renderAlertsEditor, dash: renderDash}[W.type] || renderFeed)();
}
// linked feed: windows in one link_group show ONE continuous sequence. link_order 0 shows the newest rows,
// order 1 continues with the rows just older, and so on. Capacity (rows) is shared over BroadcastChannel.
function linkSlice(list, caps, order) {
  const off = Object.values(caps).filter(c => c.order < order).reduce((a, c) => a + c.rows, 0);
  const rows = (caps[order] || {rows: 0}).rows;
  return list.slice(Math.max(0, list.length - off - rows), Math.max(0, list.length - off));
}
const peers = {}; let chan = null;
function feedList() { return msgs.filter(m => pass(m) && (W.type !== 'first' || m.first_time)); }
function myRows(f) { return Math.max(1, Math.floor(f.clientHeight / (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs')) * 1.5 + (W.spacing || 4) * 2))); }
function renderLinked() {
  const f = $('#feed'); if (!f) return;
  const order = W.link_order || 0, rows = myRows(f);
  peers[order] = {order, rows}; chan && chan.postMessage({order, rows});
  f.innerHTML = linkSlice(feedList(), peers, order).map(msgHtml).join('') || '<div class="empty">No messages yet</div>';
}
function startLink() {
  if (!W.link_group || typeof BroadcastChannel === 'undefined') return;
  document.body.classList.add('linked');
  chan = new BroadcastChannel('multi-link-' + W.link_group);
  chan.onmessage = e => { peers[e.data.order] = e.data; renderLinked(); };
  addEventListener('resize', renderLinked); renderLinked();
}
function renderFeed() {
  $('#body').innerHTML = '<div id="feed"></div>';
  const f = $('#feed');
  if (W.link_group && W.type !== 'first') { if (!chan) startLink(); else renderLinked(); if (chan) return; }
  f.innerHTML = feedList().map(msgHtml).join('') || '<div class="empty">No messages yet</div>';
  f.scrollTop = f.scrollHeight;
}
function cardHtml(c, kind) {
  const why = (c.reasons || []).map(r => `<span class="chip ${r.points < 0 ? 'neg' : ''}" title="${esc(r.detail || '')}">${esc(r.rule)} ${r.points > 0 ? '+' : ''}${r.points}</span>`).join('');
  const ctx = (c.context || []).map(x => `<div style="color:var(--mut);font-size:.85em">${esc(x.user)}: ${esc(x.text)}</div>`).join('');
  const acts = kind === 'open'
    ? `<button class="p" data-a="answer" data-id="${esc(c.id)}">Answered</button><button data-a="reply" data-id="${esc(c.id)}">Reply</button><button data-a="snooze" data-id="${esc(c.id)}">Snooze 5m</button><button data-a="dismiss" data-id="${esc(c.id)}">Dismiss</button>`
    : kind === 'missed' ? `<button class="p" data-a="reopen" data-id="${esc(c.id)}">Reopen</button><button data-a="answer" data-id="${esc(c.id)}">Answered</button><button data-a="dismiss" data-id="${esc(c.id)}">Dismiss</button>`
    : `<span style="color:var(--ok)">answered (${esc(c.answered_via)})</span>`;
  return `<div class="card ${c.tier === 'high' ? 'high' : ''} ${kind}"><div class="hd"><span class="pf">${esc(c.platform)}</span><b>${esc(c.display)}</b><span>${hhmm(c.msg_ts)}</span><span style="margin-left:auto">score ${c.score}</span></div>
  ${ctx}<div class="tx">${esc(c.text)}</div><div class="why">${why}</div><div class="act">${acts}</div></div>`;
}
function renderCards() {
  if (!['priority', 'missed'].includes(W.type)) return;
  const sec = (label, arr, kind) => arr.length ? `<h4>${label} (${arr.length})</h4>` + arr.map(c => cardHtml(c, kind)).join('') : '';
  const html = W.type === 'missed' ? sec('Missed', cards.missed, 'missed')
    : sec('Needs a reply', cards.open.filter(c => pass(c)), 'open') + sec('Answered', cards.answered, 'answered') + (cards.missed.length ? `<h4>Missed: ${cards.missed.length} (open the Missed window)</h4>` : '');
  $('#body').innerHTML = `<div class="cards">${html || '<div class="empty">Nothing needs a reply</div>'}</div>`;
}
document.addEventListener('keydown', e => {
  if (!['priority', 'missed'].includes(W.type) || /INPUT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.altKey) return;
  const act = {a: 'answer', d: 'dismiss', s: 'snooze'}[e.key.toLowerCase()];
  if (act) api('/api/hotkey/' + act);
});
document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const id = b.dataset.id, a = b.dataset.a;
  if (a === 'reply') { target = cards.open.concat(cards.missed).find(c => c.id === id); if (W.type === 'composer') renderComposer(); else alert('Open a Composer window (Reply) - target set to ' + target.display); return; }
  await api('/api/cards/' + encodeURIComponent(id) + '/' + a, {b: {seconds: 300}});
  cards = await api('/api/cards'); renderCards();
});
function renderComposer() {
  const sendable = conns.filter(c => c.capabilities && c.capabilities.send);
  $('#body').innerHTML = `<div class="compose">
    ${sendable.length ? '' : '<div class="warn">No platform is connected for sending. Connect Twitch in Settings.</div>'}
    <div class="row"><select id="plat">${sendable.map(c => `<option value="${esc(c.platform)}">${esc(c.label)}</option>`).join('')}</select>
    <span id="tgt" style="color:var(--mut)">${target ? 'Replying to ' + esc(target.display) + ': ' + esc(target.text.slice(0, 40)) : 'New message (not a reply)'}</span>
    ${target ? '<button id="clr">Clear</button>' : ''}</div>
    <textarea id="txt" maxlength="500" placeholder="Type a message. It goes to ONE platform only."></textarea>
    <div class="row"><button class="p" id="go">Send</button><span id="res" style="color:var(--mut)"></span></div></div>`;
  if ($('#clr')) $('#clr').onclick = () => { target = null; renderComposer(); };
  if (target && $('#plat')) $('#plat').value = target.platform;
  $('#go').onclick = send; $('#txt').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
}
async function send() {
  const text = $('#txt').value.trim(); if (!text) return;
  const body = {platform: $('#plat').value, text};
  if (target && target.platform === body.platform) { body.reply_to = target.message_id; body.card_id = target.id; }
  const r = await fetch('/api/send', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body)}).then(r => r.json());
  $('#res').textContent = r.ok ? 'Sent' : (r.detail || 'failed');
  if (r.ok) { $('#txt').value = ''; target = null; renderComposer(); }
}
async function renderStatus() {
  const s = await api('/api/status');
  $('#body').innerHTML = `<div class="status"><div>Mode: <b>${esc(s.mode)}</b> &middot; queue ${s.queue} &middot; in ${s.stats.in}, dupes ${s.stats.dupes}, dropped ${s.stats.dropped}</div>` +
    s.connectors.map(c => `<div><span class="dot ${c.status}"></span> <b>${esc(c.label)}</b> ${esc(c.status)} ${esc(c.detail || '')}<br><small>${c.official ? 'official API' : 'UNOFFICIAL'} &middot; ${Object.entries(c.capabilities).filter(([, v]) => v).map(([k]) => k).join(', ')} &middot; reconnects ${c.reconnects}</small></div>`).join('') + '</div>';
}
init();
</script></body></html>
