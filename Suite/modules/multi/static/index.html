<!--THEME--></head><body>
<header id="hdr"></header><div id="body" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
<script src="/assets/launcher.js"></script>
<script src="/assets/connect.js"></script>
<script src="/assets/style.js"></script>
<script src="/assets/chat.js"></script>
<script src="/assets/sounds.js"></script>
<script src="/assets/side.js"></script>
<script src="/assets/obs_ui.js"></script>
<script src="/assets/dash.js"></script>
<script src="/assets/chatux.js"></script>
<script src="/assets/alerts_ui.js"></script>
<script>
const q = new URLSearchParams(location.search), WID = q.get('win');
const HALF = q.get('half'), PID = q.get('pane'), POPLABEL = q.get('pop');
let W = {type: location.pathname === '/popout' ? 'popout' : (q.get('type') || 'dash'), platforms: [], min_tier: 'none'};
if (HALF && W.type === 'chat') { W.type = 'unified'; W.link_group = 'chat-split'; W.link_order = (HALF === 'top' || HALF === 'left') ? 1 : 0; }   // one chat spread over two windows: older rows in the top/left one
const TIERS = {none: 0, low: 1, medium: 2, high: 3};
let conns = [], cards = {open: [], answered: [], missed: []}, msgs = [], target = null;

// History: every list is built from `msgs`, which is only ever added to (loaded history + live tail), never cut below what was loaded.
// Chat and events load separately so a busy chat can never push the activity feed out; "Load older" goes further back on demand.
const HIST = {ids: new Set(), done: {chat: false, events: false}, kindOk: null, busy: {}, cap: 3000};   // cap = rows drawn per list; the DOM only trims past it
const clrTag = m => m.cleared ? '<span class="clr" title="Removed from the platform chat (kept here)">cleared</span>' : '';
function histMerge(rows) {
  let n = 0;
  for (const m of Array.isArray(rows) ? rows : []) { if (!m || !m.id || HIST.ids.has(m.id)) continue; HIST.ids.add(m.id); msgs.push(m); n++; }
  if (n) msgs.sort((a, b) => (a.ts || 0) - (b.ts || 0));
  return n;
}
async function histGet(qs) { try { const r = await fetch('/api/messages?' + qs); return r.ok ? await r.json() : []; } catch (e) { return []; } }
async function histInit() {
  const [c, e] = await Promise.all([histGet('kind=chat&limit=500'), histGet('kind=events&limit=500')]);
  HIST.kindOk = !(e.some(m => !m.event) || c.some(m => m.event));     // an old backend ignores kind= and sends the same mixed rows for both
  histMerge(c); histMerge(e);
  if (!HIST.kindOk) histMerge(await histGet('limit=1000'));
  HIST.done.chat = HIST.kindOk ? c.length < 500 : msgs.length < 1000;
  HIST.done.events = HIST.kindOk ? e.length < 500 : HIST.done.chat;
}
async function histOlder(kind) {
  if (HIST.done[kind] || HIST.busy[kind]) return 0;
  HIST.busy[kind] = true;
  try {
    const mine = msgs.filter(m => kind === 'events' ? m.event : !m.event), lim = HIST.kindOk ? 500 : 1000;
    const rows = await histGet((HIST.kindOk ? 'kind=' + kind + '&' : '') + 'before=' + (mine.length ? mine[0].ts : Date.now() / 1000) + '&limit=' + lim);
    const n = histMerge(rows);
    if (rows.length < lim || !n) { HIST.done[kind] = true; if (!HIST.kindOk) HIST.done.chat = HIST.done.events = true; }
    HIST.cap += n;
    return n;
  } finally { HIST.busy[kind] = false; }
}
function histRedraw() {
  if (W.type === 'chat') chatFeed(); else if (W.type === 'dash') dFill();
  else if (['unified', 'platform', 'first'].includes(W.type) && typeof renderFeed === 'function') renderFeed();
}
async function histMore(kind) {
  const lists = [...document.querySelectorAll('.cfeed,.d-list')], was = lists.map(l => [l, l.scrollHeight, l.scrollTop]);
  if (!await histOlder(kind)) { document.querySelectorAll('[data-hist="' + kind + '"]').forEach(b => b.remove()); return; }
  histRedraw();
  for (const [l, h, t] of was) l.scrollTop = l.id === 'd-l-activity' ? t : t + (l.scrollHeight - h);     // keep what the viewer was reading
}
async function histRefresh() {       // after a reconnect: fill the gap, keep everything already shown
  if (histMerge(await histGet('limit=200'))) histRedraw();
}
function markCleared(ev) {
  const ids = new Set(ev.ids || []), hit = [], all = ev.scope === 'all' || ev.scope === 'chat';
  for (const m of msgs) {
    if (m.cleared || (m.event && !ids.has(m.id))) continue;
    if (ids.has(m.id) || all || (ev.scope === 'user' && ev.user_id && m.user_id === ev.user_id)) { m.cleared = ev.reason || true; hit.push(m.id); }
  }
  for (const id of hit) clearedDom(id);
}
function clearedDom(id) {
  const q = String(id).replace(/["\\]/g, '\\$&');
  document.querySelectorAll('[data-mid="' + q + '"],[data-id="' + q + '"]').forEach(el => {
    el.classList.add('cleared');
    if (!el.querySelector('.clr')) { const host = el.querySelector('.d-main') || el.querySelector('span:not(.d-ic):not(.d-age):not(.t)') || el; host.insertAdjacentHTML('beforeend', clrTag({cleared: true})); }
  });
}

// Reading cursor ("finger on the screen"): keyboard-moved highlight in the chat lists. It keeps its message id, so new lines arrive below it
// without moving the view; End/Esc returns to the live tail.
const CUR = {id: null, list: null};
const CUR_BOT = /^(pinguinob0t|pinguinobot|chattypinguino|pinguinohelper|soundalerts|sery_bot)$/i;
const curLists = () => [...document.querySelectorAll('#cfeed,#d-l-chat,#d-l-chat-a,#d-l-chat-b')];
const curRows = l => [...l.children].filter(el => el.dataset.id || el.dataset.mid);
const curRid = el => el.dataset.id || el.dataset.mid;
function curBotSet() {
  const s = new Set(); for (const m of msgs) if (isBot(m) || CUR_BOT.test(m.user || '') || (typeof SND_BOTS !== 'undefined' && SND_BOTS.test((m.user || '').toLowerCase()))) s.add(m.id);
  return s;
}
function curApply() {
  document.querySelectorAll('.rcur').forEach(e => e.classList.remove('rcur'));
  if (!CUR.id) return;
  const q = String(CUR.id).replace(/["\\]/g, '\\$&'), el = document.querySelector('[data-id="' + q + '"],[data-mid="' + q + '"]');
  if (el && el.closest('.d-list,.cfeed')) el.classList.add('rcur');
}
function curShow(el, l) {
  const a = el.getBoundingClientRect(), b = l.getBoundingClientRect();
  if (a.top < b.top) l.scrollTop -= b.top - a.top + 4; else if (a.bottom > b.bottom) l.scrollTop += a.bottom - b.bottom + 4;
}
function curClear(toTail) {
  CUR.id = null; curApply();
  if (toTail && CUR.list) CUR.list.scrollTop = CUR.list.scrollHeight;
}
async function curMove(l, dir, n, bots, again) {
  const rows = curRows(l), skip = bots ? new Set() : curBotSet();
  let i = CUR.id ? rows.findIndex(e => curRid(e) === CUR.id) : -1;
  if (i < 0) { if (dir > 0) return; i = rows.length; }       // no cursor yet: Up starts from the newest line
  let moved = 0, at = i;
  for (let j = i + dir; j >= 0 && j < rows.length && moved < n; j += dir) { if (skip.has(curRid(rows[j]))) continue; at = j; moved++; }
  if (at === i || (dir < 0 && moved < n && !HIST.done.chat && !again)) {
    if (dir < 0 && !HIST.done.chat && !again) { await histMore('chat'); return curMove(l, dir, n, bots, true); }   // at the oldest loaded line: fetch older, then continue
    if (at === i) return;
  }
  CUR.id = curRid(rows[at]); CUR.list = l; curApply(); curShow(rows[at], l);
}
function curKey(e) {
  if (e.ctrlKey || e.altKey || e.metaKey) return;

const PROLE = m => { const bd = m.badges || [], r = []; if (bd.includes('broadcaster') || MYNAMES.has((m.user || '').toLowerCase())) r.push('streamer');
  if (bd.includes('moderator')) r.push('mod'); if (bd.includes('vip')) r.push('vip'); if (bd.includes('subscriber') || bd.includes('founder')) r.push('sub');
  if (isBot(m)) r.push('bot'); if (!r.length) r.push('viewer'); return r; };
function paneOk(m) {      // this window is a pane (split half / extra window) with its own filter
  if (!PANE) return true;
  const f = PANE.filter || {};
  if (f.platforms && f.platforms.length && !f.platforms.includes(m.platform)) return false;
  if (f.kind === 'chat' && m.event) return false;
  if (f.kind === 'events' && !m.event) return false;
  if (f.roles && f.roles.length && PROLE(m).some(r => f.roles.includes(r)) === !!f.invert_roles) return false;

function pass(m) {
  return paneOk(m) && (!W.platforms.length || W.platforms.includes(m.platform)) && TIERS[m.tier || 'none'] >= TIERS[W.min_tier || 'none'];
}
function msgHtml(m) {
  const reasons = (m.reasons || []).map(r => `${r.rule} ${r.points > 0 ? '+' : ''}${r.points}`).join(', ');
  return `<div class="msg tier-${esc(m.tier)}${m.cleared ? ' cleared' : ''}${m.is_self ? ' self' : ''}${isBot(m) ? ' bot' : ''} ${styleClasses(m)}" title="${esc(reasons ? 'score ' + m.score + ': ' + reasons : '')}">
  <span class="t">${hhmm(m.ts)}</span>${markerHtml(m.platform)}<span class="u">${esc(m.display || m.user)}</span>${esc(m.text)}${clrTag(m)}</div>`;
}
function addMsg(m) {
  if (!['unified', 'platform', 'first', 'chat'].includes(W.type) || !pass(m)) return;

function renderHeader() {

function render() {

  ({unified: renderFeed, platform: renderFeed, first: renderFeed, priority: renderCards, missed: renderCards,
    composer: renderComposer, status: renderStatus, launcher: renderLauncher, chat: renderChat, popout: renderPopout, style: renderStyleEditor, obs: renderObsEditor, alerts: renderAlertsEditor, dash: renderDash}[W.type] || renderFeed)();

// linked feed: windows in one link_group show ONE continuous sequence. link_order 0 shows the newest rows,
// order 1 continues with the rows just older, and so on. Capacity (rows) is shared over BroadcastChannel.
function linkSlice(list, caps, order) {
  const off = Object.values(caps).filter(c => c.order < order).reduce((a, c) => a + c.rows, 0);
  const rows = (caps[order] || {rows: 0}).rows;
  return list.slice(Math.max(0, list.length - off - rows), Math.max(0, list.length - off));

const peers = {}; let chan = null;
function feedList() { return msgs.filter(m => pass(m) && (W.type !== 'first' || m.first_time)); }

function cardHtml(c, kind) {

  const acts = kind === 'open'
    ? `<button class="p" data-a="answer" data-id="${esc(c.id)}">Answered</button><button data-a="reply" data-id="${esc(c.id)}">Reply</button><button data-a="snooze" data-id="${esc(c.id)}">Snooze 5m</button><button data-a="dismiss" data-id="${esc(c.id)}">Dismiss</button>`
    : kind === 'missed' ? `<button class="p" data-a="reopen" data-id="${esc(c.id)}">Reopen</button><button data-a="answer" data-id="${esc(c.id)}">Answered</button><button data-a="dismiss" data-id="${esc(c.id)}">Dismiss</button>`

document.addEventListener('keydown', e => {

async function send() {
