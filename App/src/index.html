<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 80% -10%,color-mix(in srgb,var(--accent) 7%,transparent),transparent),var(--bg);color:var(--fg);font:14px/1.5 "Segoe UI",system-ui,sans-serif;display:flex;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ice)}
button.pri{background:linear-gradient(180deg,var(--ice),var(--ice2));color:var(--on-accent);border-color:transparent;font-weight:600}
button.danger{background:var(--live);border-color:transparent;color:#fff;font-weight:600}
input[type=text],input[type=password],select{background:var(--bg2);border:1px solid var(--line2);border-radius:9px;padding:6px 10px}
.dim{color:var(--dim)}.faint{color:var(--faint)}.sm{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}.sp{margin-left:auto}.wrap{flex-wrap:wrap}
/* sidebar */
nav{width:236px;flex:none;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px}
.brand .logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 20%,var(--panel)),var(--panel));display:grid;place-items:center;font-size:20px}.brand .logo img{width:36px;height:36px;border-radius:50%;display:block}
.brand b{font-size:16px;letter-spacing:.2px}.brand small{display:block;color:var(--faint);font-size:11px;margin-top:-3px}
nav h6{margin:14px 12px 4px;font-size:10.5px;letter-spacing:1.2px;color:var(--faint);text-transform:uppercase;font-weight:600}
.item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;color:var(--dim);cursor:pointer;border:1px solid transparent;user-select:none}
.item:hover{background:var(--hover);color:var(--fg)}
.item.on{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 11%,transparent),color-mix(in srgb,var(--accent) 3%,transparent));border-color:color-mix(in srgb,var(--accent) 19%,transparent);color:var(--fg)}
.item .ic{width:20px;text-align:center}
.tag{margin-left:auto;font-size:9.5px;padding:1px 7px;border-radius:8px;letter-spacing:.6px;text-transform:uppercase;font-weight:700}
.tag.live{background:#3ddc9722;color:var(--ok)}.tag.prev{background:#b9a58a22;color:var(--vio)}.tag.off{background:var(--hover2);color:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);margin-left:auto}.dot.running{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.starting{background:var(--warn)}
.navfoot{margin-top:auto;padding:10px;border-top:1px solid var(--line)}
/* main */
.col{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(6px)}
.top h2{font-size:18px;margin:0;font-weight:600}
.livepill{display:flex;align-items:center;gap:8px;padding:5px 14px;border-radius:20px;background:var(--panel);border:1px solid var(--line2);font-weight:600;font-size:13px}
.livepill i{width:9px;height:9px;border-radius:50%;background:var(--faint)}
.livepill.on{border-color:var(--live);color:#ffd9dd}.livepill.on i{background:var(--live);box-shadow:0 0 10px var(--live);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.45}}
#page{flex:1;overflow:auto;padding:24px}
#page.flush{padding:0;display:flex}
iframe{flex:1;border:0;width:100%;height:100%;background:var(--bg)}
/* cards & grid */
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g-main{grid-template-columns:1.6fr 1fr}
@media(max-width:1150px){.g3,.g4{grid-template-columns:repeat(2,1fr)}.g-main{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--panel),var(--panel-end));border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.3px;color:var(--dim);text-transform:uppercase}
.hero{padding:26px;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 14%,var(--panel)),var(--panel-end) 60%);overflow:hidden}
.hero.live{background:linear-gradient(120deg,#3a1520,var(--panel-end) 60%);border-color:#ff4d4f55}
.hero h1{margin:0 0 4px;font-size:26px}
.stat{font-size:30px;font-weight:700;letter-spacing:-.5px}.stat small{font-size:12px;color:var(--dim);font-weight:400;display:block;letter-spacing:0}
.bar{height:8px;background:var(--bg2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ice2),var(--ice));border-radius:6px}
.bar.o i{background:linear-gradient(90deg,#e68a00,var(--beak))}.bar.g i{background:linear-gradient(90deg,#2fb97f,var(--ok))}
.pill{display:inline-block;font-size:11px;padding:1px 9px;border-radius:9px;border:1px solid var(--line2);color:var(--dim)}
.pill.ok{color:var(--ok);border-color:#3ddc9755}.pill.warn{color:var(--warn);border-color:#e8d44d55}.pill.live{color:var(--live);border-color:#ff4d4f55}.pill.vio{color:var(--vio);border-color:#b9a58a55}
.ribbon{position:absolute;top:14px;right:-34px;transform:rotate(35deg);background:#b9a58a;color:#10091f;font-size:10px;font-weight:800;letter-spacing:1px;padding:2px 40px;text-transform:uppercase}
.banner{display:flex;align-items:center;gap:12px;padding:10px 16px;margin-bottom:18px;border-radius:12px;background:#b9a58a14;border:1px dashed #b9a58a66;color:#d9c9ad}
/* line list */
.ln{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.ln:last-child{border:0}
.ln .t{color:var(--faint);font-size:12px;min-width:46px;font-variant-numeric:tabular-nums}
.w-warn{background:#e8d44d33;color:var(--warn);border-radius:4px;padding:0 2px}.w-bad{background:#ff4d4f40;color:#ff8a95;border-radius:4px;padding:0 2px;font-weight:600}.w-fix{color:var(--ok);border-bottom:1px dashed var(--ok)}
.evt{font:12px/1.7 Consolas,monospace;color:var(--dim)}
.evt b{color:var(--fg);font-weight:600}.evt .lv{color:var(--live)}.evt .hk{color:var(--ok)}
/* switch */
.sw{position:relative;width:38px;height:22px;flex:none}.sw input{display:none}
.sw span{position:absolute;inset:0;background:var(--line2);border-radius:20px;transition:.15s;cursor:pointer}
.sw.locked span{opacity:.45;cursor:not-allowed}.msw{display:inline-flex;align-items:center;gap:6px}.lk{padding:2px 6px;min-width:0}
.sw span:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;left:3px;top:3px;background:#d8d4cc;transition:.15s}
.sw input:checked+span{background:var(--ice2)}.sw input:checked+span:after{left:19px;background:#fff}
.setrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.setrow:last-child{border:0}.setrow .grow{flex:1}
/* chat preview */
.chatwrap{display:grid;grid-template-columns:1fr 300px;gap:16px;height:calc(100vh - 170px);min-height:520px}
.chat{display:flex;flex-direction:column;overflow:hidden;padding:0}
.chat .msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.msg{display:flex;gap:8px;align-items:baseline;padding:3px 6px;border-radius:8px}
.msg:hover{background:var(--hover)}.msg.hl{background:color-mix(in srgb,var(--accent) 9%,transparent);border-left:3px solid var(--beak)}.msg.mod{background:#3ddc9710}
.plat{font-size:10px;font-weight:800;border-radius:5px;padding:0 5px;color:#fff}
.plat.tw{background:#9146ff}.plat.yt{background:#e62117}.plat.kk{background:#53fc18;color:#06190a}
.u{font-weight:700}.badge{font-size:10px;padding:0 5px;border-radius:4px;background:#ffffff14;color:var(--dim)}
.filters{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chip{padding:3px 11px;border-radius:14px;border:1px solid var(--line2);font-size:12.5px;color:var(--dim);cursor:pointer}.chip.on{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--ice);color:var(--fg)}
.sendbar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}.sendbar input{flex:1}
/* actions preview */
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.node{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:10px 14px;min-width:170px}
.node small{display:block;color:var(--faint);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;font-weight:700}
.node.trg{border-color:color-mix(in srgb,var(--accent) 33%,transparent)}.node.trg small{color:var(--beak)}.node.cnd{border-color:#e8d44d55}.node.cnd small{color:var(--warn)}.node.act small{color:var(--ice)}
.arrow{align-self:center;padding:0 8px;color:var(--faint)}
/* voice */
.wave{display:flex;align-items:center;gap:3px;height:60px}.wave i{width:4px;border-radius:3px;background:linear-gradient(var(--ice),var(--ice2));animation:w 1.2s infinite ease-in-out}
@keyframes w{50%{transform:scaleY(.35)}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.cmd{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.cmd:last-child{border:0}
.cmd code{background:var(--bg2);border:1px solid var(--line2);border-radius:7px;padding:1px 8px;color:var(--ice)}
.slider{width:100%;accent-color:var(--ice)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px}#toast div{background:var(--panel2);border:1px solid var(--line2);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow)}
.cbadge{margin-left:auto;background:#e5484d;color:#fff;border-radius:9px;font-size:10.5px;padding:1px 6px;font-weight:700}.cbadge:empty{display:none}
.clog{font:12px/1.5 ui-monospace,Consolas,monospace;max-height:52vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 0}
.cl{padding:1px 12px;white-space:pre-wrap;word-break:break-word;display:flex;gap:8px}.cl .t{color:var(--faint);flex:none}.cl .m{color:var(--ice);flex:none;min-width:64px}.cl .s{color:var(--faint);flex:none}
.cl.error{background:#e5484d1c}.cl.error .lv{color:#ff5c5c}.cl.warn .lv{color:#ffb86b}.cl.debug{opacity:.6}.cl .lv{flex:none;width:44px;text-transform:uppercase;font-size:10.5px;padding-top:1px}
.ctool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.ctool input[type=text]{width:200px}
.wiz{position:fixed;inset:0;background:#050810d9;backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:16px}
.wiz .card{width:min(560px,100%);max-height:94vh;overflow:auto}.wiz h2{margin:0 0 4px}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.role{border:1px solid var(--line2);border-radius:12px;padding:10px;cursor:pointer;background:var(--panel2)}.role.on{border-color:var(--ice);background:color-mix(in srgb,var(--accent) 8%,transparent)}.role b{display:block}
.st{display:inline-block;font-size:11px;padding:1px 9px;border-radius:9px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.st.connected{color:var(--ok);border-color:#3ddc9755}.st.needs_auth{color:var(--warn);border-color:#e8d44d66}.st.error{color:var(--bad);border-color:#ff5c5c66}
.irow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.irow:last-child{border:0}.irow .grow{flex:1;min-width:180px}
.cmdrow{padding:8px 0;border-bottom:1px solid var(--line)}.cmdrow:last-child{border:0}
.pr{display:flex;gap:8px;align-items:baseline;padding:3px 0}.pr .d{width:9px;height:9px;border-radius:50%;flex:none;background:var(--faint)}.pr.pass .d{background:#46c46b}.pr.warn .d{background:#ffb86b}.pr.fail .d{background:#e5484d}
/* dashboard v2 */
#page{padding:20px}.grid{gap:14px}
.hero{padding:16px 20px}.hero h1{font-size:22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.tile{padding:14px 16px;cursor:pointer;transition:border-color .12s}.tile:hover{border-color:var(--line2)}
.tile .k{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);font-weight:600}
.tile .v{font-size:24px;font-weight:700;letter-spacing:-.4px;margin:2px 0 0;line-height:1.2}.tile .s{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.ok .v{color:var(--ok)}.tile.warn .v{color:var(--warn)}.tile.bad .v{color:#ff5c5c}.tile.live .v{color:var(--live)}
.devs{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dev{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2)}
.dev.master{border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 7%,transparent)}.dev i{width:8px;height:8px;border-radius:50%;background:var(--ok)}.dev i.str{background:var(--live);box-shadow:0 0 8px var(--live)}

.clk{cursor:pointer}.clk:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}

.pnote{color:var(--faint);font-size:12.5px;margin:2px 0 8px}.cm-wrap{display:flex;gap:12px;align-items:flex-start}.cm-list{flex:1;min-width:0}.cm-panel{width:330px;flex:none;position:sticky;top:8px}.cm-row{display:flex;align-items:center;gap:10px;padding:5px 2px;border-top:1px solid var(--line)}.cm-name{flex:1;min-width:0}.cm-open{cursor:pointer}.cm-open:hover{color:var(--accent)}.cm-uses{width:80px;text-align:right}.cm-gh{cursor:pointer;gap:8px;margin-bottom:4px}.cm-f{margin:8px 0}.cm-f label{display:block;font-size:12px;color:var(--faint);margin-bottom:3px}.cm-f input[type=text]{width:100%}@media(max-width:900px){.cm-wrap{flex-direction:column}.cm-panel{width:100%;position:static}}input[type=range]{accent-color:var(--accent);width:150px}input[type=color]{width:38px;height:28px;padding:0;border:1px solid var(--line2);border-radius:8px;background:transparent;cursor:pointer}

.qcard .qt{display:flex;gap:4px;flex-wrap:wrap}.qtag{font-size:11px;border:1px solid var(--line2);border-radius:10px;padding:0 7px;color:var(--dim)}.qout{font:11.5px/1.4 ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;white-space:pre-wrap;max-height:120px;overflow:auto}

#pal .plist{max-height:50vh;overflow:auto}#pal .pit{display:flex;gap:10px;padding:8px 16px;cursor:pointer;align-items:baseline}#pal .pit.on{background:var(--accent-soft)}#pal .pit .pk{margin-left:auto;font-size:11px;color:var(--faint)}

@media(max-width:1000px){.col2{grid-template-columns:1fr}}

  nav{width:60px;padding:10px 6px}.brand div:last-child,nav h6,.navfoot,.tag,.item .dot{display:none}.brand{padding:4px 8px 12px}

  #page{padding:12px}.top{padding:10px 12px;gap:8px;flex-wrap:wrap}.g2,.g3,.g4{grid-template-columns:1fr}}

<body>
<nav>
  <div class="brand"><div class="logo"><img src="assets/logo.png" alt=""></div><div><b>PinguinoSuite</b><small>stream command center</small></div></div>
  <div class="item" data-r="dashboard"><span class="ic">▦</span>Dashboard</div>
  <div id="modnav"></div>
  <h6>System</h6>
  <div class="item" data-r="accounts"><span class="ic">👤</span>Accounts</div>
  <div class="item" data-r="commands"><span class="ic">⌨️</span>Commands</div>
  <div class="item" data-r="approvals"><span class="ic">✅</span>Approvals<span class="cbadge" id="abadge"></span></div>
  <div class="item" data-r="wheel"><span class="ic">🎡</span>Wheel &amp; Games</div>
  <div class="item" data-r="integrations"><span class="ic">🔌</span>Integrations</div>
  <div class="item" data-r="activity"><span class="ic">⚡</span>Activity</div>
  <div class="item" data-r="help"><span class="ic">?</span>Help</div>
  <div class="item" data-r="console"><span class="ic">▤</span>Console<span class="cbadge" id="cbadge"></span></div>
  <div class="item" data-r="personalize"><span class="ic">🎨</span>Personalize</div>
  <div class="item" data-r="settings"><span class="ic">⚙</span>Settings</div>
  <div class="navfoot sm dim" id="navfoot"></div>
</nav>
<div class="col">
  <div class="top"><button class="sm" id="nav-toggle" title="Show / hide the sidebar (Ctrl+B)">☰</button><h2 id="title">Dashboard</h2><div class="livepill" id="pill"><i></i><span id="pill-t">Offline</span></div><span class="dim sm" id="pill-sub"></span><button class="hq" id="hq-page" title="How this page works">?</button><button class="sm" id="popout-btn" title="Open this page in its own window">⤢ Pop out</button>
    <div class="row sp"><button id="simon" class="sm" title="Pretend we went live to test auto-start">▶ Test go-live</button><button id="simoff" class="sm">■ End test</button></div></div>
  <div id="page"></div>
</div>
<div id="pal"><div class="pbox"><input type="text" id="pal-in" placeholder="Type a page, action or command…  (Esc closes)" autocomplete="off"><div class="plist" id="pal-list"></div></div></div>
<div id="hscrim"></div>
<aside id="hdrawer"><div class="hh"><h3 id="hd-title">Help</h3><button class="sm" onclick="closeHelp()">✕</button></div><div class="hb" id="hd-body"></div><div class="hf" id="hd-foot"></div></aside>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const post=(p,b)=>fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let LISTEN='http://127.0.0.1:8765';
const POP=new URLSearchParams(location.search).get('popout');if(POP)document.body.classList.add('popout');
let S=null,L={status:null,lines:[]},route='dashboard',D=null,M={ok:false,queue:0,rate:null,prev:null};
const up=t=>{const m=Math.max(0,(Date.now()/1000-t)/60|0);return (m/60|0)+'h '+String(m%60).padStart(2,'0')+'m'};
const fmt=t=>{t=t|0;return (t/60|0)+':'+String(t%60).padStart(2,'0')};
const wordsHtml=ws=>ws.map(w=>`<span class="${{warn:'w-warn',bad:'w-bad',fix:'w-fix'}[w.l]||''}">${esc(w.w)}</span>`).join(' ');
/* Module on/off switch + padlock: locked by default, unlock lasts 30 s or one change (Docs/MODULE_CONTRACT.md "Module switch") */
const LK={};const isUnlocked=id=>(LK[id]||0)>Date.now();
const modSwitch=m=>{const u=isUnlocked(m.id);return `<span class="msw"><label class="sw ${u?'':'locked'}"><input type="checkbox" data-menable="${esc(m.id)}" ${m.options.enabled?'checked':''} ${u?'':'disabled'}><span></span></label><button class="sm lk" data-mlock="${esc(m.id)}" title="${u?'Lock':'Unlock to change'}">${u?'🔓':'🔒'}</button></span>`};
const sw=(id,on,extra='')=>`<label class="sw"><input type="checkbox" id="${id}" ${on?'checked':''} ${extra}><span></span></label>`;
const bar=(p,c='')=>`<div class="bar ${c}"><i style="width:${Math.min(100,p)}%"></i></div>`;
const prev=(txt)=>`<div class="banner">✨ <div><b>PREVIEW</b> — a mock-up of a planned module with sample data, so you can see the idea. ${txt||''}</div></div>`;
const listenMod=()=>S?.modules.find(m=>m.id==='listen');

/* ============ pages ============ */
const pages={};
pages.dashboard=()=>{
  const live=S.live,lm=listenMod(),st=L.status,stats=st?.stats||{};
  const run=S.modules.filter(m=>m.state==='running').length,tot=S.modules.length,down=S.modules.filter(m=>m.state!=='running');
  const errs=C.entries.filter(e=>e.level==='error'&&e.ts>Date.now()/1000-PF.thresholds.errors_min*60).length;
  const pr=C.pr&&C.pr.ts?C.pr.summary:null;
  const ndev=D?D.devices.length:1;
  const tile=(k,v,s,cls='',go='')=>`<div class="card tile ${cls}" ${go?`data-go="${go}"`:''}><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  const B={};
  B.hero=`  <div class="card hero ${live.live?'live':''}" style="margin-bottom:14px">
    <div class="row wrap"><div>
      <div class="dim sm">${live.live?(live.simulated===null||live.simulated===undefined?'ON AIR':'ON AIR (TEST)'):'OFFLINE · watching '+esc(S.channel)}</div>
      <h1>${live.live?esc(live.title||'Live'):esc(PF.text.idle_title)}</h1>
      <div class="dim sm">${live.live?`${esc(live.game||'')} · live for ${up(live.since)}`:'Listen is always on; everything else wakes the moment you go live.'}</div></div>
      <div class="row sp"><div class="stat">${live.viewers}<small>viewers</small></div></div></div>
  </div>`;
  B.devices=`<div class="card" style="margin-bottom:14px;padding:12px 16px"><div class="devs">${deviceStrip()}</div></div>`;
  B.t_stream=tile('Stream',live.live?'LIVE':'Offline',live.live?`${live.viewers} watching`:'waiting for go-live',live.live?'live':'');
  B.t_chat=tile('Chat',M.ok?(M.rate!=null?M.rate+'/min':'—'):'—',M.ok?`${M.queue} open cards${M.chatters!=null?' · '+M.chatters+' chatters/h':''}`:'Multi is not running','',  'm:multi');
  B.t_devices=tile('Devices',ndev+' online',D?'master: '+esc(D.master_name):'this device','', '');
  B.t_modules=tile('Modules',run+'/'+tot,down.length?esc(down.map(m=>m.name).join(', '))+' not running':'all healthy',down.length?'warn':'ok');
  B.t_prestream=tile('Pre-stream',pr?(pr.fail?pr.fail+' fail':pr.warn?pr.warn+' warn':'All ok'):'—',pr?`${pr.pass} ok · ${pr.warn} warn · ${pr.fail} fail`:'not run yet',pr?(pr.fail?'bad':pr.warn?'warn':'ok'):'','console');
  B.t_errors=PF.thresholds.tile_errors_hide_zero&&!errs?'':tile('Errors ('+PF.thresholds.errors_min+' min)',errs,errs?'open the Console':'clean',errs?'bad':'ok','console');
  B.listen=`<div class="card"><div class="row"><h3 style="margin:0">PenguinComm · Listen</h3>${st?.listening?'<span class="pill ok">listening</span>':'<span class="pill">idle</span>'}<span class="sm faint sp">${stats.total||0} lines · ${(stats.corrected||0)+(stats.approved||0)} verified${stats.to_review?` · <span style="color:var(--warn)">${stats.to_review} to review</span>`:''}</span></div>${micBanner()}
        <div style="margin-top:8px">${L.lines.length?L.lines.map(s=>`<div class="ln"><span class="t">${fmt(s.t)}</span><div>${wordsHtml(s.words)}</div></div>`).join(''):`<div class="dim sm">${st?.listening?'Listening. Nothing heard yet.':lm?.state==='running'?'Not listening right now: the mic starts with the Suite, so check the microphone in Listen (Console shows why).':'PinguinoListen is not running.'}</div>`}</div>
        <div class="row" style="margin-top:10px"><button class="sm" data-go="comm">Open PenguinComm</button><button class="sm" data-go="voice">Voice Studio</button>${st?.listening?'':'<button id="d-listen" class="pri sm">Start listening</button>'}</div></div>`;
  B.activity=`<div class="card"><h3>Activity</h3><div class="evt" style="max-height:260px;overflow:auto">${S.events.slice(-14).reverse().map(e=>`<div>${new Date(e.ts*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})} <b class="${e.type==='live'?'lv':e.type==='hook'?'hk':''}">${esc(e.type)}</b> ${esc(e.id||e.state||e.title||'')}</div>`).join('')||'<span class="faint">Nothing yet</span>'}</div></div>`;
  B.modules=`<div class="card"><h3>Modules</h3>${[...S.modules].sort((a,b)=>String(dispName(a)).localeCompare(String(dispName(b)))).map(m=>`<div class="minirow"><span class="dot ${m.state}" style="margin:0"></span><div class="grow"><b>${esc(dispName(m))}</b> <span class="sm faint">${esc(m.state)}</span></div>${hq('module:'+m.id+(m.state==='running'?'':':'+m.state),{module:m.id})}<button class="sm" data-mlog="${esc(m.id)}" title="Recent log lines of this module">Logs</button>${modSwitch(m)}<button class="sm" data-act="${m.id}:${m.state==='stopped'?'start':'restart'}">${m.state==='stopped'?'Start':'Restart'}</button></div>`).join('')}</div>`;
  B.chatrate=chatRateCard();
  B.prestream=C.pr&&C.pr.ts?`<div class="card"><div class="row"><h3 style="margin:0">Pre-stream</h3><button class="sm sp" id="d-prerun">Run now</button><button class="sm" data-go="console">Details</button></div><div style="margin-top:6px">${C.pr.items.filter(i=>i.status!=='pass').slice(0,6).map(i=>{if(i.help)HX[i.module+':'+i.id]=i.help;return `<div class="pr ${i.status} clk" data-hk="${esc(i.module+':'+i.id)}" data-hm="${esc(i.module)}" data-hi="${esc(i.id)}"><span class="d"></span><b>${esc(i.module)}</b><span class="sm">${esc(i.label)}</span></div>`}).join('')||'<span class="sm faint">Everything passed.</span>'}</div></div>`:'';
  return dashLayout(B)};

function deviceStrip(){
  if(!D)return '<span class="sm faint">This device</span>';
  const mine=D.devices.find(x=>x.me);
  const chips=D.devices.map(x=>`<span class="dev ${x.master?'master':''}"><i class="${x.streaming?'str':''}"></i><b>${esc(x.name)}</b>${x.me?'<span class="sm faint">(this device)</span>':''}<span class="role">${x.master?'master':'aux'}</span></span>`).join('');
  const act=D.is_master?(D.pin&&D.pin.to===D.me.id?'<button class="sm sp" data-dev="release">Release control</button>':''):'<button class="pri sm sp" data-dev="take">Take control here</button>';
  return chips+(D.solo?'<span class="sm faint">Only this device is online. Pair others in Link.</span>':'')+act}

/* Generic module page: any module with a `ui` block in its manifest gets nav entry + this page (see Docs/MODULE_CONTRACT.md). */
/* A module's `ui` may be one block or an array; each block is its own nav entry (route m:<id>, then m:<id>@1, ...). */
const uiEntries=()=>(S?S.modules:[]).flatMap(m=>[].concat(m.ui||[]).map((ui,i)=>({...m,ui,rid:i?`m:${m.id}@${i}`:'m:'+m.id})));
const modOf=r=>uiEntries().find(e=>e.rid===r);
/* PenguinComm = Listen (the mic, Ivan -> bots) + Speak (PinguinoVoice, the bots' voice) shown as ONE nav entry / page with two sections.
   The modules keep their ids, ports and manifests; only the shell presents them together. */
function navEntries(){const all=uiEntries(),l=all.find(e=>e.rid==='m:listen'),v=all.find(e=>e.rid==='m:voice');if(!l&&!v)return all;
  const first=l||v,sts=[l,v].filter(Boolean).map(x=>x.state);
  const state=sts.every(x=>x==='running')?'running':sts.some(x=>x==='running'||x==='starting')?'starting':'stopped';
  return all.filter(e=>e!==l&&e!==v).concat([{id:'comm',name:'PenguinComm',desc:'Listen (you to the bots) and Speak (the bots\' voice) in one place.',url:'',rid:'comm',state,options:{enabled:true},ui:{nav:'PenguinComm',icon:'🗣',section:first.ui.section||'Modules',order:first.ui.order??10}}])}
const COMM={tab:(()=>{try{return localStorage.getItem('commTab')||'both'}catch{return 'both'}})()};
const COMMNAME={listen:'PenguinComm · Listen',voice:'PenguinComm · Speak'};
const dispName=m=>COMMNAME[m.id]||m.name;
const modSrc=m=>m.url.replace(/\/$/,'')+(m.ui?.path||'/');
pages.module=r=>{const m=modOf(r);
  if(!m)return `<div class="card" style="max-width:520px"><h3>Module not found</h3><div class="dim">It may have been removed from the registry.</div></div>`;
  if(m.state==='running')return `<iframe id="mif" data-src="${esc(modSrc(m))}" src="${esc(modSrc(m))}"></iframe>`;
  return `<div class="card" style="max-width:520px"><h3>${esc(m.name)}</h3><div class="dim">${esc(m.desc||'')}</div><div class="row" style="margin-top:14px">${hq('module:'+m.id+(m.state==='running'?'':':'+(m.state||'unknown')),{module:m.id})} <span class="pill">${esc(m.state||'unavailable')}</span><button class="pri" data-act="${esc(m.id)}:start">Start ${esc(m.name)}</button></div></div>`};

/* ============ Integrations hub (core: GET /api/integrations; contract in Docs/MODULE_CONTRACT.md) ============ */
const I={items:null,err:null},VT={keys:null,err:null,edit:null,confirmDel:null};
const ST={connected:'Connected',needs_auth:'Needs sign-in',error:'Problem',off:'Off',unknown:'Unknown'};
async function loadVault(){try{const r=await fetch('/api/vault');if(!r.ok)throw new Error((await r.json()).detail||r.status);VT.keys=await r.json();VT.err=null}catch(e){VT.err=String(e.message||e)}}
async function loadIntegrations(){try{I.items=(await (await fetch('/api/integrations')).json()).items;I.err=null}catch{I.err='The core is not answering.'}
  await loadVault();if(route==='integrations'&&!document.activeElement?.matches?.('#page input'))draw(true)}
const ago=t=>{if(!t)return 'never';const m=Math.max(0,(Date.now()/1000-t)/60|0);return m<1?'just now':m<60?m+' min ago':m<1440?(m/60|0)+' h ago':(m/1440|0)+' d ago'};
function vaultCard(){
  if(VT.err)return `<div class="card" style="grid-column:1/-1"><h3>Key vault</h3><div class="dim sm">${esc(VT.err)}</div></div>`;
  if(!VT.keys)return '';
  const k=VT.keys,pt=k.plaintext;
  return `<div class="card" style="grid-column:1/-1"><div class="row"><h3 style="margin:0">Key vault</h3><span class="sm faint">Encrypted on this PC (${esc(k.backend)}). Keys are never shown again and never leave this machine in plain text.</span></div>
   <div style="margin-top:8px">${k.keys.map(x=>{if(x.help)HX['vault:'+x.name]=x.help;return `<div class="irow clk" data-hk="vault:${esc(x.name)}"><span class="st ${x.set?'connected':'needs_auth'}">${x.set?'Set':'Missing'}</span>
      <div class="grow"><b>${esc(x.label)}</b> <span class="sm faint">${esc(x.name)}</span><div class="sm faint">${x.declared_by.length?'used by '+esc(x.declared_by.join(', '))+' · ':''}${x.set?'set '+ago(x.updated)+' · last read '+ago(x.last_used)+(x.used_by?' by '+esc(x.used_by):''):(x.required?'required':'not set yet')}</div></div>
      ${VT.edit===x.name?`<input type="password" id="v-new" placeholder="paste the key" autocomplete="off" style="width:220px"><button class="pri sm" data-vsave="${esc(x.name)}">Save</button><button class="sm" data-vcancel="1">Cancel</button>`
        :`${hq('vault:'+x.name)}<button class="sm" data-vedit="${esc(x.name)}">${x.set?'Rotate':'Set'}</button>${x.set&&x.testable?`<button class="sm" data-vtest="${esc(x.name)}">Test</button>`:''}${x.set?`<button class="sm" data-vdel="${esc(x.name)}">${VT.confirmDel===x.name?'Click again to delete':'Delete'}</button>`:''}`}
      ${VT.edit===x.name&&x.help?`<div class="hkeyhelp"><b>How to get this key</b>${helpBody(x.help)}</div>`:''}</div>`}).join('')||'<div class="sm faint">No keys declared by any module yet. Modules list the keys they need in their manifest ("secrets").</div>'}</div>
   <div class="row" style="margin-top:12px;flex-wrap:wrap;gap:8px"><input type="text" id="v-addname" placeholder="NEW_KEY_NAME" style="width:190px"><button class="sm" id="v-add">Add a key</button></div>
   ${pt.total?`<div class="irow" style="margin-top:10px"><span class="st needs_auth">Plaintext</span><div class="grow"><b>${pt.total} key(s) are still in plain config files</b> <span class="sm faint">${pt.files.map(f=>esc(f.file)+' ('+f.count+')').join(', ')}</span>
       <div class="sm faint">Import copies them into the vault and leaves the files alone. Remove the plaintext only after the module that uses it reads from the vault.</div></div>
       <button class="pri sm" id="v-import">Import into vault</button>${pt.unmigrated===0?pt.files.map(f=>`<button class="sm" data-vscrub="${esc(f.file)}">Remove plaintext from ${esc(f.file)}</button>`).join(''):''}</div>`:''}
   <div class="row wrap" style="margin-top:12px;gap:8px"><span class="sm faint">Backup:</span><input type="password" id="v-bpass" placeholder="passphrase (8+)" style="width:150px"><button class="sm" id="v-export">Export encrypted backup</button><input type="file" id="v-restore" accept=".pgb" class="sm"></div></div>`}
async function vaultAct(fn){try{await fn()}catch(e){toast(String(e.message||e).slice(0,120))}await loadVault();draw(true)}
function bindVault(){
  $$('[data-vedit]').forEach(b=>b.onclick=()=>{VT.edit=b.dataset.vedit;VT.confirmDel=null;draw(true);$('#v-new')&&$('#v-new').focus()});

function renderLog(){const box=$('#clog');if(!box)return;

async function pollConsole(){try{const r=await (await fetch(`/api/console?since=${C.seq}&limit=500`)).json();

    if(C.polled&&r.entries.some(e=>e.level==='error'))sfx('error');C.polled=true;
    if(r.entries.length){C.seq=r.seq;if(!C.paused){C.entries=C.entries.concat(r.entries).slice(-5000)}else C.pending=(C.pending||[]).concat(r.entries)}
    else C.seq=Math.max(C.seq,r.seq);
    if(route==='console'&&!C.paused){C.seen=C.seq;store.set('consoleSeen',C.seen);if(r.entries.length)renderLog()}

async function pollPrestream(){try{const r=await (await fetch('/api/prestream')).json();

  if(route==='accounts')bindAccounts();
  if(route==='approvals')bindApprovals();
  if(route==='commands')bindCommands();
  if(route==='wheel')bindWheel();
  if(route==='integrations')bindIntegrations();
  if(route==='settings')bindPortable();
  $$('[data-go]').forEach(e=>e.onclick=()=>{if(e.dataset.commtab){COMM.tab=e.dataset.commtab;try{localStorage.setItem('commTab',COMM.tab)}catch{}}go(e.dataset.go)});
  $$('[data-dev]').forEach(b=>b.onclick=async()=>{D=await post('/api/device/'+b.dataset.dev);toast(b.dataset.dev==='take'?'This device is now in control':'Control released');draw(true)});
  $$('[data-act]').forEach(b=>b.onclick=async()=>{const[a,c]=b.dataset.act.split(':');await post(`/api/modules/${a}/${c}`);setTimeout(load,900)});
  $('#d-prerun')&&($('#d-prerun').onclick=async()=>{$('#d-prerun').disabled=true;try{C.pr=await post('/api/prestream/run');toast('Pre-stream check done')}catch{toast('Check failed to run')}draw(true)});
  $('#d-listen')&&($('#d-listen').onclick=async()=>{try{await fetch(LISTEN+'/api/live/auto',{method:'POST'});toast('Listening started');loadListen()}catch{toast('Listen is not running')}});
  $('#s-chan')&&($('#s-chan').onchange=async e=>{await post('/api/channel',{channel:e.target.value});toast('Channel saved')});
  $('#s-wa')&&($('#s-wa').onchange=async e=>{await post('/api/windows-autostart',{on:e.target.checked});toast(e.target.checked?'Will start with Windows':'Autostart off')});
  bindPopout();bindSched();bindBackup();
  bindSwitches();
  $$('[data-mlog]').forEach(b=>b.onclick=()=>showLogs(b.dataset.mlog));
  $$('[data-mod]').forEach(i=>i.onchange=()=>post(`/api/modules/${i.dataset.mod}/options`,{[i.dataset.opt]:i.checked}));
}
$$('nav .item[data-r]').forEach(i=>i.onclick=()=>go(i.dataset.r));
$('#popout-btn').onclick=()=>popOut(route);
$('#nav-toggle').onclick=toggleNav;
$('#hq-page').onclick=()=>openHelp({hk:isMod(route)?'module:'+route.slice(2).split('@')[0]:route,hm:isMod(route)?route.slice(2).split('@')[0]:''});
function toast(m){if(!PF.notify.toasts&&!/fail|could not|error|not /i.test(m))return;const d=document.createElement('div');d.textContent=m;$('#toast').append(d);setTimeout(()=>d.remove(),3500)}
$('#simon').onclick=()=>{post('/api/simulate',{live:true});toast('Simulating go-live…')};
$('#simoff').onclick=()=>post('/api/simulate',{live:false}).then(()=>post('/api/simulate',{live:null}));

async function load(){try{S=await (await fetch('/api/state')).json()}catch{return}
  const l=S.live;$('#pill').classList.toggle('on',l.live);$('#pill-t').textContent=l.live?PF.text.live_pill:PF.text.offline_pill;
  $('#pill-sub').textContent=l.live?`${l.viewers} watching · ${up(l.since)}`:(l.error?'Twitch check: '+l.error.slice(0,60):'');
  const lm=listenMod();if(lm?.url)LISTEN=lm.url.replace(/\/$/,'');
  $('#navfoot').textContent=`Watching ${S.channel}`;watchState();draw();if(route==='comm')updateComm()}
async function loadDevice(){try{D=await (await fetch('/api/device')).json()}catch{return}if(route==='dashboard')draw()}
async function loadMulti(){try{const m=await (await fetch('/api/modules/multi/get?path=/api/dashboard')).json();
  M.ok=true;M.rate=m.rate_per_min??m.last_minute??null;M.queue=m.open_cards??0;M.chatters=m.unique_chatters_hour??null;M.hour=m.messages_last_hour??null}
  catch{M.ok=false;M.rate=null}if(route==='dashboard')draw()}
/* Listen raises mic_alert when the saved mic is missing (fallback / none) or the input has been silent for 30 s: never fail quietly. */
function micBanner(){const a=L.status&&L.status.mic_alert;return a?`<div class="sm" style="background:#5a1d1d;color:#fff;border:1px solid #c44;border-radius:8px;padding:8px 12px;margin:8px 0;font-weight:600">⚠ ${esc(a.message)}</div>`:''}
function micAlertWatch(){const a=L.status&&L.status.mic_alert,k=a?a.kind+'|'+a.message:'';if(k&&k!==L.alertSeen){const msg=a.message;toast(msg);try{sfx('module_down')}catch{}try{if(PF.notify.desktop&&window.Notification&&Notification.permission==='granted')new Notification('PinguinoSuite',{body:msg})}catch{}}L.alertSeen=k}
async function loadListen(){try{const st=await (await fetch(LISTEN+'/api/status')).json();L.status=st;micAlertWatch();
  let sid=st.live_session;if(!sid){const ss=await (await fetch(LISTEN+'/api/sessions')).json();sid=ss.find(s=>s.segments)?.id}
  L.lines=sid?(await (await fetch(`${LISTEN}/api/segments?session=${sid}&limit=500`)).json()).slice(-5):[]}catch{L.status=null;L.lines=[]}
  if(route==='dashboard')draw();if(route==='comm')updateComm()}
(async()=>{for(let i=0;i<40&&!S;i++){await load();if(!S)await new Promise(r=>setTimeout(r,500))}   // wait for the core (the splash covers this)
  go(POP||(PF.layout.start&&PF.layout.start!=='dashboard'&&routeOk(PF.layout.start)?PF.layout.start:'dashboard'));loadPrefs();loadListen();setInterval(load,4000);setInterval(loadListen,3000);if(!POP)loadSetup();loadDevice();loadMulti();setInterval(loadDevice,5000);setInterval(loadMulti,6000);pollConsole();pollPrestream();setInterval(pollConsole,1500);setInterval(()=>{if(route==='integrations')loadIntegrations()},20000);setInterval(pollPrestream,10000);
  const ws=()=>{const w=PG.ws();w.onmessage=()=>load();w.onclose=()=>setTimeout(ws,2000)};ws();
  try{if(!POP&&window.__TAURI__&&window.__TAURI__.core)window.__TAURI__.core.invoke('app_ready')}catch{}})();   // the shell closes the splash and reopens the windows
</script>
</body>
</html>
