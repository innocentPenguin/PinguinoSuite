<!doctype html>
<html lang="en">
<head>
<script src="bootstrap.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PinguinoSuite</title>
<style>
:root{
  --bg:#0a0e15;--bg2:#0e131c;--panel:#131925;--panel2:#18202e;--line:#222b3c;--line2:#2d3850;
  --fg:#e8ecf4;--dim:#8b95ab;--faint:#5b6579;
  --ice:#7cc4ff;--ice2:#4a9be0;--beak:#ff9f43;--live:#ff4757;--ok:#4cd9a0;--warn:#f5d547;--vio:#a78bfa;
  --r:14px;--shadow:0 10px 30px #0006;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 80% -10%,#15233a55,transparent),var(--bg);color:var(--fg);font:14px/1.5 "Segoe UI",system-ui,sans-serif;display:flex;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ice)}
button.pri{background:linear-gradient(180deg,var(--ice),var(--ice2));color:#06101c;border-color:transparent;font-weight:600}
button.danger{background:var(--live);border-color:transparent;color:#fff;font-weight:600}
input[type=text],select{background:var(--bg2);border:1px solid var(--line2);border-radius:9px;padding:6px 10px}
.dim{color:var(--dim)}.faint{color:var(--faint)}.sm{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}.sp{margin-left:auto}.wrap{flex-wrap:wrap}
/* sidebar */
nav{width:236px;flex:none;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px}
.brand .logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#1c2a44,#0f1726);border:1px solid var(--line2);display:grid;place-items:center;font-size:20px}
.brand b{font-size:16px;letter-spacing:.2px}.brand small{display:block;color:var(--faint);font-size:11px;margin-top:-3px}
nav h6{margin:14px 12px 4px;font-size:10.5px;letter-spacing:1.2px;color:var(--faint);text-transform:uppercase;font-weight:600}
.item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;color:var(--dim);cursor:pointer;border:1px solid transparent;user-select:none}
.item:hover{background:#ffffff08;color:var(--fg)}
.item.on{background:linear-gradient(90deg,#7cc4ff1c,#7cc4ff08);border-color:#7cc4ff30;color:var(--fg)}
.item .ic{width:20px;text-align:center}
.tag{margin-left:auto;font-size:9.5px;padding:1px 7px;border-radius:8px;letter-spacing:.6px;text-transform:uppercase;font-weight:700}
.tag.live{background:#4cd9a022;color:var(--ok)}.tag.prev{background:#a78bfa22;color:var(--vio)}.tag.off{background:#ffffff0d;color:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);margin-left:auto}.dot.running{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.starting{background:var(--warn)}
.navfoot{margin-top:auto;padding:10px;border-top:1px solid var(--line)}
/* main */
.col{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--line);background:#0a0e15cc;backdrop-filter:blur(6px)}
.top h2{font-size:18px;margin:0;font-weight:600}
.livepill{display:flex;align-items:center;gap:8px;padding:5px 14px;border-radius:20px;background:var(--panel);border:1px solid var(--line2);font-weight:600;font-size:13px}
.livepill i{width:9px;height:9px;border-radius:50%;background:var(--faint)}
.livepill.on{border-color:var(--live);color:#ffd9dd}.livepill.on i{background:var(--live);box-shadow:0 0 10px var(--live);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.45}}
#page{flex:1;overflow:auto;padding:24px}
#page.flush{padding:0;display:flex}
iframe{flex:1;border:0;width:100%;height:100%;background:var(--bg)}
/* cards & grid */
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g-main{grid-template-columns:1.6fr 1fr}
@media(max-width:1150px){.g3,.g4{grid-template-columns:repeat(2,1fr)}.g-main{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--panel),#101622);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.3px;color:var(--dim);text-transform:uppercase}
.hero{padding:26px;background:linear-gradient(120deg,#17243b,#101622 60%);overflow:hidden}
.hero.live{background:linear-gradient(120deg,#3a1520,#101622 60%);border-color:#ff475755}
.hero h1{margin:0 0 4px;font-size:26px}
.stat{font-size:30px;font-weight:700;letter-spacing:-.5px}.stat small{font-size:12px;color:var(--dim);font-weight:400;display:block;letter-spacing:0}
.bar{height:8px;background:var(--bg2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ice2),var(--ice));border-radius:6px}
.bar.o i{background:linear-gradient(90deg,#ff7b43,var(--beak))}.bar.g i{background:linear-gradient(90deg,#2fb98a,var(--ok))}
.pill{display:inline-block;font-size:11px;padding:1px 9px;border-radius:9px;border:1px solid var(--line2);color:var(--dim)}
.pill.ok{color:var(--ok);border-color:#4cd9a055}.pill.warn{color:var(--warn);border-color:#f5d54755}.pill.live{color:var(--live);border-color:#ff475755}.pill.vio{color:var(--vio);border-color:#a78bfa55}
.ribbon{position:absolute;top:14px;right:-34px;transform:rotate(35deg);background:#a78bfa;color:#10091f;font-size:10px;font-weight:800;letter-spacing:1px;padding:2px 40px;text-transform:uppercase}
.banner{display:flex;align-items:center;gap:12px;padding:10px 16px;margin-bottom:18px;border-radius:12px;background:#a78bfa14;border:1px dashed #a78bfa66;color:#cdbdfc}
/* line list */
.ln{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.ln:last-child{border:0}
.ln .t{color:var(--faint);font-size:12px;min-width:46px;font-variant-numeric:tabular-nums}
.w-warn{background:#f5d54733;color:var(--warn);border-radius:4px;padding:0 2px}.w-bad{background:#ff475740;color:#ff8a95;border-radius:4px;padding:0 2px;font-weight:600}.w-fix{color:var(--ok);border-bottom:1px dashed var(--ok)}
.evt{font:12px/1.7 Consolas,monospace;color:var(--dim)}
.evt b{color:var(--fg);font-weight:600}.evt .lv{color:var(--live)}.evt .hk{color:var(--ok)}
/* switch */
.sw{position:relative;width:38px;height:22px;flex:none}.sw input{display:none}
.sw span{position:absolute;inset:0;background:var(--line2);border-radius:20px;transition:.15s;cursor:pointer}
.sw span:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;left:3px;top:3px;background:#cfd6e6;transition:.15s}
.sw input:checked+span{background:var(--ice2)}.sw input:checked+span:after{left:19px;background:#fff}
.setrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.setrow:last-child{border:0}.setrow .grow{flex:1}
/* chat preview */
.chatwrap{display:grid;grid-template-columns:1fr 300px;gap:16px;height:calc(100vh - 170px);min-height:520px}
.chat{display:flex;flex-direction:column;overflow:hidden;padding:0}
.chat .msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.msg{display:flex;gap:8px;align-items:baseline;padding:3px 6px;border-radius:8px}
.msg:hover{background:#ffffff08}.msg.hl{background:#ff9f4318;border-left:3px solid var(--beak)}.msg.mod{background:#4cd9a010}
.plat{font-size:10px;font-weight:800;border-radius:5px;padding:0 5px;color:#fff}
.plat.tw{background:#9146ff}.plat.yt{background:#e62117}.plat.kk{background:#53fc18;color:#06190a}
.u{font-weight:700}.badge{font-size:10px;padding:0 5px;border-radius:4px;background:#ffffff14;color:var(--dim)}
.filters{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chip{padding:3px 11px;border-radius:14px;border:1px solid var(--line2);font-size:12.5px;color:var(--dim);cursor:pointer}.chip.on{background:#7cc4ff1f;border-color:var(--ice);color:var(--fg)}
.sendbar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}.sendbar input{flex:1}
/* actions preview */
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.node{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:10px 14px;min-width:170px}
.node small{display:block;color:var(--faint);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;font-weight:700}
.node.trg{border-color:#ff9f4355}.node.trg small{color:var(--beak)}.node.cnd{border-color:#f5d54755}.node.cnd small{color:var(--warn)}.node.act small{color:var(--ice)}
.arrow{align-self:center;padding:0 8px;color:var(--faint)}
/* voice */
.wave{display:flex;align-items:center;gap:3px;height:60px}.wave i{width:4px;border-radius:3px;background:linear-gradient(var(--ice),var(--ice2));animation:w 1.2s infinite ease-in-out}
@keyframes w{50%{transform:scaleY(.35)}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.cmd{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.cmd:last-child{border:0}
.cmd code{background:var(--bg2);border:1px solid var(--line2);border-radius:7px;padding:1px 8px;color:var(--ice)}
.slider{width:100%;accent-color:var(--ice)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px}#toast div{background:var(--panel2);border:1px solid var(--line2);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow)}
.cbadge{margin-left:auto;background:#e5484d;color:#fff;border-radius:9px;font-size:10.5px;padding:1px 6px;font-weight:700}.cbadge:empty{display:none}
.clog{font:12px/1.5 ui-monospace,Consolas,monospace;max-height:52vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 0}
.cl{padding:1px 12px;white-space:pre-wrap;word-break:break-word;display:flex;gap:8px}.cl .t{color:var(--faint);flex:none}.cl .m{color:var(--ice);flex:none;min-width:64px}.cl .s{color:var(--faint);flex:none}
.cl.error{background:#e5484d1c}.cl.error .lv{color:#ff6b70}.cl.warn .lv{color:#ffb86b}.cl.debug{opacity:.6}.cl .lv{flex:none;width:44px;text-transform:uppercase;font-size:10.5px;padding-top:1px}
.ctool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.ctool input[type=text]{width:200px}
.wiz{position:fixed;inset:0;background:#050810d9;backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:16px}
.wiz .card{width:min(560px,100%);max-height:94vh;overflow:auto}.wiz h2{margin:0 0 4px}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.role{border:1px solid var(--line2);border-radius:12px;padding:10px;cursor:pointer;background:var(--panel2)}.role.on{border-color:var(--ice);background:#7cc4ff14}.role b{display:block}
.cmdrow{padding:8px 0;border-bottom:1px solid var(--line)}.cmdrow:last-child{border:0}
.pr{display:flex;gap:8px;align-items:baseline;padding:3px 0}.pr .d{width:9px;height:9px;border-radius:50%;flex:none;background:var(--faint)}.pr.pass .d{background:#46c46b}.pr.warn .d{background:#ffb86b}.pr.fail .d{background:#e5484d}
/* dashboard v2 */
#page{padding:20px}.grid{gap:14px}
.hero{padding:16px 20px}.hero h1{font-size:22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.tile{padding:14px 16px;cursor:pointer;transition:border-color .12s}.tile:hover{border-color:var(--line2)}
.tile .k{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);font-weight:600}
.tile .v{font-size:24px;font-weight:700;letter-spacing:-.4px;margin:2px 0 0;line-height:1.2}.tile .s{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.ok .v{color:var(--ok)}.tile.warn .v{color:var(--warn)}.tile.bad .v{color:#ff6b70}.tile.live .v{color:var(--live)}
.devs{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dev{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2)}
.dev.master{border-color:#7cc4ff66;background:#7cc4ff12}.dev i{width:8px;height:8px;border-radius:50%;background:var(--ok)}.dev i.str{background:var(--live);box-shadow:0 0 8px var(--live)}
.dev b{font-weight:600}.dev .role{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--ice);font-weight:700}
.minirow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}.minirow:last-child{border:0}.minirow .grow{flex:1;min-width:0}
.col2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:1000px){.col2{grid-template-columns:1fr}}
@media(max-width:820px){
  nav{width:60px;padding:10px 6px}.brand div:last-child,nav h6,.navfoot,.tag,.item .dot{display:none}.brand{padding:4px 8px 12px}
  .item{font-size:0;justify-content:center;padding:9px 0}.item .ic{font-size:17px;width:auto}.cbadge{position:absolute;margin:-18px 0 0 18px;font-size:9px}.item{position:relative}
  #page{padding:12px}.top{padding:10px 12px;gap:8px;flex-wrap:wrap}.g2,.g3,.g4{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
  <div class="brand"><div class="logo">🐧</div><div><b>PinguinoSuite</b><small>stream command center</small></div></div>
  <div class="item" data-r="dashboard"><span class="ic">▦</span>Dashboard</div>
  <div id="modnav"></div>
  <h6>System</h6>
  <div class="item" data-r="console"><span class="ic">▤</span>Console<span class="cbadge" id="cbadge"></span></div>
  <div class="item" data-r="settings"><span class="ic">⚙</span>Settings</div>
  <div class="navfoot sm dim" id="navfoot"></div>
</nav>
<div class="col">
  <div class="top"><h2 id="title">Dashboard</h2><div class="livepill" id="pill"><i></i><span id="pill-t">Offline</span></div><span class="dim sm" id="pill-sub"></span>
    <div class="row sp"><button id="simon" class="sm" title="Pretend we went live to test auto-start">▶ Test go-live</button><button id="simoff" class="sm">■ End test</button></div></div>
  <div id="page"></div>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const post=(p,b)=>fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let LISTEN='http://127.0.0.1:8765';
let S=null,L={status:null,lines:[]},route='dashboard',D=null,M={ok:false,queue:0,rate:null,prev:null};
const up=t=>{const m=Math.max(0,(Date.now()/1000-t)/60|0);return (m/60|0)+'h '+String(m%60).padStart(2,'0')+'m'};
const fmt=t=>{t=t|0;return (t/60|0)+':'+String(t%60).padStart(2,'0')};
const wordsHtml=ws=>ws.map(w=>`<span class="${{warn:'w-warn',bad:'w-bad',fix:'w-fix'}[w.l]||''}">${esc(w.w)}</span>`).join(' ');
const sw=(id,on,extra='')=>`<label class="sw"><input type="checkbox" id="${id}" ${on?'checked':''} ${extra}><span></span></label>`;
const bar=(p,c='')=>`<div class="bar ${c}"><i style="width:${Math.min(100,p)}%"></i></div>`;
const prev=(txt)=>`<div class="banner">✨ <div><b>PREVIEW</b> — a mock-up of a planned module with sample data, so you can see the idea. ${txt||''}</div></div>`;
const listenMod=()=>S?.modules.find(m=>m.id==='listen');

/* ============ pages ============ */
const pages={};
pages.dashboard=()=>{
  const live=S.live,lm=listenMod(),st=L.status,stats=st?.stats||{};
  const run=S.modules.filter(m=>m.state==='running').length,tot=S.modules.length,down=S.modules.filter(m=>m.state!=='running');
  const errs=C.entries.filter(e=>e.level==='error'&&e.ts>Date.now()/1000-1800).length;
  const pr=C.pr&&C.pr.ts?C.pr.summary:null;
  const ndev=D?D.devices.length:1;
  const tile=(k,v,s,cls='',go='')=>`<div class="card tile ${cls}" ${go?`data-go="${go}"`:''}><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  return `
  <div class="card hero ${live.live?'live':''}" style="margin-bottom:14px">
    <div class="row wrap"><div>
      <div class="dim sm">${live.live?(live.simulated===null||live.simulated===undefined?'ON AIR':'ON AIR (TEST)'):'OFFLINE · watching '+esc(S.channel)}</div>
      <h1>${live.live?esc(live.title||'Live'):'Ready when you are'}</h1>
      <div class="dim sm">${live.live?`${esc(live.game||'')} · live for ${up(live.since)}`:'Modules wake and the mic starts the moment you go live.'}</div></div>
      <div class="row sp"><div class="stat">${live.viewers}<small>viewers</small></div></div></div>
  </div>
  <div class="card" style="margin-bottom:14px;padding:12px 16px"><div class="devs">${deviceStrip()}</div></div>
  <div class="tiles" style="margin-bottom:14px">
    ${tile('Stream',live.live?'LIVE':'Offline',live.live?`${live.viewers} watching`:'waiting for go-live',live.live?'live':'')}
    ${tile('Chat',M.ok?(M.rate!=null?M.rate+'/min':'—'):'—',M.ok?`queue ${M.queue}`:'Multi is not running','',  'm:multi')}
    ${tile('Devices',ndev+' online',D?'master: '+esc(D.master_name):'this device','', '')}
    ${tile('Modules',run+'/'+tot,down.length?esc(down.map(m=>m.name).join(', '))+' not running':'all healthy',down.length?'warn':'ok')}
    ${tile('Pre-stream',pr?(pr.fail?pr.fail+' fail':pr.warn?pr.warn+' warn':'All ok'):'—',pr?`${pr.pass} ok · ${pr.warn} warn · ${pr.fail} fail`:'not run yet',pr?(pr.fail?'bad':pr.warn?'warn':'ok'):'','console')}
    ${tile('Errors (30 min)',errs,errs?'open the Console':'clean',errs?'bad':'ok','console')}
  </div>
  <div class="col2">
    <div class="grid">
      <div class="card"><div class="row"><h3 style="margin:0">PinguinoListen</h3>${st?.listening?'<span class="pill ok">listening</span>':'<span class="pill">idle</span>'}<span class="sm faint sp">${stats.total||0} lines · ${(stats.corrected||0)+(stats.approved||0)} verified${stats.to_review?` · <span style="color:var(--warn)">${stats.to_review} to review</span>`:''}</span></div>
        <div style="margin-top:8px">${L.lines.length?L.lines.map(s=>`<div class="ln"><span class="t">${fmt(s.t)}</span><div>${wordsHtml(s.words)}</div></div>`).join(''):`<div class="dim sm">${lm?.state==='running'?'Not listening right now. It starts automatically when you go live.':'PinguinoListen is not running.'}</div>`}</div>
        <div class="row" style="margin-top:10px"><button class="sm" data-go="m:listen">Open Listen</button><button class="sm" data-go="voice">Voice Studio</button>${st?.listening?'':'<button id="d-listen" class="pri sm">Start listening</button>'}</div></div>
      <div class="card"><h3>Activity</h3><div class="evt" style="max-height:260px;overflow:auto">${S.events.slice(-14).reverse().map(e=>`<div>${new Date(e.ts*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})} <b class="${e.type==='live'?'lv':e.type==='hook'?'hk':''}">${esc(e.type)}</b> ${esc(e.id||e.state||e.title||'')}</div>`).join('')||'<span class="faint">Nothing yet</span>'}</div></div>
    </div>
    <div class="grid" style="align-content:start">
      <div class="card"><h3>Modules</h3>${S.modules.map(m=>`<div class="minirow"><span class="dot ${m.state}" style="margin:0"></span><div class="grow"><b>${esc(m.name)}</b> <span class="sm faint">${esc(m.state)}</span></div><button class="sm" data-act="${m.id}:${m.state==='stopped'?'start':'restart'}">${m.state==='stopped'?'Start':'Restart'}</button></div>`).join('')}</div>
      ${C.pr&&C.pr.ts?`<div class="card"><div class="row"><h3 style="margin:0">Pre-stream</h3><button class="sm sp" data-go="console">Details</button></div><div style="margin-top:6px">${C.pr.items.filter(i=>i.status!=='pass').slice(0,6).map(i=>`<div class="pr ${i.status}"><span class="d"></span><b>${esc(i.module)}</b><span class="sm">${esc(i.label)}</span></div>`).join('')||'<span class="sm faint">Everything passed.</span>'}</div></div>`:''}
    </div>
  </div>`};

function deviceStrip(){
  if(!D)return '<span class="sm faint">This device</span>';
  const mine=D.devices.find(x=>x.me);

const LV={debug:0,info:1,warn:2,error:3};
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};

pages.console=()=>`<div class="card" id="prcard" style="margin-bottom:14px"><div class="row"><h3 style="margin:0">Pre-stream check</h3><span class="sm faint" id="pr-sub">Runs at 4:30 pm and 4:45 pm Central; stream at 5:00 pm</span><button class="pri sm sp" id="pr-run">Run now</button></div><div id="pr-items" style="margin-top:8px"></div></div>

function renderLog(){const box=$('#clog');if(!box)return;
  const f=C.entries.filter(e=>e.seq>C.clearBefore&&(!C.mod||e.module===C.mod)&&LV[e.level]>=LV[C.errOnly?'error':C.level]&&(!C.q||(e.msg+' '+e.source+' '+e.module).toLowerCase().includes(C.q.toLowerCase())));
  const stick=box.scrollTop+box.clientHeight>=box.scrollHeight-30;
  const rows=f.slice(-800);
  box.innerHTML=rows.map(e=>`<div class="cl ${e.level}"><span class="t">${tm(e.ts)}</span><span class="lv">${e.level}</span><span class="m">${esc(e.module)}</span>${e.source?`<span class="s">${esc(e.source)}</span>`:''}<span>${esc(e.msg)}</span></div>`).join('')||'<div class="cl"><span class="faint">No log lines match.</span></div>';
  if(stick)box.scrollTop=box.scrollHeight;
  $('#c-count')&&($('#c-count').textContent=f.length+' lines'+(C.paused?' (paused)':''));
  const sel=$('#c-mod');if(sel){const mods=[...new Set(C.entries.map(e=>e.module))].sort();
    if(sel.options.length!==mods.length+1){sel.innerHTML='<option value="">All modules</option>'+mods.map(m=>`<option ${m===C.mod?'selected':''}>${esc(m)}</option>`).join('')}}}
function renderPrestream(){const el=$('#pr-items');if(!el)return;const r=C.pr;
  if(!r||!r.ts){el.innerHTML='<span class="faint sm">No check has run yet. Press Run now.</span>';return}
  $('#pr-sub').textContent=`${r.scheduled?'Scheduled '+(r.slot||''):'Manual'} run at ${tm(r.ts)} · ${r.summary.pass} ok · ${r.summary.warn} warn · ${r.summary.fail} fail`;
  const order={fail:0,warn:1,pass:2};
  el.innerHTML=[...r.items].sort((a,b)=>order[a.status]-order[b.status]).map(i=>`<div class="pr ${i.status}"><span class="d"></span><b>${esc(i.module)}</b><span>${esc(i.label)}</span><span class="faint sm">${esc(i.detail||'')}</span></div>`).join('')}
function updateBadge(){const n=C.entries.filter(e=>e.level==='error'&&e.seq>(C.seen??Infinity)).length;const b=$('#cbadge');if(b)b.textContent=n?(n>99?'99+':n):''}
async function pollConsole(){try{const r=await (await fetch(`/api/console?since=${C.seq}&limit=500`)).json();
    if(C.seen===null){C.seen=Math.min(+store.get('consoleSeen')||r.seq,r.seq)}
    if(r.seq<C.seq){C.entries=[];C.seq=0;C.seen=0;return}   // core restarted: sequence restarted
    if(r.entries.length){C.seq=r.seq;if(!C.paused){C.entries=C.entries.concat(r.entries).slice(-5000)}else C.pending=(C.pending||[]).concat(r.entries)}
    else C.seq=Math.max(C.seq,r.seq);
    if(route==='console'&&!C.paused){C.seen=C.seq;store.set('consoleSeen',C.seen);if(r.entries.length)renderLog()}
    updateBadge()}catch{}}
async function pollPrestream(){try{const r=await (await fetch('/api/prestream')).json();
    if(r.ts&&(!C.pr||r.ts!==C.pr.ts)){const first=!C.pr;C.pr=r;renderPrestream();
      if(!first&&r.scheduled&&+store.get('prSeen')!==r.ts){store.set('prSeen',r.ts);
        const sm=r.summary,msg=`Pre-stream check ${r.slot||''}: ${sm.pass} ok, ${sm.warn} warn, ${sm.fail} fail`;toast(msg);
        try{if(window.Notification){const go=()=>new Notification('PinguinoSuite',{body:msg});Notification.permission==='granted'?go():Notification.permission!=='denied'&&Notification.requestPermission().then(p=>p==='granted'&&go())}}catch{}}}
    else if(!C.pr&&r.ts===null){renderPrestream()}}catch{}}
function bindConsole(){
  $('#c-mod').onchange=e=>{C.mod=e.target.value;renderLog()};$('#c-lv').value=C.level;$('#c-lv').onchange=e=>{C.level=e.target.value;renderLog()};
  $('#c-q').value=C.q;$('#c-q').oninput=e=>{C.q=e.target.value;renderLog()};$('#c-err').checked=C.errOnly;$('#c-err').onchange=e=>{C.errOnly=e.target.checked;renderLog()};
  $('#c-pause').textContent=C.paused?'Resume':'Pause';
  $('#c-pause').onclick=()=>{C.paused=!C.paused;if(!C.paused&&C.pending){C.entries=C.entries.concat(C.pending).slice(-5000);C.pending=[]}$('#c-pause').textContent=C.paused?'Resume':'Pause';renderLog()};
  $('#c-clear').onclick=()=>{C.clearBefore=C.seq;renderLog()};

  C.seen=C.seq;store.set('consoleSeen',C.seen);updateBadge();renderLog();renderPrestream()}

  </div>`};
function bindVoice(){
  if(!V.style){$('#v-reload')&&($('#v-reload').onclick=loadVoice);if(!V.err&&!V.loading){V.loading=true;loadVoice().finally(()=>V.loading=false)}return}
  const c=V.cmds,mark=()=>{V.dirty=true;$('#v-save')&&($('#v-save').textContent='Save *')};
  $('#v-unv').onchange=e=>{V.unv=e.target.checked;loadVoice()};
  $('#v-master').onchange=e=>{c.enabled=e.target.checked;mark()};
  $('#v-wake').oninput=e=>{c.wake_word=e.target.value;mark()};$('#v-cool').oninput=e=>{c.cooldown_s=+e.target.value||8;mark()};
  $$('.cmdrow').forEach(r=>{const x=c.commands[+r.dataset.i],q=s=>r.querySelector(s);
    q('.v-ph').oninput=e=>{x.phrase=e.target.value;mark()};q('.v-en').onchange=e=>{x.enabled=e.target.checked;mark()};
    q('.v-ty').onchange=e=>{x.action=e.target.value==='call'?{type:'call',module:(S.modules.find(m=>m.id!=='listen')||{}).id||'',path:'',body:{}}:{type:'marker',label:x.phrase};mark();draw(true)};
    q('.v-label')&&(q('.v-label').oninput=e=>{x.action.label=e.target.value;mark()});
    q('.v-mod')&&(q('.v-mod').onchange=e=>{x.action.module=e.target.value;mark()});q('.v-path')&&(q('.v-path').oninput=e=>{x.action.path=e.target.value;mark()});
    q('.v-body')&&(q('.v-body').oninput=e=>{try{x.action.body=JSON.parse(e.target.value||'{}');e.target.style.borderColor=''}catch{e.target.style.borderColor='var(--live)'}mark()});
    q('.v-del').onclick=()=>{c.commands.splice(+r.dataset.i,1);mark();draw(true)}});
  $('#v-add').onclick=()=>{c.commands.push({id:'c'+Date.now(),phrase:'',enabled:false,action:{type:'marker',label:''}});mark();draw(true)};
  $('#v-save').onclick=async()=>{try{V.cmds=await post(LISTEN+'/api/commands',c);V.dirty=false;toast('Voice commands saved');draw(true)}catch{toast('Could not save (is Listen running?)')}};
  const test=async run=>{const txt=$('#v-testtxt').value;if(!txt)return;try{const r=await post(LISTEN+'/api/commands/test',{text:txt,run});
      V.test=r.matched.length?(run?'Fired: ':'Would trigger: ')+r.results.map(x=>`${x.phrase}${x.ok===false?' (failed: '+x.detail+')':''}`).join(', '):'No command matches that.';
      $('#v-testout').textContent=V.test;if(run)loadVoice()}catch{toast('Listen is not answering')}};
  $('#v-dry').onclick=()=>test(false);$('#v-run').onclick=()=>test(true)}

/* ============ device settings, backup/move, first-run wizard (core: /api/device, /api/export, /api/import, /api/setup) ============ */
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
async function doExport(secrets){const pass=$('#ex-pass').value;
  const r=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({include_secrets:secrets,passphrase:pass})});
  if(!r.ok){toast((await r.json().catch(()=>({}))).detail||'Export failed');return}
  const m=/filename="([^"]+)"/.exec(r.headers.get('content-disposition')||'');saveBlob(await r.blob(),m?m[1]:'pinguino-config.zip');toast(secrets?'Exported with encrypted secrets':'Settings exported')}
let IMP=null;
async function previewImport(file,apply){const pass=$('#im-pass').value,out=$('#im-out');
  const r=await fetch('/api/import?apply='+(apply?1:0),{method:'POST',headers:{'X-Passphrase':pass},body:await file.arrayBuffer()});
  const j=await r.json();if(!r.ok){out.textContent=j.detail||'Import failed';return}
  const names={new:'new',changed:'will change',same:'same',skipped:'skipped'};
  out.innerHTML=(j.needs_passphrase?'<div style="color:var(--warn)">This bundle has secrets: enter its passphrase and choose the file again to include them.</div>':'')
    +`<div class="dim">${j.from?'From '+esc(j.from)+'. ':''}${apply?'Applied (previous files saved under Data/backups). Restart the modules to use them.':'Preview, nothing changed yet:'}</div>`
    +j.files.map(f=>`<div>${esc(f.arc)} <span class="faint">${names[f.status]||f.status}${f.why?' · '+esc(f.why):''}</span></div>`).join('')
    +(apply||!j.files.some(f=>f.status==='new'||f.status==='changed')?'':'<button class="pri sm" id="im-apply" style="margin-top:8px">Apply import</button>');
  if($('#im-apply'))$('#im-apply').onclick=()=>previewImport(file,true)}
function bindPortable(){
  $('#dv-dir')&&SETUP&&($('#dv-dir').textContent=SETUP.data_dir);
  $('#dv-save')&&($('#dv-save').onclick=async()=>{D=await post('/api/device/config',{name:$('#dv-name').value,priority:+$('#dv-prio').value||0});toast('Device saved');draw(true)});
  $('#ex-plain')&&($('#ex-plain').onclick=()=>doExport(false));$('#ex-sec')&&($('#ex-sec').onclick=()=>doExport(true));
  $('#im-file')&&($('#im-file').onchange=e=>e.target.files[0]&&previewImport(e.target.files[0],false))}
let SETUP=null;
async function loadSetup(){try{SETUP=await (await fetch('/api/setup')).json()}catch{return}if(SETUP.first_run)showWizard()}
function showWizard(){let role='streaming';const el=document.createElement('div');el.className='wiz';
  el.innerHTML=`<div class="card"><h2>Welcome to PinguinoSuite</h2><div class="dim sm">Set this computer up. Takes a minute, and you can change it later in Settings.</div>
   <div class="sm faint" style="margin-top:14px">Name this device</div><input type="text" id="w-name" value="${esc(SETUP.device.name)}" style="width:100%">
   <div class="sm faint" style="margin-top:14px">What is this computer?</div>
   <div class="roles">${[['streaming','🖥','Streaming PC','Runs the bots. Master by default.'],['gaming','🎮','Gaming PC','Helper. Can take over if you stream here.'],['mac','💻','Mac','Helper. Can take over if you stream here.']].map(r=>`<div class="role ${r[0]===role?'on':''}" data-role="${r[0]}"><span style="font-size:22px">${r[1]}</span><b>${r[2]}</b><span class="sm faint">${r[3]}</span></div>`).join('')}</div>
   <div class="sm faint">Already set up on another PC? Import its settings (optional)</div>
   <div class="row wrap" style="margin:6px 0"><input type="file" id="w-file" accept=".zip" class="sm"><input type="password" id="w-pass" placeholder="passphrase (if any)" style="width:170px"></div>
   <div class="sm faint" id="w-note">To join your other devices, open the Link page after setup and pair with a code from the master.</div>
   <div class="row" style="margin-top:16px"><span class="sm faint">Data folder: ${esc(SETUP.data_dir)}</span><button class="pri sp" id="w-go">Finish setup</button></div></div>`;
  document.body.append(el);
  el.querySelectorAll('.role').forEach(r=>r.onclick=()=>{role=r.dataset.role;el.querySelectorAll('.role').forEach(x=>x.classList.toggle('on',x===r))});
  el.querySelector('#w-go').onclick=async()=>{const f=el.querySelector('#w-file').files[0];
    try{if(f){const r=await fetch('/api/import?apply=1',{method:'POST',headers:{'X-Passphrase':el.querySelector('#w-pass').value},body:await f.arrayBuffer()});if(!r.ok){el.querySelector('#w-note').textContent=(await r.json()).detail||'Import failed';return}}
      D=await post('/api/setup',{name:el.querySelector('#w-name').value,role});el.remove();SETUP.first_run=false;toast('Setup done');load();draw(true)}catch{el.querySelector('#w-note').textContent='Could not save. Is the core running?'}}}

/* ============ shell ============ */
const titles={console:'Console',dashboard:'Dashboard',voice:'Voice Studio',chat:'Chat',bots:'Bot Control',actions:'Actions & Events',settings:'Settings'};
const REAL=[['voice','🗣','Voice Studio']];
const PREVIEWS=[['chat','💬','Chat'],['bots','🤖','Bot Control'],['actions','⚡','Actions & Events']];
let navSig='';
function renderNav(){if(!S)return;
  const mods=S.modules.filter(m=>m.ui).sort((a,b)=>(a.ui.order??100)-(b.ui.order??100));
  const replaced=new Set(mods.map(m=>m.ui.replaces).filter(Boolean));
  const sig=JSON.stringify([mods.map(m=>[m.id,m.name,m.ui,m.state]),[...replaced],route]);
  if(sig===navSig)return;navSig=sig;
  let h='',sec=null;
  for(const m of mods){const sc=m.ui.section||'Modules';if(sc!==sec){h+=`<h6>${esc(sc)}</h6>`;sec=sc}
    h+=`<div class="item${route==='m:'+m.id?' on':''}" data-r="m:${esc(m.id)}"><span class="ic">${esc(m.ui.icon||'▣')}</span>${esc(m.ui.nav||m.name)}<span class="dot ${esc(m.state||'')}"></span></div>`}
  h+='<h6>Studio</h6>'+REAL.map(x=>`<div class="item${route===x[0]?' on':''}" data-r="${x[0]}"><span class="ic">${x[1]}</span>${x[2]}</div>`).join('');
  const left=PREVIEWS.filter(x=>!replaced.has(x[0]));
  if(left.length)h+='<h6>Planned</h6>'+left.map(x=>`<div class="item${route===x[0]?' on':''}" data-r="${x[0]}"><span class="ic">${x[1]}</span>${x[2]}<span class="tag prev">preview</span></div>`).join('');
  $('#modnav').innerHTML=h;$$('#modnav .item').forEach(i=>i.onclick=()=>go(i.dataset.r))}
const isMod=r=>r.startsWith('m:');
const flushed=()=>isMod(route)&&modOf(route)?.state==='running';
function go(r){if(r==='voice'){V.style=null;V.err=null}route=r;navSig='';renderNav();$$('nav .item').forEach(i=>i.classList.toggle('on',i.dataset.r===r));
  const m=isMod(r)?modOf(r):null;$('#title').textContent=m?(m.ui?.nav||m.name):(titles[r]||r);
  $('#page').classList.toggle('flush',flushed());draw(true)}
let lastHtml='';
function draw(force){if(!S)return;renderNav();
  const html=isMod(route)?pages.module(route):pages[route]();
  if(route==='console'&&!force&&html===lastHtml)return;
  if(isMod(route)){const run=flushed();$('#page').classList.toggle('flush',run);
    if(run&&!force&&$('#mif')&&$('#mif').dataset.src===modSrc(modOf(route)))return;
    if(!run&&!force&&html===lastHtml)return;
    $('#page').innerHTML=html;lastHtml=html;bind();return}
  if(!force&&html===lastHtml)return;
  const sc=$('#page').scrollTop,focus=document.activeElement?.id;
  if(route==='settings'&&!force&&document.activeElement?.tagName==='INPUT')return;
  $('#page').innerHTML=html;lastHtml=html;$('#page').scrollTop=sc;bind()}
function bind(){
  if(route==='console')bindConsole();
  if(route==='voice')bindVoice();
  if(route==='settings')bindPortable();
  $$('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));
  $$('[data-dev]').forEach(b=>b.onclick=async()=>{D=await post('/api/device/'+b.dataset.dev);toast(b.dataset.dev==='take'?'This device is now in control':'Control released');draw(true)});
  $$('[data-act]').forEach(b=>b.onclick=async()=>{const[a,c]=b.dataset.act.split(':');await post(`/api/modules/${a}/${c}`);setTimeout(load,900)});
  $('#d-listen')&&($('#d-listen').onclick=async()=>{try{await fetch(LISTEN+'/api/live/auto',{method:'POST'});toast('Listening started');loadListen()}catch{toast('Listen is not running')}});
  $('#s-chan')&&($('#s-chan').onchange=async e=>{await post('/api/channel',{channel:e.target.value});toast('Channel saved')});
  $('#s-wa')&&($('#s-wa').onchange=async e=>{await post('/api/windows-autostart',{on:e.target.checked});toast(e.target.checked?'Will start with Windows':'Autostart off')});
  $$('[data-mod]').forEach(i=>i.onchange=()=>post(`/api/modules/${i.dataset.mod}/options`,{[i.dataset.opt]:i.checked}));
}
$$('nav .item[data-r]').forEach(i=>i.onclick=()=>go(i.dataset.r));
function toast(m){const d=document.createElement('div');d.textContent=m;$('#toast').append(d);setTimeout(()=>d.remove(),3500)}
$('#simon').onclick=()=>{post('/api/simulate',{live:true});toast('Simulating go-live…')};
$('#simoff').onclick=()=>post('/api/simulate',{live:false}).then(()=>post('/api/simulate',{live:null}));

async function load(){try{S=await (await fetch('/api/state')).json()}catch{return}
  const l=S.live;$('#pill').classList.toggle('on',l.live);$('#pill-t').textContent=l.live?'LIVE':'Offline';
  $('#pill-sub').textContent=l.live?`${l.viewers} watching · ${up(l.since)}`:(l.error?'Twitch check: '+l.error.slice(0,60):'');
  const lm=listenMod();if(lm?.url)LISTEN=lm.url.replace(/\/$/,'');
  $('#navfoot').textContent=`Watching ${S.channel}`;draw()}
async function loadDevice(){try{D=await (await fetch('/api/device')).json()}catch{return}if(route==='dashboard')draw()}
async function loadMulti(){try{const m=await (await fetch('/api/modules/multi/probe')).json();const n=Date.now(),inn=m.stats?.in??0;
  if(M.prev&&n>M.prev.n)M.rate=Math.max(0,Math.round((inn-M.prev.inn)*60000/(n-M.prev.n)));M.prev={n,inn};M.ok=true;M.queue=m.queue??0}catch{M.ok=false;M.rate=null;M.prev=null}if(route==='dashboard')draw()}
async function loadListen(){try{const st=await (await fetch(LISTEN+'/api/status')).json();L.status=st;
  let sid=st.live_session;if(!sid){const ss=await (await fetch(LISTEN+'/api/sessions')).json();sid=ss.find(s=>s.segments)?.id}
  L.lines=sid?(await (await fetch(`${LISTEN}/api/segments?session=${sid}&limit=500`)).json()).slice(-5):[]}catch{L.status=null;L.lines=[]}
  if(route==='dashboard')draw()}
(async()=>{await load();go('dashboard');loadListen();setInterval(load,4000);setInterval(loadListen,3000);loadSetup();loadDevice();loadMulti();setInterval(loadDevice,5000);setInterval(loadMulti,6000);pollConsole();pollPrestream();setInterval(pollConsole,1500);setInterval(pollPrestream,10000);
  const ws=()=>{const w=PG.ws();w.onmessage=()=>load();w.onclose=()=>setTimeout(ws,2000)};ws()})();
</script>
