<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PinguinoSuite</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0e0f14;--bg2:#171922;--orange:#ff8a1f;--deep:#c25a00;--text:#f2f3f7;--dim:#8d92a3}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:transparent}
body{display:grid;place-items:center;font-family:"Segoe UI",system-ui,sans-serif;color:var(--text)}
.card{width:100%;height:100%;border-radius:22px;border:1px solid #2a2d3a;background:radial-gradient(circle at 50% 30%,var(--bg2),var(--bg));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;box-shadow:inset 0 0 0 1px rgba(255,138,31,.12)}
.logo{width:168px;height:168px;border-radius:50%;animation:pulse 2.2s ease-in-out infinite}
.logo img{width:100%;height:100%;display:block}
h1{font-size:26px;letter-spacing:.5px;font-weight:700}
h1 b{color:var(--orange)}
p{font-size:13px;color:var(--dim)}
.bar{width:220px;height:4px;border-radius:2px;background:#262938;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:40%;border-radius:2px;background:linear-gradient(90deg,var(--deep),var(--orange));animation:slide 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 10px rgba(255,138,31,.25))}50%{transform:scale(1.04);filter:drop-shadow(0 0 22px rgba(255,138,31,.55))}}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.logo,.bar i{animation:none}}
</style></head>
<body><div class="card">
  <div class="logo"><img src="assets/logo.png" alt=""></div>
  <h1>Pinguino<b>Suite</b></h1>
  <p>waking the penguins…</p>
  <div class="bar"><i></i></div>
</div></body></html>
