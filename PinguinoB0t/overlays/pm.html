<!doctype html>
<!--
  PinguinoB0t - PM NAME widget (scene HUD). Tiny line for under the Rocket League scoreboard: "name: pengXXX" (the viewers' private-match name).
  Data: Host GET /api/customs/state key pmName (polled every 3 s). Visible only while pmName is set AND a customs activity runs (not none/end/idle...) AND the queue is open, someone waits or a match is live; else hidden (also when the Host is unreachable).
  Params: host=http://127.0.0.1:8770 | preview=1 (sample, no Host needed) | label=name (text before the colon). Design size 420 x 56.
-->
<html><head><meta charset="utf-8"><title>PM Name</title>
<style>
  @font-face{font-family:"Nunito";src:url("fonts/nunito-latin-wght-normal.woff2") format("woff2");font-weight:200 1000;font-style:normal;font-display:block}
  html,body{margin:0;width:420px;height:56px;overflow:hidden;background:transparent;font-family:"Nunito",Rubik,"Segoe UI",Arial,sans-serif}
  #p{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:408px;box-sizing:border-box;padding:4px 18px;border-radius:999px;background:rgba(18,16,14,.86);border:2px solid #ff7a00;box-shadow:0 0 12px #ff7a0066;color:#fff;font-size:30px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.85);transition:opacity .4s}
  #p b{color:#ff9d3c;font-weight:700}
  #p.off{opacity:0}
</style></head><body>
<div id="p" class="off"><b id="l">name:</b> <span id="v"></span></div>
<script>
(function(){
  var Q=new URLSearchParams(location.search), HOST=Q.get("host")||(location.protocol.indexOf("http")===0?location.origin:"http://127.0.0.1:8770");
  var p=document.getElementById("p"), l=document.getElementById("l"), v=document.getElementById("v"), fails=0;
  l.textContent=(Q.get("label")||"name")+":";
  var DEAD={"":1,none:1,end:1,ended:1,idle:1,off:1,stop:1,stopped:1,closed:1};
  function show(j){
    var n=String((j&&j.pmName)||"").trim(), act=String((j&&j.activity)||"").trim().toLowerCase().replace(/^(rl|fn)\s+/,"");
    var m=j&&j.match, live=!!(m&&m.status!==undefined&&m.status!==null&&String(m.status).toLowerCase()!=="done"&&String(m.status).toLowerCase()!=="ended");
    var busy=!!(j&&j.open)||((j&&j.queue)||[]).length>0||live;   // a private match is only "on" while the queue is open / people wait / a match runs
    if(!n||DEAD[act]||!busy){p.className="off";return;}   // empty/stale name, activity ended (none/end/idle...), or nothing in progress: hidden
    v.textContent=n; p.className="";
  }
  function bad(){ if(++fails>=3) p.className="off"; }   // Host unreachable for ~9 s: hide
  function poll(){fetch(HOST+"/api/customs/state").then(function(r){return r.json();}).then(function(j){if(j&&j.ok!==false){fails=0;show(j);}else bad();}).catch(bad);}
  if(Q.get("preview")==="1") show({pmName:"pengDEMO",activity:"competitive",open:true});
  else{poll();setInterval(poll,3000);}
})();
</script>
<script src="overlay-options.js"></script>
</body></html>
