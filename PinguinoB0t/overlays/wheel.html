<!doctype html>
<!--
  PinguinoB0t - TOURNAMENT WHEEL overlay (OBS Browser Source), served by PinguinoHost:  http://127.0.0.1:8770/overlay/wheel.html
  Size 1280 x 720 (transparent background). Reads /api/wheel/public every half second.
  Every spin makes ONE pick the moment a mod presses SPIN (!wheel spin / !spin / the PinguinoSuite button): this page only
  ever sees picks that already exist, and keeps the newest one hidden until the wheel has stopped.
  Preview without the bot: wheel.html?demo
-->
<html>
<head>
<meta charset="utf-8">
<title>Tournament Wheel</title>
<style>
  :root { --orange:#ff9900; --panel:rgba(20,22,17,.94); --line:#36382f; --gold:#ffd166; --text:#f5f2eb; --muted:#a9aaa1; }
  html, body { margin:0; width:1280px; height:720px; overflow:hidden; background:transparent; font-family:"Rubik","Segoe UI",sans-serif; color:var(--text); }
  #root { position:absolute; inset:0; display:flex; gap:28px; align-items:center; justify-content:center; transition:opacity .5s; }
  #root.off { opacity:0; }
  .wheelbox { position:relative; width:520px; height:560px; }
  canvas { position:absolute; left:10px; top:40px; }
  .pointer { position:absolute; left:50%; top:22px; margin-left:-16px; width:0; height:0; border-left:16px solid transparent; border-right:16px solid transparent; border-top:44px solid var(--gold); filter:drop-shadow(0 3px 4px rgba(0,0,0,.6)); z-index:3; }
  .banner { position:absolute; left:0; right:0; bottom:0; text-align:center; font-size:30px; font-weight:800; color:#fff; text-shadow:0 2px 8px #000; min-height:40px; }
  .banner b { color:var(--orange); }
  .card { width:380px; max-height:620px; overflow:hidden; padding:18px 18px 14px; background:var(--panel); border:1px solid var(--line); border-radius:18px; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  h1 { margin:0 0 4px; font-size:22px; font-weight:800; letter-spacing:1px; text-transform:uppercase; }
  h1 span { color:var(--orange); }
  .sub { font-size:14px; color:var(--muted); margin-bottom:12px; letter-spacing:.5px; }
  .team { display:flex; gap:10px; align-items:center; padding:7px 10px; margin-bottom:6px; border:1px solid var(--line); border-left:5px solid var(--orange); border-radius:10px; background:rgba(255,255,255,.04); font-size:20px; font-weight:700; }
  .team i { font-style:normal; color:var(--orange); min-width:26px; }
  .team.empty { opacity:.55; }
  .wait { margin-top:8px; font-size:15px; color:var(--muted); }
  .wait b { color:var(--gold); }
  .pill { display:inline-block; padding:3px 10px; margin:2px; border-radius:999px; background:rgba(255,255,255,.08); font-size:15px; }
  .win { color:var(--gold); }
  .signed { position:absolute; left:0; top:0; padding:5px 14px; border-radius:999px; background:var(--panel); border:1px solid var(--line); font-size:18px; font-weight:800; z-index:4; }
  .signed b { color:var(--orange); }
  .feed { position:absolute; left:0; top:44px; width:230px; z-index:4; }
  .feed div { margin-bottom:4px; padding:4px 10px; border-radius:8px; background:rgba(20,22,17,.9); border-left:4px solid var(--orange); font-size:16px; font-weight:700; }
  .feed .leave { border-left-color:#a9aaa1; color:var(--muted); }
</style>
</head>
<body>
<div id="root" class="off">
  <div class="wheelbox">
    <div class="signed" id="signed"></div>
    <div class="feed" id="feed"></div>
    <div class="pointer"></div>
    <canvas id="cv" width="500" height="500"></canvas>
    <div class="banner" id="banner"></div>
  </div>
  <div class="card">
    <h1 id="title">Tournament <span>wheel</span></h1>
    <div class="sub" id="sub"></div>
    <div id="list"></div>
    <div class="wait" id="wait"></div>
  </div>
</div>
<script>
(function () {
  var DEMO = /[?&]demo/.test(location.search);
  var cv = document.getElementById('cv'), cx = cv.getContext('2d');
  var skew = 0, data = null, spinKey = '', spinFrom = 0, spinTo = 0, spinStartMs = 0, spinMs = 8500, landName = '', landedShown = '', angle = 0;
  var COLORS = ['#ff9900', '#3a3d33', '#e07a00', '#4a4d41', '#ffb84d', '#2c2e26'];

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function ease(t) { return 1 - Math.pow(1 - t, 4); }

  function draw(names, ang) {
    var n = names.length, R = 240, c = 250;
    cx.clearRect(0, 0, 500, 500);
    if (!n) {
      cx.beginPath(); cx.arc(c, c, R, 0, 7); cx.fillStyle = '#2c2e26'; cx.fill();
      cx.fillStyle = '#a9aaa1'; cx.font = '700 26px Rubik, sans-serif'; cx.textAlign = 'center'; cx.fillText('type !me to join', c, c + 8);
      return;
    }
    var seg = Math.PI * 2 / n;
    for (var i = 0; i < n; i++) {
      var a0 = ang + i * seg - Math.PI / 2 - seg / 2, a1 = a0 + seg;
      cx.beginPath(); cx.moveTo(c, c); cx.arc(c, c, R, a0, a1); cx.closePath();
      cx.fillStyle = COLORS[i % COLORS.length]; cx.fill();
      cx.strokeStyle = '#14160f'; cx.lineWidth = 2; cx.stroke();
      if (n <= 60) {
        cx.save(); cx.translate(c, c); cx.rotate(a0 + seg / 2); cx.textAlign = 'right'; cx.fillStyle = (i % 2 === 0) ? '#14160f' : '#f5f2eb';
        var fs = Math.max(11, Math.min(24, 300 / n * 1.6)); cx.font = '700 ' + fs + 'px Rubik, sans-serif';
        var nm = String(names[i]); if (nm.length > 14) nm = nm.slice(0, 13) + '…';
        cx.fillText(nm, R - 14, fs / 3); cx.restore();
      }
    }
    cx.beginPath(); cx.arc(c, c, 34, 0, 7); cx.fillStyle = '#14160f'; cx.fill(); cx.strokeStyle = '#ff9900'; cx.lineWidth = 4; cx.stroke();
  }

  function nowAdj() { return Date.now() - skew; }

  function render() {
    var d = data, root = document.getElementById('root');
    if (!d || d.status === 'none' || d.status === 'closed') { root.className = 'off'; return; }
    root.className = '';
    var sp = d.spin, names = (d.queue || []).slice(), pending = false, t = 1;
    if (sp && sp.at) {
      t = sp.ms > 0 ? (nowAdj() - sp.at) / sp.ms : 1;
      pending = t < 1;
    }
    // start (or resume) an animation when a new spin shows up
    var key = sp ? sp.id + ':' + sp.at : '';
    if (key && key !== spinKey && sp.landing && sp.landing.length) {
      spinKey = key; landName = sp.landing[0]; spinMs = sp.ms; spinStartMs = sp.at;
      var idx = Math.max(0, names.indexOf(landName)), n = Math.max(1, names.length);
      spinFrom = angle % (Math.PI * 2);
      var target = -idx * (Math.PI * 2 / n);
      spinTo = spinFrom + (Math.PI * 2 * 6) + ((target - spinFrom) % (Math.PI * 2) - Math.PI * 2) % (Math.PI * 2);
    }
    if (spinKey === key && key) {
      var tt = Math.min(1, Math.max(0, spinMs > 0 ? (nowAdj() - spinStartMs) / spinMs : 1));
      angle = spinFrom + (spinTo - spinFrom) * ease(tt);
    }
    draw(names, angle);

    var landed = !pending, hide = pending && sp ? (sp.landing || []) : [];
    var banner = document.getElementById('banner');
    if (landed && sp && sp.landing && sp.landing.length && !d.final) banner.innerHTML = '<span class="win">' + esc(sp.landing.join(' & ')) + '</span>';
    else if (d.final) banner.innerHTML = 'TEAMS <b>LOCKED IN</b>';
    else if (d.status === 'open') banner.innerHTML = 'Type <b>!me</b> to join (' + names.length + ' waiting)';
    else banner.innerHTML = '';

    document.getElementById('signed').innerHTML = '<b>' + (d.signedUp || 0) + '</b> signed up';
    var fh = '', fm = d.feedMs || 2000;
    (d.feed || []).forEach(function (f) {
      var age = nowAdj() - f.at;
      if (age < 0 || age >= fm) return;
      fh += '<div class="' + f.kind + '" style="opacity:' + Math.max(0, Math.min(1, (fm - age) / 400)).toFixed(2) + '">' + esc(f.name) + (f.kind === 'join' ? ' joined' : ' left') + '</div>';
    });
    document.getElementById('feed').innerHTML = fh;

    var title = document.getElementById('title'), sub = document.getElementById('sub'), list = document.getElementById('list'), wait = document.getElementById('wait');
    title.innerHTML = d.final ? 'Final <span>teams</span>' : 'Tournament <span>wheel</span>';
    sub.textContent = (d.mode === 'balanced' ? 'Rigged / balanced by MMR' : 'True random') + ' · teams of ' + d.teamSize + (d.round ? ' · round ' + (d.round + 1) : '');
    var h = '';
    if (d.teams && d.teams.length) {
      d.teams.forEach(function (tm) {
        var mem = tm.members.filter(function (m) { return hide.indexOf(m) < 0; });
        h += '<div class="team' + (mem.length ? '' : ' empty') + '"><i>' + tm.n + '</i>' + (mem.length ? esc(mem.join(' & ')) : '…') + '</div>';
      });
    } else if (d.picks && d.picks.length) {
      d.picks.forEach(function (p) { if (hide.indexOf(p.name) < 0) h += '<span class="pill">' + esc(p.name) + '</span>'; });
    } else if (d.status === 'open') h = '<div class="sub">Waiting for the first spin…</div>';
    list.innerHTML = h;
    wait.innerHTML = (d.final && d.waitlist && d.waitlist.length) ? '<b>Waiting:</b> ' + d.waitlist.map(esc).join(', ') : '';
  }

  function demoData() {
    var q = ['Ana', 'Bo', 'Cy', 'Dee', 'Eli', 'Flo', 'Gus', 'Hal'];
    return { status: 'drawing', mode: 'random', teamSize: 2, round: 0, final: false, queue: q, picks: [{ name: 'Cy', team: 1 }], teams: [{ n: 1, members: ['Cy'], partial: false }],
             signedUp: 8, feed: [{ name: 'Ana', kind: 'join', at: Date.now() - 300 }, { name: 'Bo', kind: 'leave', at: Date.now() - 900 }], feedMs: 2000, waitlist: [], spin: { id: 'demo', at: Date.now() - 1500, ms: 8500, landing: ['Cy'], revealed: 1 }, now: Date.now() };
  }

  function poll() {
    if (DEMO) { data = data || demoData(); skew = 0; return; }
    var t0 = Date.now();
    fetch('/api/wheel/public', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) { data = j; skew = t0 - (j.now || t0); }).catch(function () { });
  }
  poll(); setInterval(poll, 500);
  (function loop() { try { render(); } catch (e) { } requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
