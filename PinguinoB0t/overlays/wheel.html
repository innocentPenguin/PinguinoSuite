<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Tournament Wheel Overlay</title>
<!-- OBS browser source for the tournament teams. Public and tokenless: it only reads /api/wheel/public (no ids, MMR or seed).
     MANUAL SPIN: the wheel is always on screen with everyone who can still be picked. A mod presses "Spin" on /mod/wheel: ONE pick spins, lands on the name the
     server committed, the name leaves the wheel and joins its team card. Nothing advances by itself. (The old timed reveal still exists as a fallback: "Auto reveal" on the mod page.)
     Options (query string): cam=right|left|none (default right: keeps everything out of the right 32% where the webcam sits) | camw=0..60 (percent kept free, default 32)
     | bg=transparent|RRGGBB | accent, card, fg = RRGGBB | font=Name | duration=ms (auto fallback only: length of one pick) | sound=1 (ticks while the wheel spins, a chime when it lands;
     click the source once, or enable "Control audio via OBS") -->
<style>
:root{--bg:#141414;--face:#2c2f35;--grey:#1d1d1d;--down:0vh;--sw:calc(100vw - var(--l) - var(--r));--fg:#fff;--accent:#ff9900;--card:#1b1610;--font:system-ui,Segoe UI,Arial,sans-serif;--l:0vw;--r:32vw}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden}
body.clear{background:transparent}
#stage{position:fixed;top:var(--down);bottom:0;left:calc(var(--l) + 1vw);right:calc(var(--r) + 1vw);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1.2vmin;padding:1.2vmin 2vmin 0}
#head{flex:none;display:flex;flex-direction:column;align-items:center;gap:.4vmin;text-align:center;width:100%}
#body{flex:1;min-height:0;width:100%;position:relative;container-type:size;display:flex;align-items:center;justify-content:center}
#side{position:fixed;right:2.2vw;bottom:3.5vh;z-index:5;width:max-content;max-width:38vw;display:flex;flex-direction:column;align-items:stretch;gap:1.4vmin}
#title{font-size:7.25vmin;font-weight:900;letter-spacing:.03em;color:var(--accent);-webkit-text-stroke:.9vmin #0a0a0a;paint-order:stroke fill;text-shadow:0 2px 10px #000b}
#label{font-size:4.25vmin;font-weight:900;letter-spacing:.03em;color:#fff;-webkit-text-stroke:.7vmin #0a0a0a;paint-order:stroke fill;text-shadow:0 2px 8px #000}
#label:empty{display:none}
#wheelbox{position:relative;flex:none;width:var(--wd);height:var(--wd);--wd:min(calc(100vh - var(--down) - 3vh - 14vmin),calc(var(--sw) - 4vmin));--wd:min(112cqw,112cqh);left:2.5vmin}
#wheelbox.off{display:none}
#cv{width:100%;height:100%;display:block}
#wheelbox.landed #cv{animation:glow .9s ease-out}
#hub{position:absolute;left:50%;top:50%;width:min(calc(var(--wd) * .216),220px);height:min(calc(var(--wd) * .216),220px);transform:translate(-50%,-50%);border-radius:50%;object-fit:cover;border:calc(var(--wd) * .008) solid #ff9900;background:#22252b;pointer-events:none;image-rendering:auto;will-change:transform;backface-visibility:hidden}
#pick{z-index:2;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:70%;text-align:center;font-weight:900;color:#fff;background:#141414e6;border:.9vmin solid var(--accent);border-radius:50vmin;padding:1.6vmin 4vmin;font-size:calc(var(--wd) * .1);-webkit-text-stroke:.6vmin #000;paint-order:stroke fill;box-shadow:0 0 0 .6vmin #000,0 0 6vmin #000e,0 0 5vmin #ff9900aa;overflow-wrap:anywhere;animation:slam .6s cubic-bezier(.2,1.7,.4,1)}
#pick[hidden]{display:none}
#teams{width:100%}
#teams:empty{display:none}
.team{min-width:26vmin;background:linear-gradient(#18120b,#0a0807);border:.7vmin solid var(--accent);border-radius:2.4vmin;padding:1.8vmin 3vmin 2.2vmin;box-shadow:0 0 0 .5vmin #000,0 1.4vmin 5vmin #000d,0 0 4vmin #ff990066;animation:teampop .6s cubic-bezier(.2,1.5,.4,1)}
.team h3{margin:0 0 1.2vmin;font-size:3.6vmin;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);border-bottom:.3vmin solid #ff990066;padding-bottom:.9vmin}
.team div{font-size:5.2vmin;font-weight:900;line-height:1.2;overflow-wrap:anywhere;text-shadow:0 2px 6px #000}
.team div.new{color:#ffd27a;animation:memberpop .7s cubic-bezier(.2,1.8,.4,1)}
.team.sm{padding:1.2vmin 2vmin 1.4vmin}.team.sm h3{font-size:2.4vmin;margin-bottom:.6vmin;padding-bottom:.5vmin}.team.sm div{font-size:3.4vmin;font-weight:800}
.team div.empty{opacity:.35;font-weight:400}
.team.wip{border-style:dashed;opacity:.9}
.team.part h3::after{content:" (partial)";opacity:.7;font-size:1.8vmin}
.team.fresh{border-color:var(--accent);box-shadow:0 0 3vmin #ff990088}
#big{font-size:5.5vmin;font-weight:900;color:var(--accent);text-shadow:0 2px 14px #000c;text-align:center}
#big:empty{display:none}
#final{display:none!important;font-size:2.6vmin;font-weight:700;text-align:center;max-width:100%;overflow-wrap:anywhere;line-height:1.35;background:var(--card);border:.3vmin solid #ff990066;border-radius:1.8vmin;padding:1.2vmin 2vmin}
#final:empty{display:none}
#wait{font-size:2.1vmin;opacity:.8;text-align:center}
@keyframes teampop{0%{transform:scale(.5) translateY(4vh);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:none}}
@keyframes memberpop{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes slam{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}65%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes glow{0%{filter:drop-shadow(0 0 5vmin #ffcc66)}100%{filter:none}}
</style></head><body>
<div id="stage"><div id="head"><div id="title"></div><div id="label"></div></div><div id="body"><div id="wheelbox"><canvas id="cv"></canvas><img id="hub" src="penguin-anim.gif" alt=""><div id="pick" hidden></div></div></div></div><div id="side"><div id="big"></div><div id="teams"></div><div id="final"></div><div id="wait"></div></div>
<script>(()=>{
const q=new URLSearchParams(location.search),R=document.documentElement.style;
const ok=v=>/^#?[0-9a-fA-F]{3,8}$/.test(v||''),hex=v=>v.startsWith('#')?v:'#'+v;
if(q.get('bg')==='transparent')document.body.classList.add('clear');else if(ok(q.get('bg')))R.setProperty('--bg',hex(q.get('bg')));
for(const k of ['accent','card','fg'])if(ok(q.get(k)))R.setProperty('--'+k,hex(q.get(k)));
const f=q.get('font');if(f&&/^[\w ,-]{1,60}$/.test(f))R.setProperty('--font',f+',system-ui,sans-serif');
// Webcam safe area: the stage never uses the side where the camera sits (default right, 32% of the width).
{const cam=q.get('cam')==='left'?'left':q.get('cam')==='none'?'none':'right';const w=cam==='none'?0:Math.max(0,Math.min(60,q.get('camw')==null||q.get('camw')===''?32:+q.get('camw')||0));
 R.setProperty('--l',cam==='left'?w+'vw':'0vw');R.setProperty('--r',cam==='right'?w+'vw':'0vw')}
if(q.get('down')!=null&&q.get('down')!==''&&isFinite(+q.get('down')))R.setProperty('--down',Math.max(-20,Math.min(40,+q.get('down')))+'vh');   // how far the whole overlay sits lower on screen (default 6)
const dur=+q.get('duration')>0?Math.max(300,Math.min(30000,+q.get('duration'))):0;
const sound=q.get('sound')!=='0';
let actx=null;
const beep=(f1,len,vol,type)=>{if(!sound)return;try{actx=actx||new AudioContext();if(actx.state==='suspended')actx.resume();const o=actx.createOscillator(),g=actx.createGain();o.type=type||'triangle';o.frequency.value=f1;g.gain.setValueAtTime(vol,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+len);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+len)}catch{}};
const tick=()=>beep(1500,.03,.16,'square'),chime=()=>{beep(660,.35,.08);setTimeout(()=>beep(990,.5,.08),120)};
if(sound)addEventListener('click',()=>{try{(actx=actx||new AudioContext()).resume()}catch{}});
const $=id=>document.getElementById(id);
// What the pick pill says: the name just picked, or the WHOLE team ('A + B') when this pick completes it.
function pickText(steps,upto,sizes){const cur=steps[upto-1],mem=steps.slice(0,upto).filter(s=>s.team===cur.team).map(s=>s.name),sz=sizes&&sizes[cur.team];return mem.length>1&&mem.length>=sz?mem.join(' + '):cur.name}
const TAU=Math.PI*2,SPIN=.78; // timed fallback: the first 78% of a pick is the spin. Manual: SPINF of the spin time is movement, the rest shows the landed name
const SPINF=.66;
const hashStr=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};

const ease=p=>1-Math.pow(1-p,4);
// Slice order: a stable, seeded shuffle of the names (same for every viewer/refresh, and removing a name keeps the others where they are).
const orderOf=(names,salt)=>names.slice().sort((a,b)=>hashStr(salt+'|'+a)-hashStr(salt+'|'+b)||(a<b?-1:1));
const GREY=getComputedStyle(document.documentElement).getPropertyValue('--face').trim()||'#3a3f47';   // the wheel face (a different shade from the page and the stage panel)
const cv=$('cv'),ctx=cv.getContext('2d');let size=0;
let _fam='';const FAM=()=>_fam||(_fam=getComputedStyle(document.body).fontFamily);   // read once, not per frame
// repaint-free: the paint loop re-sets labels every frame; writing the same text again re-lays-out the page and made the preview flicker. Skip no-op writes.
(()=>{const d=Object.getOwnPropertyDescriptor(Node.prototype,'textContent');Object.defineProperty(Node.prototype,'textContent',{get:d.get,set(v){v=v==null?'':String(v);if(this.nodeType===1){const k=this.firstChild;if((!k&&v==='')||(k&&k===this.lastChild&&k.nodeType===3&&k.data===v))return}d.set.call(this,v)},configurable:true})})();
function fit(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1),s=Math.max(10,Math.round(r.width*dpr));if(s!==size){size=s;cv.width=s;cv.height=s}}
// ---- colours: flat, vibrant, one per player. Ivan = Penguino orange; everyone else = their Twitch chat colour (the site sends it), else one of the 15 default Twitch colours by name.
const TW15=['#FF0000','#0000FF','#00FF00','#B22222','#FF7F50','#9ACD32','#FF4500','#2E8B57','#DAA520','#D2691E','#5F9EA0','#1E90FF','#FF69B4','#8A2BE2','#00FF7F'];
const isIvan=n=>/^innocentpenguin_?$/i.test(n||'');
function toHsl(x){const r=parseInt(x.slice(1,3),16)/255,g=parseInt(x.slice(3,5),16)/255,b=parseInt(x.slice(5,7),16)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
 if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return {h,s,l}}
function toHex(c){const h=((c.h%360)+360)%360,s=c.s,l=c.l,a=s*Math.min(l,1-l),k=n=>(n+h/30)%12,fn=n=>{const v=l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return Math.round(v*255).toString(16).padStart(2,'0')};return '#'+fn(0)+fn(8)+fn(4)}
function lum(x){const ch=i=>{const v=parseInt(x.slice(i,i+2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*ch(1)+.7152*ch(3)+.0722*ch(5)}
const alike=(a,b)=>{const dh=Math.abs(a.h-b.h),d=Math.min(dh,360-dh);return d<18&&Math.abs(a.l-b.l)<.1};
let cmapKey='',cmap={};
// Classic even palette (same saturation/brightness all round); Ivan stays Penguino orange. The colour follows the player's place in a stable name order, so it never changes when somebody leaves the wheel.
const PALETTE=['#e53935','#fb8c00','#fdd835','#43a047','#00acc1','#1e88e5','#8e24aa','#ec407a'];
function colorMap(names){
 const key=names.join('\u0001');if(key===cmapKey)return cmap;
 const out={};let i=0;
 for(const nm of names.slice().sort((a,b)=>hashStr(a)-hashStr(b)||(a<b?-1:1))){out[nm]={bg:isIvan(nm)?'#ff9900':PALETTE[i%PALETTE.length],fg:'#ffffff'};i++}
 cmapKey=key;cmap=out;return out;
}
let kick=0;
function arcText(s,txt,r,fs,mid){ // text curved along the top of a circle, centred on angle mid
 ctx.save();ctx.font='800 '+fs+'px '+FAM();ctx.fillStyle='#ffffff';ctx.textAlign='center';ctx.textBaseline='middle';
 const step=fs*.62/r,start=mid-step*(txt.length-1)/2;
 for(let i=0;i<txt.length;i++){ctx.save();ctx.rotate(start+i*step+Math.PI/2);ctx.translate(0,-r);ctx.fillText(txt[i],0,0);ctx.restore()}
 ctx.restore();
}
function drawWheel(order,rot){
 fit();const s=size,c=s/2,Rr=s*.43,hub=s*.12,n=order.length,a=TAU/Math.max(1,n);ctx.clearRect(0,0,s,s);
 ctx.save();ctx.translate(c,c);
 // white rim with a soft shadow
 ctx.save();ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=s*.03;ctx.shadowOffsetY=s*.01;ctx.beginPath();ctx.arc(0,0,Rr+s*.0047,0,TAU);ctx.fillStyle='#555a63';ctx.fill();ctx.restore();
 ctx.save();ctx.rotate(rot);
 ctx.beginPath();ctx.arc(0,0,Rr,0,TAU);ctx.fillStyle=GREY;ctx.fill();   // penguin grey wheel background
 const fs=Math.min(s*.06,Rr*a*.55),text=fs>=s*.017,fam=FAM(),maxW=Rr*.95-hub*1.12;
 for(let j=0;j<n;j++){
  const st=j*a,col=cmap[order[j]]||{bg:'#ff9900',fg:'#14100a'};
  if(n===1){ctx.beginPath();ctx.arc(0,0,Rr,0,TAU);ctx.fillStyle=col.bg;ctx.fill()}
  else{ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,Rr,st,st+a);ctx.closePath();ctx.fillStyle=col.bg;ctx.fill();ctx.lineWidth=Math.max(1,s*.005);ctx.strokeStyle=GREY;ctx.stroke()}
  if(text){ctx.save();ctx.rotate(st+a/2);ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle='#ffffff';ctx.lineJoin='round';ctx.strokeStyle='#000';ctx.lineWidth=4*(s/Math.max(1,cv.getBoundingClientRect().width));ctx.font='800 '+Math.max(s*.028,fs)+'px '+fam;
   let t=order[j];const w0=ctx.measureText(t).width;if(w0>maxW)ctx.font='800 '+Math.max(s*.02,Math.max(s*.028,fs)*maxW/w0)+'px '+fam;
   while(ctx.measureText(t).width>maxW&&t.length>2)t=t.slice(0,-2)+'\u2026';
   ctx.strokeText(t,Rr*.95,0);ctx.fillText(t,Rr*.95,0);ctx.restore()}
 }
 ctx.restore();
 // centre hub: dark disc behind the animated penguin (the <img id="hub"> on top of the canvas)
 ctx.save();ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=s*.02;ctx.beginPath();ctx.arc(0,0,hub,0,TAU);ctx.fillStyle='#22252b';ctx.fill();ctx.restore();
 // pointer: small static penguin-orange arrow on the right edge, pointing into the wheel
 ctx.save();const px=Rr+s*.07,ow=s*.007;ctx.beginPath();ctx.moveTo(px,-s*.035);ctx.lineTo(px,s*.035);ctx.lineTo(Rr-s*.045,0);ctx.closePath();
 ctx.lineJoin='round';ctx.lineCap='round';ctx.lineWidth=ow*2;ctx.strokeStyle='#0a0a0a';ctx.stroke();ctx.fillStyle='#ff9900';ctx.fill();ctx.restore();   // outline = ow all round

}
// Where the wheel stops: the picked slice's centre (plus a little seeded jitter) under the pointer (right edge), after 5-7 full turns.
function planFor(order,name,key){
 const n=order.length,a=TAU/n,k=Math.max(0,order.indexOf(name)),r=rng(hashStr(key)),jit=(r()-.5)*.6,turns=5+Math.floor(r()*3);

const IDLE_DELAY=1800,IDLE_V=.045,IDLE_RAMP=2;let idleSince=0;
const idleRot=ms=>{const t=ms/1000;return t<IDLE_RAMP?IDLE_V*t*t/(2*IDLE_RAMP):IDLE_V*(t-IDLE_RAMP/2)};   // starts from standstill, eases up to a slow turn
let off=0,w=null,lastKey='',lastCount=-1,lastSlice='',landedFor='',lastDraw='';
async function poll(){
 try{const t0=Date.now();const r=await fetch('/api/wheel/public',{cache:'no-store'});const j=await r.json();const t1=Date.now();off=j.serverNow-(t0+t1)/2;w=j}catch{}
 setTimeout(poll,2000);
}
// team cards. `steps` = picks shown so far, `sizes` = {team: members}; unfinished teams show "?" for the missing slots (dashed card).
function renderTeams(steps,sizes,fresh,done,partial){
 const teams=$('teams');teams.textContent='';
 if(!steps.length)return;
 const card=(tm,mem,sz,wip,small,newest)=>{const c=document.createElement('div');c.className='team'+(small?' sm':'')+(wip?' wip':'')+(fresh&&!wip&&!small?' fresh':'');
  const h=document.createElement('h3');h.textContent='Team '+tm;c.append(h);
  mem.forEach((m,i)=>{const x=document.createElement('div');x.textContent=m;if(newest&&i===mem.length-1)x.className='new';c.append(x)});
  for(let k=mem.length;k<sz;k++){const x=document.createElement('div');x.className='empty';x.textContent='?';c.append(x)}
  return c};
 if(done){   // the end: every team, small cards stacked in the corner
  const order=[];for(const s of steps)if(!order.includes(s.team))order.push(s.team);
  for(const tm of order)teams.append(card(tm,steps.filter(s=>s.team===tm).map(s=>s.name),0,false,true,false));return}
 // while picking: ONE big card, the team of the latest pick; the newest name pops in
 const tm=steps[steps.length-1].team,mem=steps.filter(s=>s.team===tm).map(s=>s.name),sz=sizes&&sizes[tm]||mem.length;
 teams.append(card(tm,mem,sz,mem.length<sz,false,true));
}
function setTop(){
 $('title').textContent=w.status==='none'?'':((w.teamSize||2)+"'s Tournament");
 const lobby=!w.draw||!w.draw.steps||!w.draw.steps.length;
 $('label').textContent=(w.status==='open'||(w.status==='closed'&&lobby)||(w.status==='none'&&(w.names||[]).length))?'!me to join':'';
 if(w.practice&&w.status!=='none')$('label').textContent=($('label').textContent?$('label').textContent+'  ·  ':'')+'PRACTICE';
}
// ---- manual spin (default) ----
function paintManual(now){
 const m=w.manual,d=w.draw,pool=w.pool||[],wb=$('wheelbox'),pick=$('pick'),big=$('big'),fin=$('final'),wait=$('wait');
 if(d.id!==lastDraw){lastDraw=d.id;lastKey='';lastCount=-1;landedFor='';$('teams').textContent=''}
 const Rv=m.revealed,total=m.total,t=Math.max(0,now-m.spunAt),spinning=Rv>0&&t<m.spinMs,moving=Rv>0&&t<m.spinMs*SPINF,landed=Rv>0&&t>=m.spinMs*SPINF;
 const holding=Rv>0&&t>=m.spinMs&&t<m.spinMs+IDLE_DELAY;   // the wheel stays on the landed name for a moment before it starts to idle
 const cur=Rv>0?d.steps[Rv-1]:null,finished=(Rv>=total&&Rv>0&&!spinning)||(!!m.last&&!spinning);   // only one name left = it is assigned by itself, no extra spin
 const salt=d.id;
 let shown=pool;
 // the pool contains the pick being spun; once the spin is over the name leaves the wheel
 if(cur&&!spinning&&!holding){const i=pool.indexOf(cur.name);shown=pool.filter((x,j)=>j!==i)}
 if(finished){wb.classList.add('off')}else wb.classList.remove('off');
 big.textContent='';fin.textContent='';wait.textContent='';
 if(!finished){
  const order=orderOf(shown,salt);
  if(moving){
   const full=orderOf(pool,salt),p=planFor(full,cur.name,d.id+':'+Rv),ph=t/(m.spinMs*SPINF),rot=p.total*ease(Math.min(1,ph));
   const under=Math.floor((((-rot)%TAU)+TAU)%TAU/p.a),sk=Rv+':'+under;
   if(sk!==lastSlice){tick();kick=Math.min(1,kick+.7)}lastSlice=sk;
   idleSince=0;drawWheel(full,rot);pick.hidden=true;
  }else if(landed&&spinning){
   idleSince=0;const full=orderOf(pool,salt),p=planFor(full,cur.name,d.id+':'+Rv);drawWheel(full,p.total);
   if(landedFor!==d.id+':'+Rv){landedFor=d.id+':'+Rv;chime();pick.hidden=false;pick.textContent=pickText(d.steps,Rv,w.teamSizes);pick.style.animation='none';void pick.offsetWidth;pick.style.animation='';wb.classList.remove('landed');void wb.offsetWidth;wb.classList.add('landed')}
  }else if(holding){
   idleSince=0;pick.hidden=true;const full=orderOf(pool,salt),p=planFor(full,cur.name,d.id+':'+Rv);drawWheel(full,p.total);
  }else{
   pick.hidden=true;landedFor=d.id+':'+Rv;
   if(!idleSince)idleSince=performance.now();drawWheel(order,idleRot(performance.now()-idleSince));   // idle: the wheel turns slowly while it waits for the next spin
   big.textContent='';
  }
 }else{
  pick.hidden=true;
  fin.textContent=(w.teams||[]).map(x=>x.members.join(' & ')).join('  |  ');
  wait.textContent=(w.waitlist||[]).length?'Waitlist: '+w.waitlist.join(', '):'';
 }
 // cards: the pick joins its team once the wheel has landed on it
 // cards: ONE team at a time (the team of the latest pick: it builds up, shows complete, then the next team starts); at the end every team is listed
