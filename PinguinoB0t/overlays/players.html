<!doctype html>
<!--
  PinguinoBot — PLAYERS overlay (who is in the current game)
  OBS: Browser source -> tick "Local file" -> pick this file. Size 1920 x 1080.
  Reads live_state.js (written by PinguinoBotCore into this folder).
  Preview without the bot: open players.html?demo in a browser.

  Behaviour: when new teams are made it shows BIG in the middle for BIG_SECONDS,
  then shrinks to a slim bar at the top for the rest of the match.
  When a winner is recorded, the winning side glows and shows "WINNER".
  Titles say what is being played (Competitive Customs, Casual Customs, Fortnite Boxfights...). Casual customs in "group" style
  show ONE "IN-GAME" panel with everybody (no Blue / Orange). The QUEUE overlay (queue.html) stays hidden while this one is up.
-->
<html>
<head>
<meta charset="utf-8">
<title>Players Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --blue:#2f8cff; --blue2:#0c3b82; --orange:#ff8a1f; --orange2:#8a3a00; --text:#fff; --muted:rgba(255,255,255,.75); }
  html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:transparent;
               font-family:Rubik, Segoe UI, sans-serif; color:var(--text); }

  /* Big reveal: --big-x = horizontal centre, --big-scale = size (1 = full). Kept left of the facecam. */
  #stage { --big-x:730px; --big-scale:.7; position:absolute; left:var(--big-x); top:50%; transform:translate(-50%,-50%) scale(var(--big-scale));
           transition:left .8s cubic-bezier(.6,0,.2,1), top .8s cubic-bezier(.6,0,.2,1), transform .8s cubic-bezier(.6,0,.2,1), opacity .5s; opacity:0; }
  #stage.show { opacity:1; }
  /* Mini bar: teams sit on EITHER SIDE of the Rocket League scoreboard. --mini-gap = the hole left for the scoreboard (in unscaled px; x0.42 on screen). */
  #stage { --mini-gap:500px; }
  /* Same spot as always (62px), unless the roster is tall enough that the bar would be cut off at the top: setMini() then lowers it just enough (--mini-top). */
  #stage.mini { left:50%; top:var(--mini-top, 62px); transform:translate(-50%,-50%) scale(.42); }
  #stage.mini .header { opacity:0; max-height:0; margin:0; }
  #stage.mini .teams { gap:var(--mini-gap); }
  #stage.mini .team { width:var(--mini-team-w, 500px); }   /* slimmer boxes, same frame; names get the whole row and truncate with an ellipsis */
  #stage.mini .vs { opacity:0; width:0; overflow:hidden; }

  .header { text-align:center; margin-bottom:22px; max-height:200px; overflow:hidden; text-shadow:0 4px 12px rgba(0,0,0,.6); transition:opacity .4s, max-height .8s, margin .8s; }
  .header .sup { font-size:22px; letter-spacing:6px; font-weight:700; color:#bfe9ff; }
  .header .main { font-size:54px; font-weight:800; letter-spacing:3px; }

  .teams { display:flex; gap:40px; align-items:stretch; transition:gap .8s cubic-bezier(.6,0,.2,1); }
  .team { width:620px; box-sizing:border-box; border-radius:22px; padding:16px 26px 22px; position:relative;
          box-shadow:0 14px 40px rgba(0,0,0,.5); transition:box-shadow .5s, transform .5s, filter .5s, width .8s cubic-bezier(.6,0,.2,1); }
  .team.blue { background:linear-gradient(160deg, var(--blue), var(--blue2)); }
  .team.orange { background:linear-gradient(200deg, var(--orange), var(--orange2)); }

  /* One name at a time: the stream name and the Epic name crossfade (html.alt = showing the Epic name). Timing: ALT_SECONDS / FADE_MS below. */
  :root { --fade:.4s; }
  .nm { position:relative; flex:1 1 auto; min-width:0; display:block; overflow:hidden; white-space:nowrap; }
  .nm > span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; transition:opacity var(--fade) ease, transform var(--fade) ease; }
  .nm .n2 { position:absolute; left:0; right:0; top:0; opacity:0; transform:translateY(40%); }
  html.alt .nm:not(.one) .n1 { opacity:0; transform:translateY(-40%); }
  html.alt .nm .n2 { opacity:1; transform:none; }
  .team h2 { margin:0 0 6px; font-size:46px; font-weight:800; letter-spacing:4px; display:flex; justify-content:space-between; align-items:baseline; }  /* only the casual IN-GAME panel still has a heading */
  .team h2 span { font-size:22px; font-weight:500; color:var(--muted); letter-spacing:1px; }
  .player { display:flex; align-items:center; gap:14px; padding:14px 18px; margin-top:12px; border-radius:12px;
            background:rgba(0,0,0,.22); font-size:50px; font-weight:800; line-height:1.15; opacity:0; animation:pop .45s forwards; }
  /* Live edits (!in/!out/!kick/!move/fill/reroll): rows are keyed per player and diffed, never rebuilt. */
  .player.live { animation:none; opacity:1; }
  .player.enter { animation:slideIn .5s cubic-bezier(.2,.9,.3,1) forwards; }
  .player.leaving { animation:slideOut .4s ease-in forwards; pointer-events:none; }
  @keyframes slideIn { from { opacity:0; transform:translateX(-60px) scale(.94); } to { opacity:1; transform:none; } }
  @keyframes slideOut { from { opacity:1; transform:none; max-height:120px; } to { opacity:0; transform:translateX(70px) scale(.94); max-height:0; margin-top:0; padding-top:0; padding-bottom:0; } }
  @keyframes pop { from { opacity:0; transform:translateY(16px) scale(.96); } to { opacity:1; transform:none; } }

  .vs { align-self:center; width:90px; text-align:center; transition:opacity .3s, width .8s; font-size:64px; font-weight:800; text-shadow:0 4px 14px rgba(0,0,0,.6); }

  .teams[hidden] { display:none; }
  .team.group { width:1280px; background:linear-gradient(160deg, #3a2a08, #181a14); border:3px solid rgba(255,153,0,.6); }
  .team.group h2 { justify-content:center; gap:16px; color:#ff9900; }
  .gridp { display:grid; grid-template-columns:repeat(var(--cols,3), 1fr); gap:0 16px; }
  #stage.mini #groupWrap { gap:0; }
  .team.winner { box-shadow:inset 0 0 0 6px #ffe169, 0 0 50px 8px rgba(255,225,105,.7); }
  .team.loser { filter:grayscale(.7) brightness(.7); }
  /* Badge sits INSIDE the team box (in flow) so it is never cut off, whatever the layout or source size. */
  .crown { width:max-content; margin:0 auto 4px; background:#ffe169; color:#3a2a00;
           font-weight:800; font-size:28px; line-height:1; letter-spacing:3px; padding:8px 24px; border-radius:999px; display:none; }
  .team.winner .crown { display:block; animation:pop .5s; }
</style>
</head>
<body>
<div id="stage">
  <div class="header"><div class="sup" id="sup">INNOCENTPENGUIN COMMUNITY GAMES</div><div class="main" id="title">MATCH READY</div></div>
  <div class="teams" id="teams">
    <div class="team blue" id="blueTeam"><div class="crown">WINNER</div><div id="blue"></div></div>
    <div class="vs">VS</div>
    <div class="team orange" id="orangeTeam"><div class="crown">WINNER</div><div id="orange"></div></div>
  </div>
  <!-- Casual "group" style: one panel with everybody -->
  <div class="teams" id="groupWrap" hidden><div class="team group" id="groupTeam"><h2>IN-GAME <span id="groupFmt"></span></h2><div class="gridp" id="groupList"></div></div></div>
</div>

<script>
  // ── Settings ─────────────────────────────────────────────
  var BIG_SECONDS = 15;     // how long the big roster stays before shrinking (0 = never shrink)
  var SHOW_EPIC = true;     // include the Epic names (they alternate with the stream name)
  // Alternating names: one name per seat at full size, crossfading between the stream name and the Epic name.
  var ALT_SECONDS = 4;      // how long each name stays (0 = never alternate, stream name only)
  var FADE_MS = 400;        // crossfade time. Both can be overridden by ?alt=4&fade=400 or by LIVE_STATE.overlay {altSeconds, fadeMs} (Host JSON)
  function norm(s) { return String(s == null ? "" : s).toLowerCase().replace(/[^a-z0-9]/g, ""); }
  function nameHtml(p) {
    var u = f(p, "Username"), e = f(p, "Epic");
    if (!SHOW_EPIC || !e || !u || norm(e) === norm(u)) return '<span class="nm one"><span class="n1">' + esc(u || e) + '</span></span>';
    return '<span class="nm"><span class="n1">' + esc(u) + '</span><span class="n2">' + esc(e) + '</span></span>';
  }
  var altTimer = null, altKey = "";
  function applyAlt(s) {
    var o = (s && s.overlay) || {}, q = new URLSearchParams(location.search);
    var sec = q.has("alt") ? parseFloat(q.get("alt")) : (o.altSeconds != null ? o.altSeconds : ALT_SECONDS);
    var fade = q.has("fade") ? parseFloat(q.get("fade")) : (o.fadeMs != null ? o.fadeMs : FADE_MS);
    if (!(sec >= 0)) sec = ALT_SECONDS;
    if (!(fade >= 0)) fade = FADE_MS;
    document.documentElement.style.setProperty("--fade", (fade / 1000) + "s");
    if (altKey === sec + "|" + fade) return;
    altKey = sec + "|" + fade; clearInterval(altTimer); document.documentElement.classList.remove("alt");
    if (sec > 0) altTimer = setInterval(function () { document.documentElement.classList.toggle("alt"); }, sec * 1000);
  }

  var HIDE_AFTER_RESULT_SECONDS = 20; // hide this long after a winner is recorded (0 = keep showing)

  var ACT = { competitive:"COMPETITIVE CUSTOMS", casual:"CASUAL CUSTOMS", viewers:"PLAYING WITH VIEWERS",
              // ACTIVITY KEYS. RL (Rocket League): competitive, casual, koth, viewers | FN (Fortnite): boxfights, zonewars, fnviewers (the FN "viewers"). Overlay titles. Keep every copy of this list in sync: grep for "fnviewers".
              koth:"KING OF THE HILL", boxfights:"FORTNITE BOXFIGHTS", zonewars:"FORTNITE ZONE WARS", fnviewers:"FORTNITE: PLAYING WITH VIEWERS" };
  var MODE = { dropshot:"DROPSHOT", rumble:"RUMBLE" };
  var DEMO = location.search.indexOf("demo") >= 0;
  var lastTeamsKey = "", lastRosterKey = "", lastStatus = "", shrinkTimer = null, hideTimer = null;
  var stage = document.getElementById("stage");

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); }
  // The bot writes Username/Mmr/Epic; accept lowercase too in case that changes.
  function f(p, k) { return p[k] != null ? p[k] : p[k.charAt(0).toLowerCase() + k.slice(1)]; }

  function playersHtml(list) {
    return (list || []).map(function (p, i) {
      return '<div class="player" style="animation-delay:' + (0.15 + i * 0.12) + 's">' + nameHtml(p) + '</div>';
    }).join("");
  }


  // ── Keyed diff: same match, teams edited -> animate only what changed (no reveal, no flicker) ──
  function pkey(p) { return norm(f(p, "Username") || f(p, "Epic")); }
  function nameSig(p) { return (f(p, "Username") || "") + "|" + (f(p, "Epic") || ""); }
  function stageScale() { var w = stage.offsetWidth; return w ? stage.getBoundingClientRect().width / w : 1; }
  function syncRows(containers, lists) {
    var old = {}, firstRect = {}, k, i, c;
    containers.forEach(function (cn) { Array.prototype.forEach.call(cn.children, function (el) { if (el.dataset.key && !el.classList.contains("leaving")) { old[el.dataset.key] = el; firstRect[el.dataset.key] = el.getBoundingClientRect(); } }); });
    var want = {};
    lists.forEach(function (l) { (l || []).forEach(function (p) { want[pkey(p)] = true; }); });
    Object.keys(old).forEach(function (key) {            // leavers: slide/fade out, then remove
      if (want[key]) return;
      var el = old[key]; delete old[key]; el.classList.remove("enter", "live"); el.classList.add("leaving");
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 450);
    });
    var moved = [];
    lists.forEach(function (l, ci) {
      var cn = containers[ci], prev = null;
      (l || []).forEach(function (p) {
        var key = pkey(p), el = old[key], fresh = !el;
        if (fresh) { el = document.createElement("div"); el.className = "player enter"; el.dataset.key = key; el.dataset.sig = nameSig(p); el.innerHTML = nameHtml(p); old[key] = el; }
        else if (el.dataset.sig !== nameSig(p)) { el.dataset.sig = nameSig(p); el.innerHTML = nameHtml(p); }
        if (!fresh && !el.classList.contains("enter")) el.classList.add("live");
        var anchor = prev ? prev.nextSibling : cn.firstChild;
        while (anchor && anchor.classList && anchor.classList.contains("leaving") && anchor !== el) anchor = anchor.nextSibling;
        if (el.parentNode !== cn || el.previousElementSibling !== prev) cn.insertBefore(el, prev ? prev.nextSibling : cn.firstChild);
        if (!fresh) moved.push(key);
        prev = el;
      });
    });
    var sc = stageScale();                                // FLIP: slide survivors from where they were to where they are (swaps cross columns)
    moved.forEach(function (key) {
      var el = old[key], a = firstRect[key], b = el.getBoundingClientRect();
      if (!a) return;
      var dx = (a.left - b.left) / sc, dy = (a.top - b.top) / sc;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      el.animate([{ transform: "translate(" + dx + "px," + dy + "px)" }, { transform: "none" }], { duration: 500, easing: "cubic-bezier(.2,.8,.2,1)" });
    });
  }
  function seatRows(list) {            // initial reveal rows carry a key too, so the first edit can diff against them
    return (list || []).map(function (p, i) {
      return '<div class="player" data-key="' + esc(pkey(p)) + '" data-sig="' + esc(nameSig(p)) + '" style="animation-delay:' + (0.15 + i * 0.12) + 's">' + nameHtml(p) + '</div>';
    }).join("");
  }

  // Shrink to the slim bar: place it so its TOP edge sits 12px below the top of the screen whatever the roster height is.
  function setMini() {
    stage.classList.add("mini");
    var box = document.getElementById("groupWrap").hidden ? document.getElementById("teams") : document.getElementById("groupWrap");   // the header collapses, so measure the teams
    stage.style.setProperty("--mini-top", Math.max(62, 6 + box.offsetHeight * 0.21) + "px");
  }

  function render(s) {
    applyAlt(s);
    var m = s && s.currentMatch;
    if (!m) { stage.classList.remove("show"); lastTeamsKey = ""; lastRosterKey = ""; return; }

    var teamsKey = JSON.stringify([m.id, m.group, s.activity]), rosterKey = JSON.stringify([m.blue, m.orange, m.format]);
    if (teamsKey === lastTeamsKey && rosterKey !== lastRosterKey) {
      // Same match, roster edited (in/out/kick/move/fill/swap/reroll/balance): diff in place.
      lastRosterKey = rosterKey;
      var fnl = s.game === "fortnite", mb = !fnl && MODE[s.gameMode] ? " • " + MODE[s.gameMode] : "";
      document.getElementById("title").textContent = (m.finished || m.status === "finished" ? document.getElementById("title").textContent : (m.format || "") + mb + " • MATCH #" + m.id);
      if (m.group) syncRows([document.getElementById("groupList")], [(m.blue || []).concat(m.orange || [])]);
      else syncRows([document.getElementById("blue"), document.getElementById("orange")], [m.blue, m.orange]);
      if (stage.classList.contains("mini")) setMini();
      lastStatus = m.status;
      return;
    }
    if (teamsKey !== lastTeamsKey) {
      lastRosterKey = rosterKey;
      // New match or reroll: big reveal
      lastTeamsKey = teamsKey;
      lastStatus = "";
      clearTimeout(shrinkTimer); clearTimeout(hideTimer);
      var fn = s.game === "fortnite";
      var modeBit = !fn && MODE[s.gameMode] ? " • " + MODE[s.gameMode] : "";
      document.getElementById("sup").textContent = ACT[s.activity] || "INNOCENTPENGUIN COMMUNITY GAMES";
      document.getElementById("title").textContent = (m.format || "") + modeBit + " • MATCH #" + m.id;
      var group = !!m.group;   // casual group style: everybody in ONE panel, no teams
      document.getElementById("teams").hidden = group;
      document.getElementById("groupWrap").hidden = !group;
      if (group) {
        var all = (m.blue || []).concat(m.orange || []);
        var size = { "1v1":1, "2v2":2, "3v3":3, "4v4":4 }[m.format] || 3;
        document.getElementById("groupList").style.setProperty("--cols", size);
        document.getElementById("groupList").innerHTML = seatRows(all);
        document.getElementById("groupFmt").textContent = m.format || "";
      }
      document.getElementById("blue").innerHTML = seatRows(m.blue);
      document.getElementById("orange").innerHTML = seatRows(m.orange);
      setWinner(null);
      stage.classList.remove("mini");
      stage.classList.add("show");
      if (BIG_SECONDS > 0) shrinkTimer = setTimeout(setMini, BIG_SECONDS * 1000);
    }

    if (m.status === "finished" && lastStatus !== "finished" && !m.group) {
      // Winner just recorded: come back big and celebrate
      var win = m.winner || (s.lastEvent && s.lastEvent.Type === "match_result" ? s.lastEvent.Detail : guessWinner(s));
      setWinner(win);
      document.getElementById("title").textContent = win ? win.toUpperCase() + " WINS!" : "MATCH OVER";
      stage.classList.remove("mini");
      stage.classList.add("show");
      clearTimeout(shrinkTimer);
      if (HIDE_AFTER_RESULT_SECONDS > 0)
        hideTimer = setTimeout(function () { stage.classList.remove("show"); }, HIDE_AFTER_RESULT_SECONDS * 1000);
    }
    lastStatus = m.status;
  }

  function guessWinner(s) {
    var ev = (s.recentEvents || []).filter(function (e) { return e.Type === "match_result"; }).pop();
    return ev ? ev.Detail : null;
  }

  function setWinner(team) {
    var b = document.getElementById("blueTeam"), o = document.getElementById("orangeTeam");
    b.classList.toggle("winner", team === "blue"); b.classList.toggle("loser", team === "orange");
    o.classList.toggle("winner", team === "orange"); o.classList.toggle("loser", team === "blue");
  }

  function poll() {
    var old = document.getElementById("state");
    if (old) old.remove();
    var sc = document.createElement("script");
    sc.id = "state";
    sc.src = "live_state.js?t=" + Date.now();
    sc.onload = function () { render(window.LIVE_STATE); };
    document.body.appendChild(sc);
  }

  if (DEMO) {
    // ?demo  3v3 | ?demo&n=1|2|3  team size | &mini  start in the slim top bar | the 2nd/3rd seats show the odd cases (same name / very long name)
    var q = new URLSearchParams(location.search), n = parseInt(q.get("n") || "3", 10) || 3;
    var bl = [{Username:"penguinfan",Epic:"Penguin Fan"},{Username:"xx",Epic:"xx"},{Username:"youtube-tankjakvcgic4947",Epic:"tankjakvcgic4947_epicname"}];
    var og = [{Username:"flipreset",Epic:"FlipReset99"},{Username:"innocentpenguin_",Epic:"InnocentPenguin"},{Username:"boostgoblin"}];
    var demo = { currentMatch: { id:7, format:n + "v" + n, status:"live", blueAvg:1120, orangeAvg:1105, blue:bl.slice(0, n), orange:og.slice(0, n) } };
    render(demo);
    if (q.has("mini")) { clearTimeout(shrinkTimer); setMini(); }
    else setTimeout(function () { demo.currentMatch.status = "finished"; demo.lastEvent = { Type:"match_result", Detail:"orange" }; render(demo); }, 6000);   // winner after 6s
  } else {
    poll();
    setInterval(poll, 400);
  }
</script>
<script src="overlay-options.js"></script>
</body>
</html>
