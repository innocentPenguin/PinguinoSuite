<!doctype html>
<!--
  PinguinoB0t — QUEUE overlay (OBS Browser Source), same look as the queue on innocentpenguin.com
  OBS: Browser source -> tick "Local file" -> pick this file. Size 420 x 760.
  Reads live_state.js (written by PinguinoBotCore into this folder).
  Preview without the bot: open queue.html?demo in a browser.

  WHEN IT SHOWS: it pops up for POP_SECONDS only when someone JOINS the queue or someone types !queue (the bot sends a
  "queue_show" event for !queue / !queue list). Every new join restarts the timer. It never shows while the PLAYERS overlay
  (players.html: the teams / in-game players) is on screen, so the two are never up at the same time: it stays away while a
  match is running and for AFTER_RESULT_SECONDS after a result (same number as players.html, HIDE_AFTER_RESULT_SECONDS).

  IDLE MODE: when nobody is in the queue and no match is running for idleSeconds, the card turns into rotating LEADERBOARD cards (same
  frame, orange glow running round the border) and switches back to the live queue the moment someone joins or a game starts.
  The cards come from the Host (GET /api/queue-idle?js=1, built from the public boards: no bots, no !optmeout viewers). Settings live in
  Data\runtime\queue_idle.json (enabled, idleSeconds, secondsPerCard, top, sequence: cards or chains of similar boards that flow into
  each other; the overlay shuffles the items like a bag so the order changes every round). Preview in a browser: queue.html?preview=1
  forces idle mode (add &mock for built-in sample boards when the Host is not running; &mock=few / &mock=empty for a short / an empty Subs list).
  "Subs!" card (first in every round): ONE list, Tier 1 (not gifted) then Tier 2 then Tier 3, months subscribed + watch time. The frame and the rows
  change with the section on screen: T1 orange (the normal look), T2 GOLD shimmer, T3 DIAMOND (icy shimmer + sparkle). A list longer than visibleRows
  scrolls by itself (scrollSpeed px/s, scrollPauseSeconds at the top and the end) and the card stays until everybody was shown. All in queue_idle.json.

  TITLE: says what is being played (Competitive Customs, Casual Customs, Playing with Viewers, Fortnite Boxfights, Fortnite
  Zone Wars...) plus the team size and game mode. Ratings show as MMR (Rocket League) or SR (Fortnite) in grey.
-->
<html>
<head>
<meta charset="utf-8">
<title>Queue Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --orange:#ff9900; --panel:rgba(20,22,17,.94); --line:#36382f; --gold:#ffd166; --tan:#d2b48c; --text:#f5f2eb; --muted:#a9aaa1; --open:#3ee07a; --closed:#ff5a5a; }
  html, body { margin:0; background:transparent; font-family:Rubik, Segoe UI, sans-serif; color:var(--text); }
  .card { width:380px; margin:20px; padding:18px 18px 14px; background:var(--panel); border:1px solid var(--line); border-radius:18px;
          box-shadow:0 10px 30px rgba(0,0,0,.5); transition:opacity .45s, transform .45s; }
  .card.hidden { opacity:0; transform:translateY(-14px); }
  .head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .act { font-size:22px; font-weight:800; letter-spacing:.5px; line-height:1.15; text-transform:uppercase; color:#fff; }
  .sub { margin-top:3px; font-size:14px; color:var(--muted); font-weight:500; letter-spacing:1px; }
  .sub b { color:var(--orange); }
  .badge { flex:none; font-weight:800; font-size:13px; padding:5px 12px; border-radius:999px; letter-spacing:1px; }
  .badge.open { background:var(--open); color:#062312; animation:pulse 2s infinite; }
  .badge.closed { background:var(--closed); color:#2a0606; }
  @keyframes pulse { 50% { box-shadow:0 0 0 8px rgba(62,224,122,0); } 0% { box-shadow:0 0 0 0 rgba(62,224,122,.6); } }
  .meta { margin:10px 0 6px; color:var(--muted); font-size:14px; }
  .meta b { color:var(--orange); }
  ol { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:10px; padding:9px 11px; margin:6px 0; border-radius:12px; border:1px solid var(--line);
       background:#1c1e18; font-size:19px; font-weight:700; animation:slide .35s ease-out; }
  li.next { border-color:rgba(255,209,102,.7); background:linear-gradient(90deg, rgba(255,209,102,.18), rgba(255,209,102,.05)); }
  li.backup { border-color:rgba(210,180,140,.6); background:rgba(210,180,140,.1); }
  li.streamer { border-color:rgba(233,25,22,.75); }
  @keyframes slide { from { opacity:0; transform:translateX(-20px); } }
  .pos { color:var(--orange); font-weight:800; font-size:16px; min-width:30px; }
  .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .rating { color:#8b8d82; font-size:14px; font-weight:600; flex:none; }
  .epic { color:var(--muted); font-weight:500; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .epic::before { content:"| "; color:#6d6f63; }
  .tag { margin-left:auto; flex:none; font-size:11px; font-weight:800; letter-spacing:1px; padding:3px 8px; border-radius:6px; }
  .tag.next { background:var(--gold); color:#3a2a00; } .tag.backup { background:var(--tan); color:#3a2a00; } .tag.you { background:#e91916; color:#fff; }
  .empty { padding:14px 4px 10px; color:var(--muted); font-size:17px; }
  .more { padding:2px 4px 6px; color:var(--muted); font-size:14px; }
  .foot { margin-top:8px; font-size:13px; color:var(--muted); line-height:1.4; }
  .foot b { color:var(--text); }
  /* ---- idle mode: leaderboard cards with an orange glow chasing round the frame (CEF-safe: one rotating gradient, no filters) ---- */
  .glow { position:relative; width:386px; margin:20px; padding:3px; box-sizing:border-box; border-radius:21px; overflow:hidden; background:#36382f;
          box-shadow:0 0 22px rgba(255,140,0,.38), 0 10px 30px rgba(0,0,0,.5); transition:opacity .45s, transform .45s; }
  .glow.hidden { opacity:0; transform:translateY(-14px); pointer-events:none; }
  .glow .spin { position:absolute; left:50%; top:50%; width:1500px; height:1500px; margin:-750px 0 0 -750px; animation:chase 5s linear infinite;
                background:conic-gradient(from 0deg, rgba(255,153,0,0) 0%, rgba(255,153,0,0) 52%, #ff6a00 72%, #ffb347 86%, #ffd166 92%, rgba(255,153,0,0) 100%); }
  @keyframes chase { to { transform:rotate(360deg); } }
  .glow .card { position:relative; margin:0; width:auto; box-shadow:none; border-radius:16px; border-color:#2a2c24; min-height:320px; }
  .ibody.out { opacity:0; transform:translateY(-8px); transition:opacity .3s, transform .3s; }
  .ibody.out.lk { transform:translateX(-26px); }
  .ibody.in { animation:fadeIn .45s ease-out; } .ibody.in.lk { animation:slideIn .45s ease-out; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } } @keyframes slideIn { from { opacity:0; transform:translateX(26px); } }
  .glow li.first { border-color:rgba(255,209,102,.7); background:linear-gradient(90deg, rgba(255,209,102,.18), rgba(255,209,102,.05)); }
  .glow .val { margin-left:auto; flex:none; color:var(--orange); font-weight:800; font-size:17px; }
  .glow .act { font-size:21px; } .glow .sub b { letter-spacing:1.5px; }
  /* ---- "Subs!" card: scrolling viewport, tier rows, gold + diamond frames ---- */
  .vp { position:relative; overflow:hidden; }
  .vp.scrolling { -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%); mask-image:linear-gradient(to bottom, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%); }
  #ilist { will-change:transform; }
  .glow .spin.s2, .glow .spin.s3 { opacity:0; }
  .glow .spin { transition:opacity .7s; }
  .glow .spin.s2 { background:conic-gradient(from 0deg, rgba(255,200,40,0) 0%, #b8860b 12%, #ffd34d 22%, #fff3b0 28%, #ffd34d 34%, rgba(255,200,40,0) 48%, rgba(255,200,40,0) 52%, #b8860b 62%, #ffd34d 72%, #fff3b0 78%, #ffc400 84%, rgba(255,200,40,0) 100%); }
  .glow .spin.s3 { background:conic-gradient(from 0deg, rgba(150,225,255,0) 0%, #7fd8ff 10%, #ffffff 18%, #b3e9ff 26%, #8aa4ff 34%, rgba(150,225,255,0) 46%, rgba(150,225,255,0) 52%, #9fe3ff 60%, #ffffff 68%, #c9f2ff 76%, #7fb5ff 86%, rgba(150,225,255,0) 100%); }
  .glow.t2 .spin.s1, .glow.t3 .spin.s1 { opacity:0; } .glow.t2 .spin.s2 { opacity:1; } .glow.t3 .spin.s3 { opacity:1; }
  .glow { transition:opacity .45s, transform .45s, box-shadow .7s; }
  .glow.t2 { box-shadow:0 0 26px rgba(255,196,0,.5), 0 10px 30px rgba(0,0,0,.5); }
  .glow.t3 { box-shadow:0 0 28px rgba(140,220,255,.55), 0 10px 30px rgba(0,0,0,.5); }
  .glow.t2 .sub b { color:#ffd34d; } .glow.t3 .sub b { color:#bff0ff; }
  .glow li.t1 .val { color:var(--orange); }
  .glow li.ann { box-shadow:0 0 0 2px rgba(255,255,255,.55), 0 0 14px rgba(255,255,255,.45); animation:annpulse 1.6s ease-in-out infinite; }
  .glow li .yr { flex:none; font-size:11px; font-weight:800; letter-spacing:1px; padding:2px 7px; border-radius:6px; background:#fff; color:#3a2a00; }
  @keyframes annpulse { 50% { box-shadow:0 0 0 2px rgba(255,255,255,.15), 0 0 4px rgba(255,255,255,.1); } }
  .glow li.hd { padding:3px 11px; font-size:12px; letter-spacing:2.5px; font-weight:800; background:none; animation:none; border-width:0 0 1px 0; border-radius:0; margin:10px 0 4px; }
  .glow li.hd.t2 { color:#ffd34d; border-color:rgba(255,205,70,.6); } .glow li.hd.t3 { color:#bff0ff; border-color:rgba(175,235,255,.8); text-shadow:0 0 8px rgba(160,225,255,.6); }
  .glow li.t2, .glow li.t3 { position:relative; overflow:hidden; }
  .glow li.t2 { border-color:rgba(255,205,70,.85); background:linear-gradient(100deg, rgba(255,196,0,.24), rgba(255,150,0,.07)); }
  .glow li.t2 .pos, .glow li.t2 .name, .glow li.t2 .val { color:#ffd34d; }
  .glow li.t3 { border-color:rgba(175,235,255,.95); background:linear-gradient(100deg, rgba(190,240,255,.22), rgba(120,170,255,.10) 55%, rgba(255,255,255,.18)); }
  .glow li.t3 .pos, .glow li.t3 .val { color:#9fe3ff; } .glow li.t3 .name { color:#effcff; text-shadow:0 0 8px rgba(160,225,255,.7); }
  .glow li.t2::after, .glow li.t3::after { content:""; position:absolute; top:0; bottom:0; left:-60%; width:45%; pointer-events:none; transform:skewX(-20deg); animation:shine 3.2s linear infinite;
        background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,244,190,.34), rgba(255,255,255,0)); }
  .glow li.t3::after { background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.5), rgba(190,235,255,0)); animation-duration:2.4s; }
  .glow li.t3::before { content:"\2726"; position:absolute; right:7px; top:3px; font-size:12px; color:#fff; text-shadow:0 0 6px #aee8ff; animation:twinkle 1.8s ease-in-out infinite; }
  .glow li.t3:nth-child(2n)::before { animation-delay:.6s; right:46%; } .glow li.t3:nth-child(3n)::before { animation-delay:1.1s; right:22%; top:auto; bottom:3px; }
  @keyframes shine { to { left:130%; } } @keyframes twinkle { 0%,100% { opacity:0; transform:scale(.5); } 50% { opacity:1; transform:scale(1.15); } }
</style>
</head>
<body>
<div class="card hidden" id="card">
  <div class="head">
    <div><div class="act" id="act">CUSTOMS</div><div class="sub" id="sub">QUEUE</div></div>
    <div class="badge closed" id="badge">CLOSED</div>
  </div>
  <div class="meta"><span>Waiting <b id="count">0</b></span> · <span id="spots"></span></div>
  <ol id="list"></ol>
  <div class="more" id="more"></div>
  <div class="foot" id="foot">Type <b>!register</b> then <b>!join</b> in chat</div>
</div>

<div class="glow hidden" id="idle">
  <div class="spin s1 spin1"></div><div class="spin s2"></div><div class="spin s3"></div>
  <div class="card">
    <div class="ibody in" id="ibody">
      <div class="head"><div><div class="act" id="itop">LEADERBOARD</div><div class="sub" id="isub"><b></b></div></div></div>
      <div class="vp" id="ivp"><ol id="ilist"></ol></div>
      <div class="foot" id="ifoot">Leaderboards &middot; innocentpenguin.com</div>
    </div>
  </div>
</div>

<script>
  // ── Settings ─────────────────────────────────────────────
  var MAX_ROWS = 10;                 // rows shown before "+N more"
  var POP_SECONDS = 12;              // how long the card stays after a join or !queue
  var AFTER_RESULT_SECONDS = 20;     // stay away this long after a result (the players overlay is still up): same as players.html
  var STREAMER = "innocentpenguin_"; // the streamer's row is marked and not counted in the gold "next up"

  var DEMO = location.search.indexOf("demo") >= 0;
  var lastKey = "", lastSeq = null, visibleUntil = 0, finishedAt = 0, lastMatchKey = "", lastState = null;

  var ACT = { competitive:"Competitive Customs", casual:"Casual Customs", viewers:"Playing with Viewers",
              // ACTIVITY KEYS. RL (Rocket League): competitive, casual, koth, viewers | FN (Fortnite): boxfights, zonewars, fnviewers (the FN "viewers"). Overlay titles. Keep every copy of this list in sync: grep for "fnviewers".
              koth:"King of the Hill", boxfights:"Fortnite Boxfights", zonewars:"Fortnite Zone Wars", fnviewers:"Fortnite: Playing with Viewers" };
  var MODE = { dropshot:"Dropshot", rumble:"Rumble" };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); }

  // Is the players overlay (teams / in-game group) on screen? During a match, and for a while after the result.
  function playersActive(s) {
    var m = s && s.currentMatch;
    if (!m) { finishedAt = 0; lastMatchKey = ""; return false; }
    if (m.status !== "finished") { finishedAt = 0; return true; }
    if (!finishedAt) finishedAt = Date.now();
    return Date.now() - finishedAt < AFTER_RESULT_SECONDS * 1000;
  }

  // New joins and !queue (event "queue_show") make the card pop up.
  function watchEvents(s) {
    var evs = s.recentEvents || [], max = evs.length ? evs[evs.length - 1].Seq : 0;
    if (lastSeq === null) { lastSeq = max; return; }   // first load: don't pop for old events
    evs.forEach(function (e) {
      if (e.Seq <= lastSeq) return;
      if (e.Type === "queue_show" || (e.Type === "queue_update" && /joined/.test(String(e.Detail || ""))))
        visibleUntil = Date.now() + POP_SECONDS * 1000;
    });
    if (max > lastSeq) lastSeq = max;
  }

  function draw(s) {
    var q = s.queue || [];
    var key = JSON.stringify([s.queueOpen, s.format, s.queue, s.spotsNeeded, s.activity, s.gameMode, s.casualStyle, s.game, s.streamerPlaying]);
    if (key === lastKey) return;   // only redraw on change, so animations don't replay
    lastKey = key;

    var fn = s.game === "fortnite", size = { "1v1":1, "2v2":2, "3v3":3, "4v4":4 }[s.format] || 3;
    var seats = size * 2, gold = seats - (s.streamerPlaying !== false ? 1 : 0);
    var act = ACT[s.activity] || "Customs queue";
    var bits = [s.format || ""];
    if (!fn && MODE[s.gameMode]) bits.push(MODE[s.gameMode]);
    if (s.activity === "casual") bits.push(s.casualStyle === "teams" ? "Random teams" : "Groups");
    document.getElementById("act").textContent = act;
    document.getElementById("sub").innerHTML = "QUEUE · <b>" + bits.filter(Boolean).map(esc).join(" · ") + "</b>";
    document.getElementById("badge").className = "badge " + (s.queueOpen ? "open" : "closed");
    document.getElementById("badge").textContent = s.queueOpen ? "OPEN" : "CLOSED";
    document.getElementById("count").textContent = q.length;
    document.getElementById("spots").innerHTML = s.spotsNeeded > 0 ? "Need <b>" + s.spotsNeeded + "</b> more" : "<b>Ready!</b>";

    var n = 0;
    var html = q.slice(0, MAX_ROWS).map(function (e) {
      var isStreamer = String(e.user || "").toLowerCase() === STREAMER, cls = "", tag = "";
      if (!isStreamer) { n++; cls = n <= gold ? "next" : n <= gold + 2 ? "backup" : ""; }
      else cls = "streamer";
      if (cls === "next") tag = '<span class="tag next">NEXT</span>'; else if (cls === "backup") tag = '<span class="tag backup">BACKUP</span>';
      else if (isStreamer) tag = '<span class="tag you">STREAMER</span>';
      return '<li class="' + cls + '"><span class="pos">#' + e.pos + '</span><span class="name">' + esc(e.user) + '</span>' +
             (e.mmr != null ? '<span class="rating" title="' + (fn ? "SR" : "MMR") + '">' + e.mmr + '</span>' : '') +
             (e.epic ? '<span class="epic">' + esc(e.epic) + '</span>' : '') + tag + '</li>';
    }).join("");
    document.getElementById("list").innerHTML = html || '<div class="empty">Nobody yet — be first!</div>';
    document.getElementById("more").textContent = q.length > MAX_ROWS ? "+" + (q.length - MAX_ROWS) + " more in line" : "";
    document.getElementById("foot").innerHTML = "Gold = next " + gold + " up" + (s.streamerPlaying !== false ? " + InnocentPenguin" : "") + " · Tan = 2 backups<br>Type <b>!register</b> then <b>!join</b> in chat";
  }

  // ── Idle mode: rotating leaderboard cards ─────────────────
  var PREVIEW = /[?&]preview/.test(location.search), MOCK = /[?&]mock/.test(location.search);
  var HOST = /[?&]host=([^&]+)/.test(location.search) ? decodeURIComponent(RegExp.$1) : (location.protocol.indexOf("http") === 0 ? location.origin : "http://127.0.0.1:8770");
  var rafId = 0, idleCfg = null, idleSince = Date.now(), idleOn = false, bag = [], chain = null, chainPos = 0, lastChainId = "", cardTimer = 0, idleFetchedAt = 0, fetching = false;

  function mockIdle() {
    function rows(a) { var n = ["frostbyte","snowdrift","icecube","glacier","polarbear","rlwizard","tundra","slushy"]; return n.map(function (x, i) { return { rank:i + 1, name:x, value:Math.round(a / (i + 1)) }; }); }
    function card(m, p, t, u, a) { return { id:m + "|" + p, metric:m, period:p, title:t, unit:u, rows:rows(a) }; }
    var kind = /[?&]mock=(\w+)/.test(location.search) ? RegExp.$1 : "";
    var subs = { id:"subs|all", metric:"subs", period:"all", title:"Subs! \u00b7 by months", unit:"months", kind:"subs", first:true, tiers:[], rows:[], layout:(/[?&]layout=sprinkled/.test(location.search) ? "sprinkled" : "separated") };
    var t1 = kind === "few" ? 3 : 44, t2 = kind === "few" ? 1 : 6, t3 = kind === "few" ? 1 : 4, k = 0;
    if (kind !== "empty") [[1, t1], [2, t2], [3, t3]].forEach(function (q) {
      for (var i = 0; i < q[1]; i++) { k++; subs.rows.push({ rank:k, tier:q[0], name:(q[0] === 3 ? "DiamondDiva" : q[0] === 2 ? "GoldGoose" : "SnowViewer") + k, value:Math.max(1, 60 - k), anniv:(k === 2 ? 2 : 0), extra:Math.max(30, 9000 - k * 150) }); }
      if (q[1]) subs.tiers.push(q[0]);
    });
    return { ok:true, enabled:true, idleSeconds:10, secondsPerCard:5, visibleRows:8, scrollSpeed:45, scrollPauseSeconds:2.5, items:[
      [subs],
      [card("gifts","month","TOP GIFTERS \u00b7 THIS MONTH","subs",40), card("bits","month","TOP CHEERERS \u00b7 THIS MONTH","bits",9000)],
      [card("gifts","month","TOP GIFTERS \u00b7 THIS MONTH","subs",40), card("gifts","all","TOP GIFTERS \u00b7 ALL TIME","subs",400)],
      [card("watchtime","month","MOST WATCH TIME \u00b7 THIS MONTH","time",3000), card("watchtime","all","MOST WATCH TIME \u00b7 ALL TIME","time",90000)],
      [card("points","all","TOP POINTS \u00b7 ALL TIME","pts",250000)] ] };
  }
  // cards without a single row are skipped here as well (the Host already drops them): an empty "Subs!" list never shows
  function clean(cfg) {
    if (!cfg) return cfg;
    cfg.items = (cfg.items || []).map(function (ch) { return ch.filter(function (c) { return c && c.rows && c.rows.length; }); }).filter(function (ch) { return ch.length; });
    return cfg;
  }
  function loadIdle() {
    if (MOCK) { idleCfg = clean(mockIdle()); idleFetchedAt = Date.now(); return; }
    if (fetching) return; fetching = true;
    var sc = document.createElement("script");
    sc.src = HOST + "/api/queue-idle?js=1&t=" + Date.now();
    sc.onload = function () { fetching = false; idleFetchedAt = Date.now(); if (window.QUEUE_IDLE && window.QUEUE_IDLE.ok) idleCfg = clean(window.QUEUE_IDLE); sc.remove(); };
    sc.onerror = function () { fetching = false; idleFetchedAt = Date.now() - 45000; sc.remove(); };   // Host not reachable: try again in ~15 s
    document.body.appendChild(sc);
  }
  function fmtTime(min) { min = Math.round(min); var h = Math.floor(min / 60); return h >= 1 ? h + "h " + (min % 60) + "m" : min + "m"; }
  function fmtVal(r, u) {
    var v = Number(r.value) || 0;
    if (u === "time") return fmtTime(v);
    if (u === "level") return "Lv " + v;
    if (u === "months") return v + " mo";
    return v.toLocaleString("en-US") + (u ? " " + u : "");
  }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function nextCard() {
    var items = (idleCfg && idleCfg.items) || [];
    if (chain && chainPos < chain.length) return { card:chain[chainPos++], linked:true };
    if (!items.length) return null;
    if (!bag.length) {
      bag = shuffle(items.slice());
      bag.sort(function (x, y) { return (x[0].first ? 1 : 0) - (y[0].first ? 1 : 0); });   // pop() takes from the end: a "first" chain (Subs!) always opens the round
      if (bag.length > 1 && !bag[bag.length - 1][0].first && bag[bag.length - 1][0].id === lastChainId) { var t = bag[0]; bag[0] = bag[bag.length - 1]; bag[bag.length - 1] = t; }   // never open a new round with the chain that just played
    }
    chain = bag.pop(); chainPos = 1; lastChainId = chain[0].id;
    return { card:chain[0], linked:false };
  }
  function setTier(t) { var g = document.getElementById("idle"); g.classList.remove("t1", "t2", "t3"); if (t) g.classList.add("t" + t); }
  function stopScroll() { if (rafId) clearTimeout(rafId); rafId = 0; }
  // Starts the motion of the card on screen and returns how long it stays (ms). Plain boards: secondsPerCard. "Subs!": the frame colour follows the tier in view;
  // a list taller than visibleRows scrolls at a constant speed (pause at the top, pause at the end) and the card stays until the last name was shown.
  function startCard(c) {
    stopScroll();
    var vp = document.getElementById("ivp"), ol = document.getElementById("ilist"), rows = ol.children, cfg = idleCfg || {};
    var base = Math.max(3, cfg.secondsPerCard || 8) * 1000;
    vp.style.height = ""; vp.classList.remove("scrolling"); ol.style.transform = "";
    if (c.kind !== "subs" || !rows.length) { setTier(0); return base; }
    var follow = c.layout !== "sprinkled";   // sprinkled: T2/T3 names sit between T1 names, the frame stays orange and only the rows carry gold / diamond
    var vis = Math.max(3, cfg.visibleRows || 8), speed = Math.max(10, cfg.scrollSpeed || 45), pause = Math.max(0.5, cfg.scrollPauseSeconds || 2.5) * 1000;
    var n = rows.length, last = rows[n - 1], vpH = n > vis ? rows[vis].offsetTop - 6 : last.offsetTop + last.offsetHeight + 6;
    var D = last.offsetTop + last.offsetHeight + 6 - vpH, scrolling = D > 2, tiers = (c.tiers && c.tiers.length) ? c.tiers : [Number(rows[0].getAttribute("data-t")) || 1];
    var moveMs = scrolling ? D / speed * 1000 : 0, dur = Math.max(base, scrolling ? pause + moveMs + pause : tiers.length * 3500);
    if (n > vis) vp.style.height = vpH + "px";
    if (scrolling) vp.classList.add("scrolling");
    var t0 = performance.now();
    function tierAt(y, p) {
      var focus = y + vpH * (0.15 + 0.85 * p), t = Number(rows[0].getAttribute("data-t")) || 1;
      for (var i = 0; i < n; i++) { if (rows[i].offsetTop <= focus) t = Number(rows[i].getAttribute("data-t")) || t; else break; }
      return t;
    }
    function tick(now) {
      var e = now - t0, y = 0, p = 0, t;
      if (scrolling) { p = Math.min(1, Math.max(0, (e - pause) / moveMs)); y = p * D; ol.style.transform = "translate3d(0," + (-y).toFixed(2) + "px,0)"; t = tierAt(y, p); }
      else { t = tiers[Math.min(tiers.length - 1, Math.floor(e / dur * tiers.length))]; }
      setTier(follow ? t : 0);
      if (e < dur) rafId = setTimeout(function () { tick(performance.now()); }, 33); else rafId = 0;   // ~30 fps timer: also keeps running when the page is throttled
    }
    rafId = setTimeout(function () { tick(performance.now()); }, 33);
    return dur;
  }
  function paintCard(c, linked, instant) {
    var body = document.getElementById("ibody");
    function fill() {
      if (!idleOn) return;
      var parts = String(c.title || "").split(" \u00b7 "), subs = c.kind === "subs";
      document.getElementById("itop").textContent = parts[0] || "LEADERBOARD";
      document.getElementById("isub").innerHTML = "<b>" + esc(parts[1] || "") + "</b>";
      var prevT = 0, sep = subs && c.layout !== "sprinkled";
      document.getElementById("ilist").innerHTML = (c.rows || []).slice(0, subs ? 300 : 10).map(function (r, i) {
        var hd = "";
        if (sep && r.tier > 1 && r.tier !== prevT) hd = '<li class="hd t' + esc(r.tier) + '" data-t="' + esc(r.tier) + '">TIER ' + esc(r.tier) + '</li>';
        prevT = r.tier;
        if (subs) return hd + '<li class="t' + esc(r.tier) + (r.anniv ? ' ann' : '') + '" data-t="' + esc(r.tier) + '"><span class="pos">#' + esc(r.rank) + '</span><span class="name">' + esc(r.name) + '</span><span class="val">' + esc((Number(r.value) || 0) + " mo") + '</span>' + (r.anniv ? '<span class="yr">' + esc(r.anniv) + ' YR</span>' : '') + (r.extra ? '<span class="rating">' + esc(fmtTime(r.extra)) + '</span>' : '') + '</li>';
        return '<li class="' + (i === 0 ? "first" : "") + '"><span class="pos">#' + esc(r.rank) + '</span><span class="name">' + esc(r.name) + '</span><span class="val">' + esc(fmtVal(r, c.unit)) + '</span></li>';
      }).join("");
      body.className = "ibody in" + (linked ? " lk" : "");
      clearTimeout(cardTimer); cardTimer = setTimeout(showNext, startCard(c));
    }
    if (instant) { fill(); return; }
    body.className = "ibody out" + (linked ? " lk" : "");
    setTimeout(fill, 320);
  }
  function showNext(first) {
    clearTimeout(cardTimer);
    if (!idleOn) return;
    var n = nextCard();
    if (!n) { document.getElementById("idle").classList.add("hidden"); cardTimer = setTimeout(function () { loadIdle(); showNext(true); }, 15000); return; }
    document.getElementById("idle").classList.remove("hidden");
    cardTimer = setTimeout(showNext, 60000);   // safety net, the card sets the real time once it is painted
    paintCard(n.card, n.linked, first === true);
  }
  function setIdle(want) {
    if (want && !idleOn) { idleOn = true; if (!idleCfg || Date.now() - idleFetchedAt > 60000) loadIdle(); bag = []; chain = null; showNext(true); }
    else if (!want && idleOn) { idleOn = false; clearTimeout(cardTimer); stopScroll(); document.getElementById("idle").classList.add("hidden"); }
    if (idleOn && Date.now() - idleFetchedAt > 60000) loadIdle();   // keep the numbers fresh during a long quiet spell
  }

  function update() {
    var s = lastState;
    if (!s) return;
    draw(s);
    var show = Date.now() < visibleUntil && !playersActive(s) && s.activity && s.activity !== "none";
    document.getElementById("card").classList.toggle("hidden", !show);
    // idle = empty queue, no match, no join / !queue pop-up, for idleSeconds; any activity ends it at once
    var quiet = !playersActive(s) && !(s.queue || []).length && Date.now() >= visibleUntil;
    if (!quiet) idleSince = Date.now();
    var secs = (idleCfg && idleCfg.idleSeconds) || 10;
    setIdle(!show && (PREVIEW || (quiet && idleCfg && idleCfg.enabled !== false && Date.now() - idleSince >= secs * 1000)));
  }

  function render(s) { if (!s) return; lastState = s; watchEvents(s); update(); }

  // Reload live_state.js every second (cache-busted)
  function poll() {
    var old = document.getElementById("state");
    if (old) old.remove();
    var sc = document.createElement("script");
    sc.id = "state";
    sc.src = "live_state.js?t=" + Date.now();
    sc.onload = function () { render(window.LIVE_STATE); };
    document.body.appendChild(sc);
  }

  loadIdle();
  if (DEMO) {
    render({ queueOpen:true, format:"3v3", activity:"competitive", gameMode:"standard", game:"rocket-league", streamerPlaying:true, spotsNeeded:0, recentEvents:[], queue:[
      {pos:1,user:"innocentpenguin_",epic:"InnocentPenguin",mmr:1500}, {pos:2,user:"rlwizard",epic:"rlwizard_RL",mmr:1320},
      {pos:3,user:"icecube",epic:"icecube_RL",mmr:1100}, {pos:4,user:"averyveryverylongname",epic:"averyveryverylong_RL",mmr:980},
      {pos:5,user:"snowdrift",epic:"snowdrift_RL",mmr:900}, {pos:6,user:"frostbyte",epic:"frostbyte_RL",mmr:880},
      {pos:7,user:"glacier",epic:"glacier_RL",mmr:800}, {pos:8,user:"polarbear",epic:"polarbear_RL",mmr:800} ] });
    visibleUntil = PREVIEW ? 0 : Date.now() + 3600000;   // demo: stay visible (preview=1 shows the idle boards instead)
    update();
  } else {
    if (PREVIEW) lastState = { queue:[], recentEvents:[] };   // preview without live_state.js
    poll();
    setInterval(poll, 1000);
    setInterval(update, 500);   // so the card hides on time between polls
  }
</script>
<script src="overlay-options.js"></script>
</body>
</html>
