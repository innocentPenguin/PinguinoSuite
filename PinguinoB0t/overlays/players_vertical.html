<!doctype html>
<!--
  PinguinoBot â€” PLAYERS overlay for the VERTICAL layout (fills the empty snowy space at the bottom of the portrait scene)
  OBS: Browser source -> tick "Local file" -> pick this file. Size about 1080 x 250 (it scales to whatever size you give the source).
  Reads live_state.js (written by PinguinoBotCore into this folder).

  Blue on the left, Orange on the right, each team's players listed top to bottom. It stays up for the WHOLE match (no timer) and until
  the next teams replace it; when a winner is recorded the winning team glows gold with a WINNER tag and the other team dims.
  Nothing shows while there is no match. The normal players.html overlay is separate and unchanged.

  TEST WITHOUT THE BOT (open in a browser):
    players_vertical.html?demo            3v3 live lineup
    players_vertical.html?demo=4          4v4 (tallest case)
    players_vertical.html?demo&n=1|2|3    team size; add &alt=4&fade=400 to set the name swap time (seconds / ms)
    players_vertical.html?demo&win=blue   same, with Blue marked as the winner (or win=orange)
-->
<html>
<head>
<meta charset="utf-8">
<title>Players Overlay (vertical)</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* Everything is sized from the height of the source (--u = 1/250 of it), so it also fits if you resize the source. */
  :root { --blue:#2f8cff; --blue2:#0c3b82; --orange:#ff8a1f; --orange2:#8a3a00; --muted:rgba(255,255,255,.75); --u:calc(100vh / 250); }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent; font-family:Rubik, Segoe UI, sans-serif; color:#fff; }
  #stage { position:absolute; inset:0; display:flex; align-items:stretch; gap:calc(var(--u)*14); padding:calc(var(--u)*8); box-sizing:border-box; opacity:0; transition:opacity .5s; }
  #stage.show { opacity:1; }
  .team { position:relative; flex:1 1 0; min-width:0; border-radius:calc(var(--u)*16); padding:calc(var(--u)*8) calc(var(--u)*12); box-sizing:border-box; box-shadow:0 8px 24px rgba(0,0,0,.5); display:flex; flex-direction:column; transition:box-shadow .5s, transform .5s, filter .5s; }
  .team.blue { background:linear-gradient(160deg, var(--blue), var(--blue2)); }
  .team.orange { background:linear-gradient(200deg, var(--orange), var(--orange2)); }
  .list { display:flex; flex-direction:column; gap:calc(var(--u)*4); flex:1; min-height:0; }
  .p { flex:1 1 0; min-height:0; display:flex; align-items:center; gap:calc(var(--u)*10); padding:0 calc(var(--u)*12); border-radius:calc(var(--u)*9); background:rgba(0,0,0,.24); font-size:calc(var(--u)*var(--fs,34)); line-height:1.05; font-weight:800; box-sizing:border-box; overflow:hidden; }
  #stage.n3 { --fs:30; } #stage.n4 { --fs:27; } #stage.n5, #stage.n6 { --fs:18; }

  /* One name at a time: the stream name and the Epic name crossfade (html.alt = showing the Epic name). Timing: ALT_SECONDS / FADE_MS below. */
  :root { --fade:.4s; }
  .nm { position:relative; flex:1 1 auto; min-width:0; display:block; overflow:hidden; white-space:nowrap; }
  .nm > span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; transition:opacity var(--fade) ease, transform var(--fade) ease; }
  .nm .n2 { position:absolute; left:0; right:0; top:0; opacity:0; transform:translateY(40%); }
  html.alt .nm:not(.one) .n1 { opacity:0; transform:translateY(-40%); }
  html.alt .nm .n2 { opacity:1; transform:none; }
  .p.empty { background:transparent; border:1px dashed rgba(255,255,255,.3); color:rgba(255,255,255,.55); font-weight:500; }
  /* Live edits: rows are keyed per player and diffed (enter / leave / cross-column slide), never rebuilt. */
  .p.enter { animation:slideIn .5s cubic-bezier(.2,.9,.3,1) both; }
  .p.leaving { animation:slideOut .4s ease-in forwards; pointer-events:none; }
  @keyframes slideIn { from { opacity:0; transform:translateX(calc(var(--u)*-30)) scale(.94); } to { opacity:1; transform:none; } }
  @keyframes slideOut { from { opacity:1; transform:none; } to { opacity:0; transform:translateX(calc(var(--u)*34)) scale(.94); } }
  .vs { align-self:center; font-size:calc(var(--u)*30); font-weight:800; text-shadow:0 3px 10px rgba(0,0,0,.6); }
  /* Winner: gold glow + WINNER tag; the other team dims. */
  .team.winner { box-shadow:inset 0 0 0 calc(var(--u)*5) #ffe169, 0 0 calc(var(--u)*24) calc(var(--u)*2) rgba(255,225,105,.7); z-index:1; }
  .team.loser { filter:grayscale(.7) brightness(.7); }
  /* The badge lives INSIDE the team box (in flow, above the list) so nothing can be clipped by the source edge. */
  .crown { display:none; flex:0 0 auto; align-self:center; margin-bottom:calc(var(--u)*4); background:#ffe169; color:#3a2a00; font-weight:800; font-size:calc(var(--u)*20); line-height:1; letter-spacing:calc(var(--u)*3); padding:calc(var(--u)*4) calc(var(--u)*18); border-radius:999px; white-space:nowrap; }
  .team.winner .crown { display:block; }
</style>
</head>
<body>
<div id="stage">
  <div class="team blue" id="blueTeam"><div class="crown">WINNER</div><div class="list" id="blue"></div></div>
  <div class="vs">VS</div>
  <div class="team orange" id="orangeTeam"><div class="crown">WINNER</div><div class="list" id="orange"></div></div>
</div>
<script>
  // â”€â”€ Settings â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  var SHOW_EPIC = true;      // include the in-game (Epic) name (it alternates with the stream name)

  var params = new URLSearchParams(location.search);
  var DEMO = params.has("demo");
  var stage = document.getElementById("stage");
  var lastKey = "", lastId = "";

  // Alternating names: one name per seat at full size, crossfading between the stream name and the Epic name.
  var ALT_SECONDS = 4;      // how long each name stays (0 = never alternate, stream name only)
  var FADE_MS = 400;        // crossfade time. Both can be overridden by ?alt=4&fade=400 or by LIVE_STATE.overlay {altSeconds, fadeMs} (Host JSON)
  function norm(s) { return String(s == null ? "" : s).toLowerCase().replace(/[^a-z0-9]/g, ""); }
  function nameHtml(p) {
    var u = f(p, "Username"), e = f(p, "Epic");
    if (!SHOW_EPIC || !e || !u || norm(e) === norm(u)) return '<span class="nm one"><span class="n1">' + esc(u || e) + '</span></span>';
    return '<span class="nm"><span class="n1">' + esc(u) + '</span><span class="n2">' + esc(e) + '</span></span>';
  }
  var altTimer = null, altKey = "";
  function applyAlt(s) {
    var o = (s && s.overlay) || {}, q = new URLSearchParams(location.search);
    var sec = q.has("alt") ? parseFloat(q.get("alt")) : (o.altSeconds != null ? o.altSeconds : ALT_SECONDS);
    var fade = q.has("fade") ? parseFloat(q.get("fade")) : (o.fadeMs != null ? o.fadeMs : FADE_MS);
    if (!(sec >= 0)) sec = ALT_SECONDS;
    if (!(fade >= 0)) fade = FADE_MS;
    document.documentElement.style.setProperty("--fade", (fade / 1000) + "s");
    if (altKey === sec + "|" + fade) return;
    altKey = sec + "|" + fade; clearInterval(altTimer); document.documentElement.classList.remove("alt");
    if (sec > 0) altTimer = setInterval(function () { document.documentElement.classList.toggle("alt"); }, sec * 1000);
  }

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); }
  function f(p, k) { return p[k] != null ? p[k] : p[k.charAt(0).toLowerCase() + k.slice(1)]; }

  // One row per seat (so the layout never jumps); empty seats are dashed.
  function rows(list, size) {
    var out = (list || []).map(function (p) {
      return '<div class="p">' + nameHtml(p) + '</div>';
    });
    while (out.length < size) out.push('<div class="p empty">Empty slot</div>');
    return out.slice(0, 6).join("");
  }


  // Keyed diff. Seats keep their slot; empty seats are dashed placeholders refreshed after leavers finish animating.
  function pkey(p) { return norm(f(p, "Username") || f(p, "Epic")); }
  function nameSig(p) { return (f(p, "Username") || "") + "|" + (f(p, "Epic") || ""); }
  function fillEmpty(cn, size) {
    Array.prototype.slice.call(cn.querySelectorAll(".p.empty")).forEach(function (e) { e.parentNode.removeChild(e); });
    var n = cn.querySelectorAll(".p:not(.leaving)").length;
    for (var i = n; i < Math.min(size, 6); i++) { var e = document.createElement("div"); e.className = "p empty"; e.textContent = "Empty slot"; cn.appendChild(e); }
  }
  function syncRows(containers, lists, size) {
    var old = {}, first = {};
    containers.forEach(function (cn) { Array.prototype.forEach.call(cn.querySelectorAll(".p[data-key]:not(.leaving)"), function (el) { old[el.dataset.key] = el; first[el.dataset.key] = el.getBoundingClientRect(); }); });
    var want = {};
    lists.forEach(function (l) { (l || []).forEach(function (p) { want[pkey(p)] = true; }); });
    Object.keys(old).forEach(function (k) {
      if (want[k]) return;
      var el = old[k]; delete old[k]; el.classList.remove("enter"); el.classList.add("leaving");
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); containers.forEach(function (cn) { fillEmpty(cn, size); }); }, 450);
    });
    var moved = [];
    containers.forEach(function (cn, ci) {
      Array.prototype.slice.call(cn.querySelectorAll(".p.empty")).forEach(function (e) { e.parentNode.removeChild(e); });
      var prev = null;
      (lists[ci] || []).forEach(function (p) {
        var k = pkey(p), el = old[k], fresh = !el;
        if (fresh) { el = document.createElement("div"); el.className = "p enter"; el.dataset.key = k; el.dataset.sig = nameSig(p); el.innerHTML = nameHtml(p); old[k] = el; }
        else { if (el.dataset.sig !== nameSig(p)) { el.dataset.sig = nameSig(p); el.innerHTML = nameHtml(p); } moved.push(k); }
        if (el.parentNode !== cn || el.previousElementSibling !== prev) cn.insertBefore(el, prev ? prev.nextSibling : cn.firstChild);
        prev = el;
      });
      fillEmpty(cn, size);
    });
    moved.forEach(function (k) {
      var el = old[k], a = first[k], b = el.getBoundingClientRect();
      if (!a) return;
      var dx = a.left - b.left, dy = a.top - b.top;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      el.animate([{ transform: "translate(" + dx + "px," + dy + "px)" }, { transform: "none" }], { duration: 500, easing: "cubic-bezier(.2,.8,.2,1)" });
    });
  }
  function seatRows(list, size) {
    var out = (list || []).map(function (p) { return '<div class="p" data-key="' + esc(pkey(p)) + '" data-sig="' + esc(nameSig(p)) + '">' + nameHtml(p) + '</div>'; });
    while (out.length < size) out.push('<div class="p empty">Empty slot</div>');
    return out.slice(0, 6).join("");
  }

  window.addEventListener("resize", function () { lastKey = ""; lastId = ""; });

  function winnerOf(s) {
    if (DEMO) return params.get("win");
    if (s.currentMatch && s.currentMatch.winner) return s.currentMatch.winner;
    var ev = s.lastEvent && s.lastEvent.Type === "match_result" ? s.lastEvent : null;
    if (!ev) ev = (s.recentEvents || []).filter(function (e) { return e.Type === "match_result"; }).pop();
    return ev ? ev.Detail : null;
  }

  function render(s) {
    applyAlt(s);
    var m = s && s.currentMatch;
    if (!m) { stage.classList.remove("show"); lastKey = ""; lastId = ""; return; }
    var idKey = JSON.stringify([m.id, m.format, s.game]), key = JSON.stringify([m.blue, m.orange]);
    var size = { "1v1":1, "2v2":2, "3v3":3, "4v4":4 }[m.format] || Math.max((m.blue || []).length, (m.orange || []).length, 1);
    if (idKey === lastId && key !== lastKey) {                 // same match, roster edited: diff + animate
      lastKey = key;
      syncRows([document.getElementById("blue"), document.getElementById("orange")], [m.blue, m.orange], size);
    } else if (idKey !== lastId || key !== lastKey) {
      lastKey = key; lastId = idKey;
      document.getElementById("blue").innerHTML = seatRows(m.blue, size);
      document.getElementById("orange").innerHTML = seatRows(m.orange, size);
      stage.className = (stage.className.replace(/n\d/g, '') + ' n' + Math.min(size, 6)).trim();


    }
    var win = m.status === "finished" ? winnerOf(s) : (DEMO ? params.get("win") : null);
    var b = document.getElementById("blueTeam"), o = document.getElementById("orangeTeam");
    b.classList.toggle("winner", win === "blue"); b.classList.toggle("loser", win === "orange");
    o.classList.toggle("winner", win === "orange"); o.classList.toggle("loser", win === "blue");
    stage.classList.add("show");
  }

  function poll() {
    var old = document.getElementById("state");
    if (old) old.remove();
    var sc = document.createElement("script");
    sc.id = "state";
    sc.src = "live_state.js?t=" + Date.now();
    sc.onload = function () { render(window.LIVE_STATE); };
    document.body.appendChild(sc);
  }

  if (DEMO) {
    var four = params.get("demo") === "4";
    var bl = [{Username:"penguinfan",Epic:"Penguin Fan"},{Username:"xx",Epic:"xx"},{Username:"youtube-tankjakvcgic4947",Epic:"tankjakvcgic4947_epicname"},{Username:"short",Epic:"ShortEpic"}];
    var og = [{Username:"flipreset",Epic:"FlipReset99"},{Username:"innocentpenguin_",Epic:"InnocentPenguin"},{Username:"boostgoblin"},{Username:"innocentpenguin_",Epic:"InnocentPenguin"}];
    var n = parseInt(params.get("n") || "", 10) || (four ? 4 : 3);
    render({ game:"rocket-league", currentMatch:{ id:7, format:n + "v" + n, status: params.get("win") ? "finished" : "live", blueAvg:1120, orangeAvg:1105, blue:bl.slice(0, n), orange:og.slice(0, n) } });
  } else {
    poll();
    setInterval(poll, 400);
  }
</script>
<script src="overlay-options.js"></script>
</body>
</html>
