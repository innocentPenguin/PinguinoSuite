<!doctype html>
<!--
  PinguinoB0t - CHAT FEED widget (scene HUD). Last chat lines, newest at the bottom. Data: Host GET /api/chat/recent (polled every 2 s).
  Params: max=8 (lines shown) | fade=0 (seconds until a line fades out, 0 = never) | host=http://127.0.0.1:8770 | preview=1 (sample lines, no Host needed) | bots=1 (show bot lines, default hidden) | cmds=1 (show !command lines, default hidden) | badges=0 (no badge images)
  Badges: images before the name (msg.badgeSets url, else /api/chat/badges by set + version, else Twitch's fixed global image for broadcaster / moderator / vip; old msg.badges name strings still work). Name colour: the message's color field (#rrggbb), else a stable colour from a hash of the name. Plain lines (no box), normal weight.
  Design size 460 x 520. Orange/dark Penguino look.
-->
<html><head><meta charset="utf-8"><title>Chat Feed</title>
<style>
  html,body{margin:0;width:460px;height:520px;overflow:hidden;background:transparent;font-family:Rubik,"Segoe UI",Arial,sans-serif}
  #box{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:2px;padding:6px}
  .m{padding:1px 6px;color:#fff;font-size:24px;line-height:1.25;word-wrap:break-word;overflow-wrap:anywhere;transition:opacity .8s;text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.8)}
  .m .n{color:#ff9d3c;font-weight:400}
  .m img.bd{height:1em;width:1em;vertical-align:-.15em;margin-right:4px}
  .m.out{opacity:0}
</style></head><body><div id="box"></div>
<script>
(function(){
  var Q=new URLSearchParams(location.search), MAX=Math.max(1,Math.min(20,+Q.get("max")||8)), FADE=Math.max(0,+Q.get("fade")||0), SHOWBOTS=Q.get("bots")==="1", SHOWCMDS=Q.get("cmds")==="1", SHOWB=Q.get("badges")!=="0";
  var HOST=Q.get("host")||(location.protocol.indexOf("http")===0?location.origin:"http://127.0.0.1:8770"), box=document.getElementById("box"), seq=0;
  var GLOBAL={broadcaster:"5527c58c-fb7d-422d-b71b-f309dcb85cc1",moderator:"3267646d-33f0-4b17-b3df-f923a41db1d0",vip:"b817aba4-fad8-49e2-b88a-7cc744dfa6ec"};
  // same rule as the Host's Boards.IsBot: name ends in bot / b0t, or a known bot (the Host's own extra-bot list is not visible here)
  var BOTS=/^(nightbot|streamelements|soundalerts|streamlabs|moobot|fossabot|synchrabot|pinguinob0t|chattypinguino|pinguinohelper|potatbotat|rocketrankbot|sery_bot|wizebot|commanderroot|anotherttvviewer)$/;
  function isBot(m){var u=String(m.user||m.display||"").toLowerCase(); return /(bot|b0t)$/.test(u)||BOTS.test(u);}
  // the viewer's Twitch colour when the Host sends it (#rrggbb), else a stable colour from a hash of the name, so names are never all the same
  var PAL=["#FF4D4D","#4DA3FF","#3DDC84","#FF8A50","#B9D93A","#FF5CA8","#A66BFF","#2EC4B6","#E8B923","#E0763A","#5FB3C2","#7FA8FF"];
  function nameColor(m){
    if(m.color&&/^#[0-9a-f]{6}$/i.test(m.color)) return m.color;
    var n=String(m.user||m.display||"?").toLowerCase(), h=0; for(var k=0;k<n.length;k++) h=(h*31+n.charCodeAt(k))>>>0;
    return PAL[h%PAL.length];
  }
  // badge images: /api/chat/badges (global + channel sets, fetched once and refreshed hourly; 2x preferred), else Twitch's fixed global image for broadcaster / moderator / vip; none found = no badge
  var BADGES={sets:{},loaded:false};
  function badgeUrl(set,ver){
    var v=BADGES.sets[set]; if(v){var e=v[ver]||v[Object.keys(v)[0]]; var u=e&&(e["2x"]||e["4x"]||e["1x"]); if(u&&/^https:[/][/]/.test(u)) return u;}
    return GLOBAL[set]?"https://static-cdn.jtvnw.net/badges/v1/"+GLOBAL[set]+"/2":"";
  }
  function loadBadges(){
    fetch(HOST+"/api/chat/badges").then(function(r){return r.json();}).then(function(j){if(j&&j.sets) BADGES.sets=j.sets;}).catch(function(){}).then(function(){
      BADGES.loaded=true;
      [].slice.call(document.querySelectorAll("img.bd[data-set]")).forEach(function(i){var u=badgeUrl(i.getAttribute("data-set"),i.getAttribute("data-ver")); if(u){i.removeAttribute("data-set"); i.style.display=""; i.src=u;} else if(i.parentNode) i.parentNode.removeChild(i);});
    });
  }
  function add(m){
    if(!SHOWBOTS&&isBot(m)) return;
    if(!SHOWCMDS&&/^\s*!/.test(m.text||"")) return;
    var d=document.createElement("div"); d.className="m";
    if(SHOWB) ((m.badgeSets&&m.badgeSets.length?m.badgeSets:m.badges)||[]).forEach(function(x){
      var set=String(typeof x==="string"?x:(x&&(x.set_id||x.set))||"").toLowerCase(), ver=typeof x==="string"?"":String((x&&x.version)||""), u=x&&x.url&&/^https:[/][/]/.test(x.url)?x.url:badgeUrl(set,ver);
      var i=document.createElement("img"); i.className="bd"; i.alt=""; i.onerror=function(){if(i.parentNode)i.parentNode.removeChild(i);};
      if(u){i.src=u; d.appendChild(i);} else if(!BADGES.loaded){i.setAttribute("data-set",set); i.setAttribute("data-ver",ver); i.style.display="none"; d.appendChild(i);}   // resolved when /api/chat/badges arrives
    });
    var b=document.createElement("span"); b.className="n"; b.textContent=(m.display||m.user||"?")+": "; b.style.color=nameColor(m); d.appendChild(b); d.appendChild(document.createTextNode(m.text||""));
    box.appendChild(d); while(box.children.length>MAX) box.removeChild(box.firstChild);
    if(FADE>0) setTimeout(function(){d.classList.add("out");setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},900);},FADE*1000);
  }
  function poll(){
    fetch(HOST+"/api/chat/recent?since="+seq+"&limit="+(MAX*4)).then(function(r){return r.json();}).then(function(j){
      if(!j||!j.messages)return; var first=seq===0; var ms=j.messages.filter(function(m){return (SHOWBOTS||!isBot(m))&&(SHOWCMDS||!/^\s*!/.test(m.text||""));}); if(first) ms=ms.slice(-MAX);   // bots are dropped before the cut so the box still fills
      ms.forEach(function(m){add(m);}); if(j.seq!==undefined) seq=j.seq;
    }).catch(function(){});
  }
  if(Q.get("preview")==="1"){["hello chat!","!join","nice one","gg","who is up next?"].forEach(function(t,i){add({display:"Viewer"+(i+1),text:t,color:["#1E90FF","#FF69B4","#00FF7F","","#FFD700"][i],badges:i===0?["broadcaster"]:i===1?["moderator"]:i===2?["vip"]:[]});}); add({display:"PinguinoB0t",text:"hidden bot line"});}
  else{loadBadges();setInterval(loadBadges,3600000);poll();setInterval(poll,2000);}
})();
</script>
<script src="overlay-options.js"></script>
</body></html>
