<!doctype html>
<!--
  PinguinoB0t - CHAT FEED widget (scene HUD), Synchra-style: no box, real Twitch badge images (Twitch order), bold name in the user's own Twitch colour, colon, white bold rounded text with a light outline/shadow, tight spacing.
  Last chat lines, newest at the bottom. Data: Host GET /api/chat/recent (polled every 2 s). Works as a plain http source (TikTok LIVE Studio) too.
  Params: max=8 (lines shown) | fade=0 (seconds until a line fades out, 0 = never) | size=24 (message font px; 8-120 allowed) | gap=2 (px between lines) | badges=0 (hide badge images)
          pills=1 (text pills LIVE/MOD/SUB instead of images, default off) | emotes=1 (0 = plain text) | host=http://127.0.0.1:8770 | preview=1 (sample lines, no Host needed)
  Size of the whole widget: the usual overlay-options (scale, anchor, pad ...) apply. Design size 460 x 520.
  Message fields it understands (all optional): display|user, text, color (#rrggbb, Twitch name colour), badges (["broadcaster","moderator","vip","subscriber"] or [{set,version,url}]),
          sub {tier,months}, emotes (Twitch IRC tag string "id:0-4,10-14/id2:6-8" or [{id,start,end}|{url,start,end}]), platform (twitch|youtube|tiktok).
-->
<html><head><meta charset="utf-8"><title>Chat Feed</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap">
<style>
  :root{--fs:24px;--gap:2px}
  html,body{margin:0;width:460px;height:520px;overflow:hidden;background:transparent;font-family:Nunito,"Varela Round","Segoe UI",Rubik,Arial,sans-serif}
  #box{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:var(--gap);padding:6px}
  .m{color:#fff;font-weight:800;font-size:var(--fs);line-height:1.2;word-wrap:break-word;overflow-wrap:anywhere;transition:opacity .8s;
     text-shadow:0 1px 3px rgba(0,0,0,.6),0 0 6px rgba(0,0,0,.3)}
  .m .o{-webkit-text-stroke:.06em #14110e;paint-order:stroke fill;stroke-linejoin:round}
  .m .n{color:#ff9d3c;margin-right:.05em}
  .m .c{color:#fff;margin-right:.12em}
  .m .t{color:#fff}
  .m.out{opacity:0}
  .pill{display:inline-block;vertical-align:.14em;margin-right:.2em;padding:.12em .5em .1em;border-radius:999px;font-size:max(.62em,7.5px);line-height:1.15;font-weight:900;letter-spacing:.03em;color:#fff;text-shadow:none;-webkit-text-stroke:0;box-shadow:0 1px 3px rgba(0,0,0,.45)}
  .pill.live{background:#e63946}.pill.sub{background:#9147ff}.pill.mod{background:#1fa24a}.pill.vip{background:#e0399a}
  .pill.founder{background:#d98a00}.pill.bits{background:#2f7be0}.pill.yt{background:#ff2a2a}.pill.tt{background:#111;box-shadow:0 0 0 1px #25f4ee,1px 1px 0 1px #fe2c55}.pill.other{background:#5b5666}
  .bimg{height:1em;width:1em;vertical-align:-.14em;margin-right:.16em;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
  .emo{height:1.35em;width:auto;vertical-align:-.3em;margin:0 .05em;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
</style></head><body><div id="box"></div>
<script>
(function(){
  var Q=new URLSearchParams(location.search), MAX=Math.max(1,Math.min(20,+Q.get("max")||8)), FADE=Math.max(0,+Q.get("fade")||0);
  var SIZE=Math.max(8,Math.min(120,+Q.get("size")||24)), GAP=Q.has("gap")?Math.max(0,Math.min(80,+Q.get("gap"))):2;
  var PILLS=Q.get("pills")==="1", SHOWB=Q.get("badges")!=="0", EMOTES=Q.get("emotes")!=="0";
  document.documentElement.style.setProperty("--fs",SIZE+"px"); document.documentElement.style.setProperty("--gap",GAP+"px");
  var HOST=Q.get("host")||(location.protocol.indexOf("http")===0?location.origin:"http://127.0.0.1:8770"), box=document.getElementById("box"), seq=0;
  function el(tag,cls,txt){var e=document.createElement(tag); if(cls)e.className=cls; if(txt!==undefined)e.textContent=txt; return e;}
  var GLOBAL={broadcaster:"5527c58c-fb7d-422d-b71b-f309dcb85cc1",moderator:"3267646d-33f0-4b17-b3df-f923a41db1d0",vip:"b817aba4-fad8-49e2-b88a-7cc744dfa6ec"};
  function pill(cls,txt){return el("span","pill "+cls,txt);}
  function badgeEls(m){
    var out=[], seen={}; if(!SHOWB) return out;
    var pf=String(m.platform||"twitch").toLowerCase();
    if(PILLS){ if(pf==="youtube") out.push(pill("yt","YT")); else if(pf==="tiktok") out.push(pill("tt","TT")); }
    (m.badges||[]).forEach(function(b){
      var set=String(typeof b==="string"?b:(b&&b.set)||"").toLowerCase(), ver=typeof b==="object"&&b?b.version:""; if(!set||seen[set])return; seen[set]=1;
      if(!PILLS){   // real badge image: the url the Host sends (Helix chat/badges), else Twitch's fixed global image for the three common sets
        var u=b&&b.url&&/^https:[/][/]/.test(b.url)?b.url:(GLOBAL[set]?"https://static-cdn.jtvnw.net/badges/v1/"+GLOBAL[set]+"/2":"");
        if(u){var i=el("img","bimg"); i.src=u; i.alt=""; i.onerror=function(){if(i.parentNode)i.parentNode.removeChild(i);}; out.push(i);}
        return;
      }
      if(set==="broadcaster") out.push(pill("live","LIVE"));
      else if(set==="moderator") out.push(pill("mod","MOD"));
      else if(set==="vip") out.push(pill("vip","VIP"));
      else if(set==="subscriber"||set==="sub"){var mo=(m.sub&&m.sub.months)||(ver&&+ver>=0&&+ver<1000?+ver:0); out.push(pill("sub",mo>1?"SUB "+mo:"SUB"));}
      else if(set==="founder") out.push(pill("founder","FOUNDER"));
      else if(set==="bits"||set==="bits-leader"||set==="sub-gifter"||set==="sub-gift-leader") out.push(pill("bits",set==="bits"?"BITS":set==="bits-leader"?"TOP BITS":set==="sub-gifter"?"GIFTER":"TOP GIFTER"));
      else if(/^(premium|turbo|partner|verified|staff|admin|global_mod|artist-badge)$/.test(set)) out.push(pill("other",set==="premium"?"PRIME":set==="global_mod"?"GMOD":set==="artist-badge"?"ARTIST":set.toUpperCase()));
    });
    return out;
  }
  function emoteRanges(m){
    var r=[], e=m.emotes; if(!EMOTES||!e) return r;
    if(typeof e==="string"){e.split("/").forEach(function(g){var p=g.split(":"); if(p.length<2||!/^[\w]+$/.test(p[0]))return; p[1].split(",").forEach(function(x){var s=x.split("-"); if(s.length===2)r.push({s:+s[0],e:+s[1],url:"https://static-cdn.jtvnw.net/emoticons/v2/"+p[0]+"/default/dark/2.0"});});});}
    else if(Array.isArray(e)) e.forEach(function(x){if(!x)return; var u=x.url&&/^https:\/\//.test(x.url)?x.url:(x.id&&/^[\w]+$/.test(String(x.id))?"https://static-cdn.jtvnw.net/emoticons/v2/"+x.id+"/default/dark/2.0":""); if(u&&isFinite(x.start)&&isFinite(x.end))r.push({s:+x.start,e:+x.end,url:u});});
    return r.sort(function(a,b){return a.s-b.s;});
  }
  function textEl(m){
    var t=String(m.text||""), span=el("span","t o"), rs=emoteRanges(m), chars=Array.from(t), pos=0;   // Twitch indexes count characters (code points), not UTF-16 units
    if(!rs.length){span.textContent=t; return span;}
    rs.forEach(function(r){
      if(r.s<pos||r.e>=chars.length)return; if(r.s>pos) span.appendChild(document.createTextNode(chars.slice(pos,r.s).join("")));
      var i=el("img","emo"); i.src=r.url; i.alt=chars.slice(r.s,r.e+1).join(""); span.appendChild(i); pos=r.e+1;
    });
    if(pos<chars.length) span.appendChild(document.createTextNode(chars.slice(pos).join("")));
    return span;
  }
  function add(m){
    var d=el("div","m"); badgeEls(m).forEach(function(b){d.appendChild(b);});
    var n=el("span","n o",m.display||m.user||"?"); if(m.color&&/^#[0-9a-f]{6}$/i.test(m.color)) n.style.color=m.color; d.appendChild(n);
    d.appendChild(el("span","c o",": ")); d.appendChild(textEl(m));
    box.appendChild(d); while(box.children.length>MAX) box.removeChild(box.firstChild);
    if(FADE>0) setTimeout(function(){d.classList.add("out");setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},900);},FADE*1000);
  }
  function poll(){
    fetch(HOST+"/api/chat/recent?since="+seq+"&limit="+MAX).then(function(r){return r.json();}).then(function(j){
      if(!j||!j.messages)return; var first=seq===0; var ms=j.messages; if(first) ms=ms.slice(-MAX);
      ms.forEach(function(m){add(m);}); if(j.seq!==undefined) seq=j.seq;
    }).catch(function(){});
  }
  if(Q.get("preview")==="1"){
    [{display:"InnocentPenguin_",color:"#FF8C00",badges:["broadcaster","subscriber"],text:"test"},
     {display:"ModMaria",color:"#1E90FF",badges:["moderator","subscriber"],sub:{months:14},text:"gg that was close Kappa",emotes:"25:18-22"},
     {display:"VipVince",color:"#FF69B4",badges:["vip"],text:"who is up next?"},
     {display:"Viewer4",badges:[],text:"a long message to check that wrapping stays tidy over any scene background"}].forEach(add);
  }
  else{poll();setInterval(poll,2000);}
})();
</script>
<script src="overlay-options.js"></script>
</body></html>
