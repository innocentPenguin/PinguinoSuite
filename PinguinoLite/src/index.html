<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PinguinoLite</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* Penguino palette (same tokens as the full app's theme.css, copied: Lite runs no core to serve it). Orange on near-black only. */
:root{
  --bg:#050505;--bg2:#0a0a0b;--panel:#101012;--panel2:#17171a;--line:#232326;--line2:#34343a;
  --fg:#f2f0ec;--dim:#a39f98;--faint:#85827b;
  --accent:#ff9900;--accent-hover:#ffad33;--accent-active:#e68a00;--accent-soft:#ff990022;--accent-line:#ff990066;--on-accent:#140b00;--focus:#ffc266;
  --ok:#3ddc97;--warn:#e8d44d;--bad:#ff5c5c;--info:#9fb4c7;--muted-tag:#b9a58a;--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:236px 1fr;height:100%}
nav{background:var(--bg2);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 14px}
.brand img{width:36px;height:36px;border-radius:50%;display:block}
.brand b{font-size:16px;letter-spacing:.2px}.brand b .accent{color:var(--accent)}.brand small{display:block;color:var(--faint);font-size:11px;margin-top:-3px}
nav h6{margin:14px 12px 4px;font-size:10.5px;letter-spacing:1.2px;color:var(--faint);text-transform:uppercase;font-weight:600}
.item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;color:var(--dim);cursor:pointer;border:1px solid transparent;user-select:none}
.item:hover{background:#ffffff08;color:var(--fg)}
.item.on{background:linear-gradient(90deg,#ff990019,#ff990008);border-color:#ff990030;color:var(--fg)}
.item .ic{width:20px;text-align:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);margin-left:auto}.dot.running{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.tag{margin-left:auto;font-size:9.5px;padding:1px 7px;border-radius:8px;letter-spacing:.6px;text-transform:uppercase;font-weight:700;background:#e8d44d22;color:var(--warn)}
nav .sp{flex:1}
nav .ver{color:var(--faint);font-size:12px;padding:0 12px}
main{overflow:auto;padding:24px 28px}
h1{margin:0 0 4px;font-size:22px}
.sub{color:var(--dim);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:linear-gradient(var(--panel),#0c0c0e);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.big{font-size:26px;font-weight:700}
.note{color:var(--faint);font-size:12px;margin-top:4px;word-break:break-all}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line2);background:var(--panel2);color:var(--info)}
.pill.ok{color:var(--ok);border-color:#3ddc9755}.pill.bad{color:var(--bad);border-color:#ff5c5c55}.pill.warn{color:var(--warn);border-color:#e8d44d55}.pill.stub{color:var(--muted-tag)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 0}
.btn{all:unset;cursor:pointer;padding:7px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);color:var(--fg)}
.btn:hover{border-color:var(--accent-line)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.pri:hover{background:var(--accent-hover)}
.btn[aria-disabled=true]{opacity:.45;cursor:default}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
td .d{color:var(--dim);font-size:13px}
.empty{padding:36px;text-align:center;color:var(--dim)}
.banner{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;margin:0 0 16px;color:var(--fg)}
.qm{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50}.qm.on{display:flex}.qm .box{background:var(--panel2);border:1px solid var(--accent-line);border-radius:14px;padding:22px 26px;max-width:360px}.qm h2{margin:0 0 6px;font-size:18px}.qm p{margin:0 0 16px;color:var(--faint)}.qm .row{margin:0;justify-content:flex-end}
.toast{position:fixed;right:20px;bottom:20px;background:var(--panel2);border:1px solid var(--accent-line);border-radius:12px;padding:10px 16px;display:none}
.mono{font-family:Consolas,monospace}
</style>
</head>
<body>
<div class="app">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="qm" id="qm"><div class="box"><h2>Quit PinguinoLite?</h2><p>This also stops the PinguinoLink that Lite started. Anything Lite did not start keeps running.</p><div class="row"><button class="btn" id="qm-cancel">Cancel</button><button class="btn pri" id="qm-ok">Quit</button></div></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
// All native access goes through 5 Tauri commands (src-tauri/src/main.rs). Contract: Docs/LITE_APP.md.
const inv = (c, a) => window.__TAURI__ && window.__TAURI__.core ? window.__TAURI__.core.invoke(c, a) : Promise.reject(new Error('not running inside PinguinoLite'));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago = ms => { if (!ms) return 'never'; const s = Math.max(0, (Date.now() - ms) / 1000); return s < 60 ? 'just now' : s < 3600 ? Math.floor(s/60) + ' min ago' : s < 86400 ? Math.floor(s/3600) + ' h ago' : Math.floor(s/86400) + ' d ago'; };
const iso = t => { const n = Date.parse(t); return isNaN(n) ? 0 : n; };
// dotted numeric compare: 1.10.0 > 1.9.0
const cmpVer = (a, b) => { const x = String(a).split('.').map(n => parseInt(n) || 0), y = String(b).split('.').map(n => parseInt(n) || 0); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d; } return 0; };

// Modules Lite does not show (Ivan: Voice is out of Lite for now)
const HIDDEN = ['voice'];
let ports = {};
let info = null, state = { host: null, catalog: null, installed: null, upd: null, status: null, manifest: null };
let page = 'dashboard';
let gh = null;   // last GitHub update check result {ok, update, latest, url, error, at}
try { gh = JSON.parse(localStorage.getItem('gh') || 'null'); } catch {}
let ghBusy = false;
let mods = null, vres = null;   // on-demand module files (install profile) and the last Verify result
let parts = null, job = null;   // per-part updates (shared Node updater): last check {supported, parts[], live, ...} and the running/finished job
async function loadMods() { mods = await inv('parts_modules').catch(() => null); render(); }
async function checkParts() { parts = await inv('parts_check').catch(e => ({ ok: false, supported: false, message: String(e) })); render(); }
async function pollJob() {
  for (;;) {
    job = await inv('parts_job').catch(() => null); render();
    if (!job || job.state !== 'running') break;
    await new Promise(r => setTimeout(r, 1500));
  }
  if (job && job.state === 'done') {
    if (job.kind === 'verify') vres = job.result && job.result.parts ? job.result : { ok: false, message: job.message };
    toast(job.message || (job.ok ? 'Done' : 'Failed')); checkParts(); loadMods(); refresh();
  }
}
function partsCard() {
  if (!parts) return '';
  const run = job && job.state === 'running';
  if (!parts.supported) return `<div class="card" style="margin-top:12px"><h3>Parts</h3><div class="note">${esc(parts.message || 'This copy does not update itself (development build).')}</div></div>`;
  const blocked = run || parts.live !== false;
  const list = (parts.parts || []).map(p => `<tr><td><b>${esc(p.name || p.id)}</b>${p.staged ? ' <span class="d">(applied at next start)</span>' : ''}</td>
     <td>${p.changed ? '<span class="pill warn">Update available</span>' : '<span class="pill ok">Up to date</span>'}</td>
     <td style="text-align:right">${p.changed ? `<button class="btn pri" data-part="${esc(p.id)}"${blocked ? ' disabled' : ''}>Update</button>` : ''}</td></tr>`).join('');
  return `<div class="card" style="margin-top:12px"><h3>Parts${parts.version ? ` - release ${esc(parts.version)}` : ''}</h3>
   ${parts.ok ? (list ? `<table><tbody>${list}</tbody></table>` : '<div class="note">This release has no parts for Lite.</div>') : `<div class="note">${esc(parts.message || 'Could not check parts.')}</div>`}
   ${parts.live === true ? '<div class="note" style="color:var(--warn)">You are live: updates wait until the stream is over.</div>' : parts.live == null ? '<div class="note">Could not tell whether you are live; updates are held.</div>' : ''}
   ${run ? `<div class="note">Updating ${esc((job.parts || []).join(', ') || '...')}: ${esc(job.message)}...</div>` : job && job.state === 'done' ? `<div class="note" style="color:var(${job.ok ? '--ok' : '--bad'})">${esc(job.message)}</div>` : ''}
   <div class="row"><button class="btn" data-parts-check="1">Check parts</button><button class="btn" data-parts-rollback="1"${blocked ? ' disabled' : ''} title="Put back the version kept before the last update">Roll back last update</button></div></div>`;
}
// Module files: which on-demand modules this install has (profile), Verify (hash check), Eject (files moved aside, reversible), Install (fetched only on click).
function modCard() {
  if (!mods || !mods.supported) return '';
  const run = job && job.state === 'running';
  const blocked = run || mods.live !== false;
  const vr = id => vres && vres.parts ? vres.parts.find(p => p.id === id) : null;
  const vpill = id => {
    const v = vr(id); if (!v) return '';
    return v.state === 'ok' ? ' <span class="pill ok">files verified</span>'
      : v.state === 'not-in-release' ? ' <span class="pill">not in this release</span>'
      : ` <span class="pill bad" title="${esc((v.missing || []).concat(v.changed || []).slice(0, 8).join(', '))}">${v.state === 'missing' ? 'files missing' : v.changed_count + ' changed / ' + v.missing_count + ' missing'}</span>`;
  };
  const rowsM = (mods.modules || []).map(m => {
    const v = vr(m.id), bad = v && (v.state === 'damaged' || v.state === 'missing');
    return `<tr><td><b>${esc(m.name)}</b></td>
     <td>${m.installed ? '<span class="pill ok">Installed</span>' : '<span class="pill">Not installed</span>'}${m.installed ? vpill(m.id) : ''}</td>
     <td style="text-align:right">${m.installed
        ? `<button class="btn" data-mod-verify="${esc(m.id)}"${run ? ' disabled' : ''}>Verify</button> ${bad ? `<button class="btn pri" data-part="${esc(m.id)}"${blocked ? ' disabled' : ''}>Repair</button> ` : ''}<button class="btn" data-mod-eject="${esc(m.id)}"${blocked ? ' disabled' : ''} title="Stops it and moves its files aside (nothing is deleted). Install brings it back.">Eject</button>`
        : `<button class="btn pri" data-mod-install="${esc(m.id)}"${blocked ? ' disabled' : ''} title="Downloads this module now. Nothing is downloaded until you click.">Install</button>`}</td></tr>`;
  }).join('');
  return `<div class="card" style="margin-top:12px"><h3>Module files${mods.profile === 'lite-minimal' ? ' <span class="pill">minimal install</span>' : ''}</h3>
   <table><tbody>${rowsM}</tbody></table>
   ${mods.live === true ? '<div class="note" style="color:var(--warn)">You are live: install, eject and repair wait until the stream is over.</div>' : mods.live == null ? '<div class="note">Could not tell whether you are live; changes are held.</div>' : ''}
   ${vres && !vres.ok ? `<div class="note" style="color:var(--bad)">${esc(vres.message || 'Verify failed')}</div>` : vres && vres.all_ok ? '<div class="note" style="color:var(--ok)">Everything checked matches the release.</div>' : ''}
   ${run ? `<div class="note">${esc(job.kind)} ${esc((job.parts || []).join(', '))}: ${esc(job.message)}...</div>` : ''}
   <div class="row"><button class="btn" data-mod-verify="all"${run ? ' disabled' : ''}>Verify all files</button></div></div>`;
}
// Lite's own update check (GitHub releases, via the shell). Quiet at startup at most once per 24 h; manual button any time.
async function checkLite(manual) {
  if (ghBusy || !info) return;
  ghBusy = true; if (manual) { render(); }
  const r = await inv('check_update', { current: info.version }).catch(e => ({ ok: false, error: String(e) }));
  gh = { ...r, at: Date.now() }; ghBusy = false;
  try { localStorage.setItem('gh', JSON.stringify(gh)); } catch {}
  render();
  if (manual) toast(!r.ok ? r.error : r.update ? `Version ${r.latest} is available` : 'PinguinoLite is up to date');
}

function toast(t) { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 3500); }

async function refresh() {
  const rd = n => inv('read_contract', { name: n }).catch(() => ({ exists: false }));
  ports = await inv('probe_ports').catch(() => ({}));
  const [host, catalog, installed, upd, status, manifest] = await Promise.all([inv('host_live').catch(() => ({ reachable: false })), rd('modules_catalog'), rd('installed'), rd('update_status'), rd('status'), rd('update_manifest')]);
  const replays = await inv('replay_index').catch(() => ({ items: [], dirs: [] }));
  state = { host, catalog, installed, upd, status, manifest, replays };
  render();
}

// Replays: Lite scans the streamer's own Rocket League replay folders and parses them locally (nothing is uploaded).
function replaysPage() {
  const r = state.replays || { items: [], dirs: [] };
  const dirs = r.dirs.map(d => `<span class="pill ${d.exists ? 'ok' : ''}">${esc(d.name)}${d.exists ? '' : ' (not found)'}</span>`).join(' ');
  const wl = w => w === 'blue' ? '<span class="pill" style="color:#5ab0ff">Blue won</span>' : w === 'orange' ? '<span class="pill warn">Orange won</span>' : w === 'draw' ? '<span class="pill">Draw</span>' : '<span class="pill">unknown</span>';
  const body = r.items.length
    ? `<table><thead><tr><th>Played</th><th>Size</th><th>Score</th><th>Result</th><th>MVP</th></tr></thead><tbody>${r.items.map(m => `<tr>
        <td class="mono">${esc((m.played_at || '').replace('T', ' ').slice(0, 16))}</td><td>${m.team_size ? m.team_size + 'v' + m.team_size : '-'}</td>
        <td class="mono"><b>${esc(m.blue)} - ${esc(m.orange)}</b></td><td>${m.status === 'complete' ? wl(m.winner) : '<span class="pill">incomplete</span>'}</td><td>${esc(m.mvp || '-')}</td></tr>`).join('')}</tbody></table>`
    : `<div class="empty">No replay found yet.<br>In Rocket League, save a replay from the match history or post-match screen. Lite picks it up within 30 seconds.</div>`;
  return `<h1>Replays</h1><p class="sub">Who won and per-player stats, read locally from your saved Rocket League replays. Nothing leaves this PC.</p>
   <div class="row" style="margin:0 0 10px">Watching: ${dirs || '<span class="d">nothing</span>'}</div>
   <div class="card" style="padding:4px 8px">${body}</div>
   <div class="card" style="padding:12px 16px;margin-top:12px"><h3 style="margin:0 0 6px">Check for new replays every <b id="ivl-v">${esc(r.interval || 3)}</b> s</h3>
     <input type="range" id="ivl" min="1" max="10" step="1" value="${esc(r.interval || 3)}" style="width:100%;accent-color:var(--accent)">
     <div class="note">1 = most responsive, 10 = lightest. Applied immediately and remembered.</div></div>
   <div class="row"><button class="btn pri" data-scan="1">Scan now</button><button class="btn" data-open="folder">Open Lite data folder</button></div>`;
}

// Merge catalog + installed -> rows. A module is "installed" only if installed.json says so; "update" if catalog version is newer.
function rows() {
  const cat = state.catalog && state.catalog.data && Array.isArray(state.catalog.data.modules) ? state.catalog.data.modules : [];
  const inst = state.installed && state.installed.data && state.installed.data.modules || {};
  const busy = state.status && state.status.data && state.status.data.busy || {};
  const cs = state.status && state.status.data && state.status.data.modules || {};
  return cat.filter(m => !HIDDEN.includes(m.id)).map(m => {
    const i = inst[m.id], latest = m.version || m.latest_version;
    return { ...m, description: m.desc || m.description, latest_version: latest, installed: !!i, installed_version: i && i.version, update: !!i && cmpVer(latest, i.version) > 0, busy: busy[m.id] || '', conn: cs[m.id] };
  });
}

function dashboard() {
  const h = state.host || {}, r = rows(), n = r.filter(x => x.installed).length, u = r.filter(x => x.update).length;
  const us = state.upd && state.upd.data || {};
  const writer = state.status && state.status.data && state.status.data.writer;
  const conn = state.status && state.status.data && state.status.data.connector;
  const lm = state.manifest && state.manifest.data && (state.manifest.data.lite || { latest: state.manifest.data.latest_version });
  const selfUpd = lm && lm.latest && info && cmpVer(lm.latest, info.version) > 0;
  return `<h1>Dashboard</h1><p class="sub">PinguinoLite is a light shell: no modules are loaded by default.</p>
  ${gh && gh.ok && gh.update ? `<div class="banner">PinguinoLite <b>${esc(gh.latest)}</b> is available (you have ${esc(info && info.version)}). <button class="btn pri" data-open="release">Open release page</button></div>` : ''}
  ${selfUpd ? `<div class="banner">PinguinoLite ${esc(lm.latest)} is ready. <button class="btn pri" data-act="selfupdate-apply">Restart &amp; update</button> <span class="d">Lite closes, updates and reopens.</span></div>` : ''}
  <div class="grid">
   <div class="card"><h3>Host (127.0.0.1:8770)</h3><div class="big">${h.reachable ? '<span style="color:var(--ok)">Reachable</span>' : '<span style="color:var(--bad)">Not reachable</span>'}</div>
     <div class="note">${h.reachable ? `/api/live answered HTTP ${esc(h.status)} in ${esc(h.ms)} ms` : 'Host is not running (or not on this PC). Lite works without it.'}</div></div>
   <div class="card"><h3>App version</h3><div class="big">${esc(info && info.version)}</div>
     <div class="note">${ghBusy ? 'Checking GitHub...' : !gh ? 'Not checked yet' : !gh.ok ? esc(gh.error) : gh.update ? `<span style="color:var(--warn)">Version ${esc(gh.latest)} available</span>` : `<span style="color:var(--ok)">Up to date</span>`}${gh && gh.at ? ` <span class="d">(${esc(ago(gh.at))})</span>` : ''}</div></div>
   <div class="card"><h3>Modules installed</h3><div class="big">${n}</div><div class="note">${r.length ? `${r.length} available${u ? `, <span style="color:var(--warn)">${u} update${u > 1 ? 's' : ''}</span>` : ''}` : 'no catalog yet'}</div></div>
   <div class="card"><h3>Last update check</h3><div class="big" style="font-size:20px">${us.last_check_at ? ago(iso(us.last_check_at)) : 'never'}</div>
     <div class="note">${us.last_check_at ? esc(us.result || '') + (us.error ? ' - ' + esc(us.error) : '') : 'PinguinoLink has not written update_status.json'}</div></div>
   <div class="card"><h3>PinguinoLink</h3><div class="big" style="font-size:20px">${writer ? esc(writer.name + ' ' + (writer.version || '')) : '<span style="color:var(--faint)">not connected</span>'}</div>
     <div class="note">${conn ? 'connector: ' + esc(conn.state) + (conn.detail ? ' - ' + esc(conn.detail) : '') : 'no status.json yet'}</div></div>
  </div>
  ${partsCard()}
  <div class="row"><button class="btn" data-open="host">Open Host dashboard</button><button class="btn" data-open="folder">Open Lite data folder</button><button class="btn" data-act="check">Check modules for updates</button><button class="btn pri" data-gh="1"${ghBusy ? ' disabled' : ''}>Check Lite for updates</button></div>
  <p class="note">Contract folder: <span class="mono">${esc(info && info.lite_dir)}</span></p>`;
}

function errBanner() {
  const u = state.upd && state.upd.data;
  return u && u.result === 'error' && u.error ? `<div class="banner" style="border-color:#ff5c5c66">PinguinoLink: ${esc(u.error)}</div>` : '';
}

function modules() {
  const r = rows();
  const c = state.catalog;
  let body;
  if (!c || !c.exists) body = `<div class="empty">No catalog yet.<br>PinguinoLink writes <span class="mono">modules_catalog.json</span> into <span class="mono">${esc(info && info.lite_dir)}</span>.</div>`;
  else if (c.error) body = `<div class="empty" style="color:var(--bad)">modules_catalog.json is not readable: ${esc(c.error)}</div>`;
  else if (!r.length) body = `<div class="empty">The catalog is empty.</div>`;
  else body = `<table><thead><tr><th>Module</th><th>Version</th><th>Status</th><th></th></tr></thead><tbody>${r.map(m => `<tr>
    <td><b>${esc(m.name || m.id)}</b><div class="d">${esc(m.description)}</div></td>
    <td class="mono">${m.installed ? esc(m.installed_version) : '-'}${m.installed && m.update ? ` -> ${esc(m.latest_version)}` : m.installed ? '' : ` <span class="d">(${esc(m.latest_version)})</span>`}</td>
    <td>${m.installed && m.conn && m.conn.state && m.conn.state !== 'running' && !m.busy ? `<span class="pill ${m.conn.state === 'error' || m.conn.state === 'degraded' ? 'bad' : ''}" title="${esc(m.conn.detail)} ${esc(m.conn.fix_hint)}">${esc(m.conn.state)}</span> ` : ''}${m.busy ? `<span class="pill warn">${esc(m.busy)}...</span>` : m.update ? '<span class="pill warn">Update available</span>' : m.installed ? '<span class="pill ok">Installed</span>' : '<span class="pill">Not installed</span>'}</td>
    <td style="text-align:right">${m.busy ? '' : m.update ? `<button class="btn pri" data-act="update" data-id="${esc(m.id)}">Update</button>` : m.installed ? `<button class="btn" data-act="rollback" data-id="${esc(m.id)}" title="Restore the previous version kept by PinguinoLink">Rollback</button>` : `<button class="btn pri" data-act="install" data-id="${esc(m.id)}">Install</button>`}</td></tr>`).join('')}</tbody></table>`;
  const gen = c && c.data && (c.data.generated || c.data.generated_at);
  return `<h1>Modules</h1><p class="sub">Modules available from PinguinoLink${gen ? ` - catalog from ${esc(ago(iso(gen)))}` : ''}.
   <span class="pill">Local packages only for now</span></p>
   ${errBanner()}<div class="card" style="padding:4px 8px">${body}</div>${modCard()}
   <div class="row"><button class="btn" data-act="check">Check for updates</button><button class="btn" data-open="folder">Open Lite data folder</button></div>`;
}

function renderNav() {
  const r = rows(), u = r.filter(x => x.update).length;
  const dot = up => `<span class="dot ${up ? 'running' : ''}" title="${up ? 'answering' : 'not answering'}"></span>`;
  const cs = state.status && state.status.data && state.status.data.modules || {};
  const cls = st => st === 'running' ? 'running' : st === 'degraded' ? 'warn' : st === 'error' ? 'bad' : '';
  const inst = r.filter(x => x.installed);
  // Only things that exist in Lite: its two pages, the two services it talks to, and what is installed. Availability = probes at launch + every 5 s.
  $('#nav').innerHTML = `<div class="brand"><img src="logo.png" alt=""><div><b>Pinguino<span class="accent">Lite</span></b><small>${info ? 'v' + esc(info.version) : ''}</small></div></div>
   <div class="item${page === 'dashboard' ? ' on' : ''}" data-page="dashboard"><span class="ic">🏠</span>Dashboard${gh && gh.ok && gh.update ? `<span class="tag">update</span>` : ''}</div>
   <div class="item${page === 'modules' ? ' on' : ''}" data-page="modules"><span class="ic">🧩</span>Modules${u ? `<span class="tag">${u} update${u > 1 ? 's' : ''}</span>` : ''}</div>
   <div class="item${page === 'replays' ? ' on' : ''}" data-page="replays"><span class="ic">🎮</span>Replays${(state.replays && state.replays.items.length) ? `<span class="tag">${state.replays.items.length}</span>` : ''}</div>
   <h6>Services</h6>
   <div class="item" data-page="dashboard"><span class="ic">🔗</span>Link${dot(ports['7777'])}</div>
   <div class="item" data-page="dashboard"><span class="ic">🖥️</span>Host${dot(ports['8770'])}</div>
   ${inst.length ? `<h6>Installed</h6>` + inst.map(m => `<div class="item" data-page="modules"><span class="ic">📦</span>${esc(m.name || m.id)}<span class="dot ${cls(m.conn && m.conn.state)}"></span></div>`).join('') : ''}`;
}

function render() {
  renderNav();
  if (document.activeElement && document.activeElement.id === 'ivl') return;   // don't rebuild the page under the slider while it is being dragged
  $('#main').innerHTML = page === 'modules' ? modules() : page === 'replays' ? replaysPage() : dashboard();
}

// Alt+F4 / window close: the shell asks, we confirm in-page.
const qm = () => $('#qm').classList.contains('on');
$('#qm-cancel').onclick = () => $('#qm').classList.remove('on');
$('#qm-ok').onclick = () => inv('quit_app').catch(() => {});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && qm()) $('#qm').classList.remove('on'); });
try { window.__TAURI__.event.listen('confirm-quit', () => { $('#qm').classList.add('on'); $('#qm-ok').focus(); }); } catch {}
document.addEventListener('input', e => { if (e.target.id === 'ivl') $('#ivl-v').textContent = e.target.value; });
document.addEventListener('change', async e => {
  if (e.target.id !== 'ivl') return;
  const n = await inv('replay_set_interval', { secs: +e.target.value }).catch(() => null);
  if (n) { state.replays = { ...(state.replays || {}), interval: n }; toast(`Checking for replays every ${n} s`); }
});
document.addEventListener('click', async e => {
  const nav = e.target.closest('nav [data-page]');
  if (nav) { page = nav.dataset.page; try { localStorage.setItem('page', page); } catch {} return render(); }
  if (e.target.closest('[data-gh]')) { checkParts(); return checkLite(true); }
  if (e.target.closest('[data-parts-check]')) return checkParts();
  const pb = e.target.closest('[data-part]');
  if (pb) { const r = await inv('parts_apply', { ids: [pb.dataset.part] }).catch(err => ({ ok: false, message: String(err) })); if (!r.ok) return toast(r.message); return pollJob(); }
  const mv = e.target.closest('[data-mod-verify]');
  if (mv) { const ids = mv.dataset.modVerify === 'all' ? ['link', 'lite'].concat((mods && mods.modules || []).filter(m => m.installed).map(m => m.id)) : [mv.dataset.modVerify]; const r = await inv('parts_verify', { ids }).catch(err => ({ ok: false, message: String(err) })); if (!r.ok) return toast(r.message); return pollJob(); }
  const me = e.target.closest('[data-mod-eject]');
  if (me) { const r = await inv('parts_eject', { id: me.dataset.modEject }).catch(err => ({ ok: false, message: String(err) })); if (!r.ok) return toast(r.message); return pollJob(); }
  const mi = e.target.closest('[data-mod-install]');
  if (mi) { const r = await inv('parts_install', { id: mi.dataset.modInstall }).catch(err => ({ ok: false, message: String(err) })); if (!r.ok) return toast(r.message); return pollJob(); }
  if (e.target.closest('[data-parts-rollback]')) { const r = await inv('parts_rollback').catch(err => ({ ok: false, message: String(err) })); if (!r.ok) return toast(r.message); return pollJob(); }
  if (e.target.closest('[data-scan]')) { toast('Scanning...'); const s = await inv('replay_scan').catch(err => ({ error: String(err) })); toast(s.error ? 'Scan failed: ' + s.error : `Scan done: ${s.new} new, ${s.errors} unreadable`); return refresh(); }
  const o = e.target.closest('[data-open]');
  if (o) return inv('open_target', { target: o.dataset.open }).catch(err => toast(String(err)));
  const a = e.target.closest('[data-act]');
  if (a) {
    try { const r = await inv('send_request', { action: a.dataset.act, id: a.dataset.id || null }); toast('Request sent to PinguinoLink (' + r.file + ')'); }
    catch (err) { toast('Could not send request: ' + err); }
    setTimeout(refresh, 1200);
  }
});

window.pgFsState = () => {};
document.addEventListener('keydown', e => { if (e.key === 'F11') { e.preventDefault(); inv('toggle_fullscreen').catch(() => {}); } });
(async () => {
  try { page = localStorage.getItem('page') || 'dashboard'; } catch {}
  info = await inv('lite_info').catch(() => null);
  await refresh();
  loadMods();
  if (!gh || !gh.at || Date.now() - gh.at > 864e5) { checkLite(false); checkParts(); }   // quiet daily check
  setInterval(refresh, 5000);   // cheap: 1 loopback probe + up to 5 tiny local files
})();
</script>
</body>
</html>
