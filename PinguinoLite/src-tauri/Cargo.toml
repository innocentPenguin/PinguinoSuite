[package]
name = "pinguino-lite"
version = "0.1.0"
description = "PinguinoLite - light UI shell: Dashboard + available Modules (catalog and updates come from PinguinoLink)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
boxcars = "0.10"

[profile.release]
opt-level = "s"
lto = true

[features]
custom-protocol = ["tauri/custom-protocol"]
